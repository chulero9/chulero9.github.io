<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const StudioDashboard = () => {
            const [inRoom, setInRoom] = useState(false);
            const [roomCode, setRoomCode] = useState('');
            const [studioName, setStudioName] = useState('');
            
            const [reporters, setReporters] = useState({});
            const [listeningTo, setListeningTo] = useState(null);
            const [rxLevel, setRxLevel] = useState(0);
            
            const [alerts, setAlerts] = useState([]);
            const [unreadAlerts, setUnreadAlerts] = useState(0);
            const [selectedAlert, setSelectedAlert] = useState(null);
            
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            
            const [studioMicStream, setStudioMicStream] = useState(null);
            const [studioMicActive, setStudioMicActive] = useState(false);
            
            const [alertSent, setAlertSent] = useState({});
            const [connectionError, setConnectionError] = useState(null);
            
            const peerRef = useRef(null);
            const mqttRef = useRef(null);
            const audioRef = useRef(null);
            const analyserRef = useRef(null);
            const animationFrameRef = useRef(null);
            const studioMicRef = useRef(null);
            const audioCtxRef = useRef(null);
            const listeningToRef = useRef(null);
            const responseInputRef = useRef(null);
            const sourceRef = useRef(null);       // FIX 3: track MediaStreamSource node
            // FIX 5: globalStreams y globalCalls como refs dentro del componente
            const globalStreams = useRef(new Map());
            const globalCalls = useRef(new Map());
            
            useEffect(() => {
                setRoomCode(Math.random().toString(36).substring(2, 6).toUpperCase());
            }, []);

            useEffect(() => { listeningToRef.current = listeningTo; }, [listeningTo]);
            
            const joinRoom = async () => {
                if (!roomCode || !studioName) return alert('Completá todos los campos');

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true
                        }
                    });
                    studioMicRef.current = stream;
                    setStudioMicStream(stream);
                    setStudioMicActive(true);
                } catch (e) {
                    console.warn('Iniciando sin micrófono local. El retorno no funcionará hasta activarlo.');
                }
                
                const studioPeerId = `studio_${roomCode}`;
                
                peerRef.current = new Peer(studioPeerId, {
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });
                
                peerRef.current.on('open', () => {
                    setConnectionError(null);
                    initMQTT();
                    setInRoom(true);
                });

                peerRef.current.on('error', (err) => {
                    console.error('PeerJS error:', err);
                    setConnectionError('Error de conexión PeerJS. ¿Sala ocupada o servidor caído?');
                });
                
                peerRef.current.on('call', (call) => {
                    console.log('Incoming call from reporter:', call.peer);
                    
                    const answerStream = studioMicRef.current || createEmptyAudioStream();
                    call.answer(answerStream);
                    globalCalls.current.set(call.peer, call);
                    
                    call.on('stream', (remoteStream) => {
                        console.log('Got stream from reporter:', call.peer);
                        globalStreams.current.set(call.peer, remoteStream);
                        
                        setReporters(prev => ({
                            ...prev,
                            [call.peer]: {
                                ...prev[call.peer],
                                hasAudio: true,
                                streamId: remoteStream.id
                            }
                        }));
                    });
                    
                    call.on('close', () => {
                        globalStreams.current.delete(call.peer);
                        globalCalls.current.delete(call.peer);
                        if (listeningToRef.current === call.peer) stopListening();
                        setReporters(prev => {
                            const newState = { ...prev };
                            if (newState[call.peer]) {
                                newState[call.peer] = { ...newState[call.peer], hasAudio: false };
                            }
                            return newState;
                        });
                    });
                });
            };
            
            const createEmptyAudioStream = () => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();
                    const dest = ctx.createMediaStreamDestination();
                    return dest.stream;
                } catch (e) {
                    return new MediaStream();
                }
            };

            // FIX 1: toggleStudioMic ahora reemplaza el track en todas las llamadas activas
            const toggleStudioMic = async () => {
                if (studioMicActive) {
                    if (studioMicRef.current) {
                        studioMicRef.current.getTracks().forEach(t => t.stop());
                        studioMicRef.current = null;
                    }

                    // Reemplazar track con silencio en todas las conexiones activas
                    globalCalls.current.forEach(call => {
                        try {
                            const pc = call.peerConnection;
                            if (pc) {
                                pc.getSenders().forEach(sender => {
                                    if (sender.track?.kind === 'audio') {
                                        sender.replaceTrack(null);
                                    }
                                });
                            }
                        } catch (e) {
                            console.warn('replaceTrack(null) error:', e);
                        }
                    });

                    setStudioMicStream(null);
                    setStudioMicActive(false);
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true
                            }
                        });
                        studioMicRef.current = stream;
                        const [newTrack] = stream.getAudioTracks();

                        // Reemplazar track con el nuevo mic en todas las conexiones activas
                        globalCalls.current.forEach(call => {
                            try {
                                const pc = call.peerConnection;
                                if (pc) {
                                    pc.getSenders().forEach(sender => {
                                        if (sender.track?.kind === 'audio' || sender.track === null) {
                                            sender.replaceTrack(newTrack);
                                        }
                                    });
                                }
                            } catch (e) {
                                console.warn('replaceTrack(newTrack) error:', e);
                            }
                        });

                        setStudioMicStream(stream);
                        setStudioMicActive(true);
                    } catch (e) {
                        alert('No se pudo acceder al micrófono del estudio');
                    }
                }
            };
            
            const initMQTT = () => {
                const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    clientId: `mqtt_studio_${Math.random().toString(16).substr(2, 8)}`,
                    reconnectPeriod: 3000,
                    will: {
                        topic: `radio/${roomCode}/studio`,
                        payload: JSON.stringify({ status: 'offline' }),
                        retain: true
                    }
                });
                
                mqttRef.current = client;
                
                client.on('connect', () => {
                    setConnectionError(null);
                    client.subscribe(`radio/${roomCode}/reporters`);
                    client.subscribe(`radio/${roomCode}/alerts`);
                    client.subscribe(`radio/${roomCode}/chat`);
                    
                    client.publish(`radio/${roomCode}/studio`, JSON.stringify({
                        name: studioName,
                        status: 'online',
                        timestamp: Date.now()
                    }), { retain: true });
                });

                client.on('error', (err) => {
                    console.error('MQTT error:', err);
                    setConnectionError('Error de conexión MQTT. Alertas y chat pueden no funcionar.');
                });

                // FIX 4: usar 'offline' en lugar de 'close' + client.reconnecting (no estándar)
                client.on('offline', () => {
                    setConnectionError('Desconectado del broker MQTT. Reconectando...');
                });
                
                client.on('message', (topic, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        
                        if (topic.includes('/reporters')) {
                            setReporters(prev => ({ ...prev, [data.id]: { ...prev[data.id], ...data } }));
                        }
                        if (topic.includes('/alerts') && !topic.includes('/response')) {
                            handleNewAlert(data);
                        }
                        if (topic.includes('/chat')) {
                            setChatMessages(prev => [...prev, data].slice(-100));
                        }
                    } catch (e) {}
                });
            };
            
            const handleNewAlert = (alert) => {
                setAlerts(prev => [alert, ...prev]);
                setUnreadAlerts(c => c + 1);
                
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioCtx();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = alert.severity === 'high' ? 880 : 440;
                    gain.gain.setValueAtTime(alert.severity === 'high' ? 0.3 : 0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (alert.severity === 'high' ? 0.5 : 0.3));
                    osc.start();
                    osc.stop(ctx.currentTime + (alert.severity === 'high' ? 0.5 : 0.3));
                    // Cerrar el contexto temporal luego de reproducir
                    osc.onended = () => { try { ctx.close(); } catch(e) {} };
                } catch (e) {}
            };
            
            const listenToReporter = useCallback((reporterId) => {
                const stream = globalStreams.current.get(reporterId);
                if (!stream) return;
                
                stopListening();
                setListeningTo(reporterId);
                
                if (!audioRef.current) {
                    audioRef.current = new Audio();
                    audioRef.current.autoplay = true;
                }
                
                audioRef.current.srcObject = stream;
                audioRef.current.play().catch(e => {
                    document.addEventListener('click', function retry() {
                        audioRef.current.play().catch(() => {});
                        document.removeEventListener('click', retry);
                    }, { once: true });
                });
                
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!audioCtxRef.current) audioCtxRef.current = new AudioCtx();

                    // FIX 3: desconectar el source node anterior antes de crear uno nuevo
                    if (sourceRef.current) {
                        try { sourceRef.current.disconnect(); } catch(e) {}
                        sourceRef.current = null;
                    }
                    if (analyserRef.current) {
                        try { analyserRef.current.disconnect(); } catch(e) {}
                    }
                    
                    const source = audioCtxRef.current.createMediaStreamSource(stream);
                    sourceRef.current = source;
                    analyserRef.current = audioCtxRef.current.createAnalyser();
                    analyserRef.current.fftSize = 256;
                    source.connect(analyserRef.current);
                    
                    const dataArray = new Uint8Array(analyserRef.current.frequencyBinCount);
                    const updateVU = () => {
                        if (!analyserRef.current) return;
                        analyserRef.current.getByteFrequencyData(dataArray);
                        const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                        setRxLevel(avg);
                        animationFrameRef.current = requestAnimationFrame(updateVU);
                    };
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                    updateVU();
                } catch (e) {}
            }, []);
            
            const stopListening = useCallback(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.srcObject = null;
                }
                setListeningTo(null);
                setRxLevel(0);
                if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);

                // FIX 3: desconectar source node al dejar de escuchar
                if (sourceRef.current) {
                    try { sourceRef.current.disconnect(); } catch(e) {}
                    sourceRef.current = null;
                }
                if (analyserRef.current) {
                    try { analyserRef.current.disconnect(); } catch (e) {}
                    analyserRef.current = null;
                }
            }, []);

            // FIX 6: remover un reporter desconectado manualmente de la lista
            const dismissReporter = (id) => {
                if (listeningToRef.current === id) stopListening();
                globalStreams.current.delete(id);
                globalCalls.current.delete(id);
                setReporters(prev => {
                    const newState = { ...prev };
                    delete newState[id];
                    return newState;
                });
            };
            
            const sendStudioAlert = (reporterId, type) => {
                if (!mqttRef.current?.connected) return;
                
                mqttRef.current.publish(`radio/${roomCode}/studio_alert`, JSON.stringify({
                    reporterId: reporterId,
                    type: type,
                    from: studioName,
                    timestamp: Date.now()
                }));
                
                setAlertSent(prev => ({
                    ...prev,
                    [reporterId]: { type, time: Date.now() }
                }));
                
                setTimeout(() => {
                    setAlertSent(prev => {
                        const newState = { ...prev };
                        delete newState[reporterId];
                        return newState;
                    });
                }, 3000);
            };
            
            const acknowledgeAlert = (timestamp) => {
                setAlerts(prev => prev.map(a => a.timestamp === timestamp ? { ...a, acknowledged: true } : a));
                setUnreadAlerts(c => Math.max(0, c - 1));
            };
            
            const respondToAlert = (message) => {
                if (!selectedAlert || !mqttRef.current) return;
                mqttRef.current.publish(`radio/${roomCode}/alerts/response`, JSON.stringify({
                    to: selectedAlert.reporterId,
                    from: studioName,
                    message,
                    timestamp: Date.now()
                }));
                setSelectedAlert(null);
            };
            
            const sendChat = (e) => {
                e.preventDefault();
                if (!chatInput.trim() || !mqttRef.current) return;
                const payload = {
                    id: Date.now(),
                    sender: studioName,
                    text: chatInput.trim(),
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                };
                mqttRef.current.publish(`radio/${roomCode}/chat`, JSON.stringify(payload));
                setChatMessages(prev => [...prev, payload]);
                setChatInput('');
            };
            
            // FIX 2: cleanup completo del AudioContext principal
            useEffect(() => {
                return () => {
                    stopListening();
                    if (peerRef.current) peerRef.current.destroy();
                    if (mqttRef.current) mqttRef.current.end();
                    if (studioMicRef.current) studioMicRef.current.getTracks().forEach(t => t.stop());
                    // FIX 2: cerrar AudioContext al desmontar
                    if (audioCtxRef.current) {
                        try { audioCtxRef.current.close(); } catch(e) {}
                        audioCtxRef.current = null;
                    }
                    globalStreams.current.clear();
                    globalCalls.current.clear();
                };
            }, [stopListening]);
            
            const getAlertIcon = (type) => {
                const icons = { ready: '🎤', problem: '⚠️', visual: '👁️', blocked: '🚧', '5min': '⏱️', custom: '✏️' };
                return icons[type] || '📢';
            };
            
            if (!inRoom) {
                return (
                    <div className="lobby-screen">
                        <div className="lobby-box">
                            <h1>STREAM<span>RADIO</span></h1>
                            <p>DASHBOARD DE ESTUDIO RX + IFB + ALERTAS</p>
                            <input className="lobby-input" placeholder="CÓDIGO DE SALA" value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} />
                            <input className="lobby-input" placeholder="NOMBRE DEL ESTUDIO" value={studioName} onChange={e => setStudioName(e.target.value)} />
                            <button className="lobby-btn" onClick={joinRoom}>ENTRAR AL HUB</button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="dashboard">
                    <audio ref={audioRef} style={{display: 'none'}} />
                    <div className="top-bar">
                        <div className="logo">
                            STREAM<span>RADIO</span>
                            <small>RX + IFB + ALERTAS</small>
                        </div>
                        <div className="top-status">
                            {connectionError && <span className="connection-error" onClick={() => setConnectionError(null)} title="Cerrar">⚠️ {connectionError}</span>}
                            <span className="room-code">SALA: <b>{roomCode}</b></span>
                            <span className="online-status">● ONLINE</span>
                        </div>
                    </div>
                    
                    <div className="main-content">
                        <div className="info-panel">
                            <h2>📊 Estado del Sistema</h2>
                            
                            <div className="info-box">
                                <div className="info-label">Móviles Conectados</div>
                                <div className="info-value">{Object.keys(reporters).length}</div>
                            </div>
                            
                            <div className="info-box">
                                <div className="info-label">En Transmisión</div>
                                <div className="info-value" style={{color: '#ef4444'}}>
                                    {Object.values(reporters).filter(r => r.status === 'live').length}
                                </div>
                            </div>
                            
                            <div className="info-box">
                                <div className="info-label">Alertas Pendientes</div>
                                <div className="info-value" style={{color: unreadAlerts > 0 ? '#f59e0b' : '#22c55e'}}>
                                    {unreadAlerts}
                                </div>
                            </div>
                            
                            <div className="status-indicator">
                                <div className="status-dot"></div>
                                <div className="status-text">RECEPTOR ACTIVO</div>
                            </div>
                            
                            <div className="ifb-control">
                                <div className="ifb-title">🎙️ Micrófono para Retorno (IFB)</div>
                                <button className={`mic-btn ${studioMicActive ? 'on' : 'off'}`} onClick={toggleStudioMic}>
                                    {studioMicActive ? '🔴 MIC ACTIVO (IFB ON)' : '⚫ MIC INACTIVO (IFB OFF)'}
                                </button>
                                <div className="mic-hint">
                                    {studioMicActive ? 'El reportero puede escucharte hablar' : 'Activa para hablar al reportero'}
                                </div>
                            </div>
                            
                            {listeningTo && (
                                <div className="listening-info">
                                    <div className="listening-label">Escuchando</div>
                                    <div className="listening-name">{reporters[listeningTo]?.name || 'Móvil'}</div>
                                    <div className="vu-container">
                                        <div className="vu-bar" style={{width: `${Math.min(rxLevel * 2, 100)}%`}}></div>
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="center-panel">
                            <div className="tabs">
                                <button className="tab active">
                                    📻 Móviles ({Object.keys(reporters).length})
                                </button>
                            </div>
                            
                            <div className="panel-content">
                                <div className="rx-grid">
                                    {Object.keys(reporters).length === 0 && (
                                        <div className="empty-state">Esperando móviles en la sala...</div>
                                    )}
                                    
                                    {Object.entries(reporters).map(([id, reporter]) => {
                                        const isListening = listeningTo === id;
                                        const hasAudio = reporter.hasAudio || globalStreams.current.has(id);
                                        const isDisconnected = !hasAudio;
                                        const sentAlert = alertSent[id];
                                        
                                        return (
                                            <div key={id} className={`rx-card ${reporter.status === 'live' ? 'live' : ''} ${isListening ? 'listening' : ''}`}>
                                                {sentAlert && (
                                                    <div className="on-air-indicator">
                                                        {sentAlert.type === 'on_air' ? '🔴 ENVIADO' : '⚠️ ENVIADO'}
                                                    </div>
                                                )}
                                                
                                                <div className="rx-header">
                                                    <div className="rx-name">
                                                        <div className={`led ${reporter.status === 'live' ? 'red' : ''}`}></div>
                                                        {reporter.name || 'Móvil'}
                                                        {reporter.status === 'live' && <span className="live-tag">EN VIVO</span>}
                                                    </div>
                                                </div>
                                                
                                                <div className="rx-actions">
                                                    {hasAudio ? (
                                                        isListening ? (
                                                            <>
                                                                <button className="rx-btn stop" onClick={stopListening}>⏹ CORTAR</button>
                                                                <button className="rx-btn play" onClick={() => listenToReporter(id)} style={{background: '#22c55e'}}>↻</button>
                                                            </>
                                                        ) : (
                                                            <button className="rx-btn play" onClick={() => listenToReporter(id)}>▶ ESCUCHAR</button>
                                                        )
                                                    ) : (
                                                        <button className="rx-btn" disabled>SIN AUDIO</button>
                                                    )}
                                                </div>

                                                {/* FIX 6: botón para limpiar reporters desconectados */}
                                                {isDisconnected && (
                                                    <button className="rx-dismiss" onClick={() => dismissReporter(id)}>
                                                        ✕ Quitar de la lista
                                                    </button>
                                                )}
                                                
                                                {isListening && (
                                                    <div className="alert-actions">
                                                        <button 
                                                            className="alert-btn-studio attention"
                                                            onClick={() => sendStudioAlert(id, 'attention')}
                                                            disabled={sentAlert?.type === 'attention'}
                                                        >
                                                            ⚠️ {sentAlert?.type === 'attention' ? 'ENVIADO' : 'ATENTO'}
                                                        </button>
                                                        <button 
                                                            className="alert-btn-studio on-air"
                                                            onClick={() => sendStudioAlert(id, 'on_air')}
                                                            disabled={sentAlert?.type === 'on_air'}
                                                        >
                                                            🔴 {sentAlert?.type === 'on_air' ? 'ENVIADO' : 'AL AIRE'}
                                                        </button>
                                                    </div>
                                                )}
                                                
                                                {studioMicActive && isListening && (
                                                    <div className="ifb-status-bar">
                                                        🎧 Retorno activo: el reportero te escucha
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                        
                        <div className="alerts-panel">
                            <div className="alerts-header">
                                <h2>🚨 Alertas de Campo</h2>
                                {unreadAlerts > 0 && <span className="unread-badge">{unreadAlerts}</span>}
                            </div>
                            
                            <div className="alerts-list">
                                {alerts.length === 0 && <div style={{textAlign: 'center', color: '#666', marginTop: 30}}>Sin alertas recientes</div>}
                                
                                {alerts.map((alert, i) => (
                                    <div key={i} className={`alert-card ${alert.severity} ${alert.acknowledged ? 'ack' : ''}`} onClick={() => { acknowledgeAlert(alert.timestamp); setSelectedAlert(alert); }}>
                                        {!alert.acknowledged && <div className="alert-pulse"></div>}
                                        <div className="alert-header">
                                            <span className="alert-reporter">{alert.reporterName}</span>
                                            <span className="alert-time">{new Date(alert.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                        </div>
                                        <div className="alert-type" style={{color: alert.severity === 'high' ? '#ef4444' : alert.severity === 'medium' ? '#f59e0b' : '#3b82f6'}}>
                                            {getAlertIcon(alert.alertId)} {alert.alertLabel}
                                        </div>
                                        <div className="alert-message">{alert.message}</div>
                                    </div>
                                ))}
                            </div>
                            
                            <div className="chat-section">
                                <div className="chat-header-small">💬 Chat General</div>
                                <div className="chat-messages-small">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className="chat-msg-small">
                                            <div className="sender">{m.sender}</div>
                                            <div>{m.text}</div>
                                        </div>
                                    ))}
                                </div>
                                <form className="chat-input-small" onSubmit={sendChat}>
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Mensaje..." />
                                    <button type="submit">➤</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    {selectedAlert && (
                        <div className="modal-overlay" onClick={() => setSelectedAlert(null)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>{getAlertIcon(selectedAlert.alertId)} Alerta de {selectedAlert.reporterName}</h2>
                                <div className="modal-details">
                                    <p><strong>Tipo:</strong> {selectedAlert.alertLabel}</p>
                                    <p><strong>Mensaje:</strong> {selectedAlert.message}</p>
                                    <p><strong>Estado:</strong> {selectedAlert.isLive ? '🔴 Transmitiendo' : '⚫ Standby'}</p>
                                </div>
                                <p style={{marginBottom: 10, fontWeight: 'bold'}}>Respuesta rápida:</p>
                                <div className="quick-responses">
                                    {['Recibido, aguardamos', '¿Podés acercarte?', 'Tenemos tu señal', 'Volvé al móvil', 'Buscá mejor señal', 'Estamos al aire en 30s'].map((resp, i) => (
                                        <button key={i} onClick={() => respondToAlert(resp)}>{resp}</button>
                                    ))}
                                </div>
                                <textarea ref={responseInputRef} className="response-input" placeholder="O escribí respuesta personalizada..." onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); respondToAlert(e.target.value); } }} />
                                <div className="modal-actions">
                                    <button className="btn-secondary" onClick={() => setSelectedAlert(null)}>Cerrar</button>
                                    <button className="btn-primary" onClick={() => respondToAlert(responseInputRef.current?.value ?? '')}>Enviar Respuesta</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudioDashboard />);
    </script>
</body>
</html>
