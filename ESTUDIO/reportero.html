<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StreamRadio - Reportero</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html { -webkit-text-size-adjust: 100%; }
        
        body { 
            background: #050505; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .lobby-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
        }
        
        .lobby-box {
            background: #111;
            padding: 50px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .lobby-box h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 900;
        }
        
        .lobby-box h1 span { color: #3b82f6; }
        
        .lobby-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        
        .lobby-input {
            width: 100%;
            background: #0a0a0a;
            border: 2px solid #333;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
        }
        
        .lobby-input:focus { outline: none; border-color: #3b82f6; }
        
        .lobby-btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            min-height: 48px;
            -webkit-tap-highlight-color: transparent;
        }

        .lobby-btn:disabled {
            background: #334155;
            color: #666;
            cursor: not-allowed;
        }
        
        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .top-bar {
            padding: 15px 30px;
            background: #111;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
        }
        
        .logo span { color: #3b82f6; }
        
        .logo small {
            font-size: 0.75rem;
            color: #666;
            margin-left: 10px;
            font-weight: 400;
        }
        
        .top-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .connection-error {
            color: #f59e0b;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 8px;
            background: rgba(245, 158, 11, 0.15);
            border-radius: 6px;
            margin-right: 10px;
        }
        .connection-error:hover { opacity: 0.9; }
        
        .room-code {
            color: #666;
            font-size: 0.9rem;
        }
        
        .room-code b { color: white; margin-left: 5px; }
        
        .online-status {
            color: #22c55e;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .info-panel {
            width: 300px;
            background: #0a0a0a;
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .info-panel h2 {
            font-size: 0.9rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #666;
        }
        
        .info-box {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        
        .info-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .info-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        
        .status-indicator.live {
            background: #1e1515;
            border-color: #ef4444;
        }
        
        .status-indicator.standby {
            background: #14201a;
            border-color: #22c55e;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        .status-dot.red { background: #ef4444; }
        .status-dot.green { background: #22c55e; }
        
        .status-text {
            font-weight: bold;
            font-size: 0.85rem;
        }
        
        .status-indicator.live .status-text { color: #ef4444; }
        .status-indicator.standby .status-text { color: #22c55e; }
        
        .ifb-control {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #333;
        }
        
        .ifb-title {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: #94a3b8;
        }
        
        .ifb-status {
            font-size: 0.9rem;
            color: #60a5fa;
            padding: 8px;
            background: #1e3a8a;
            border-radius: 8px;
            text-align: center;
        }
        
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            min-width: 0;
        }
        
        .tabs {
            display: flex;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        
        .tab {
            padding: 15px 25px;
            background: none;
            border: none;
            color: #666;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        
        .tab.active { color: white; border-bottom: 2px solid #3b82f6; background: #1a1a1a; }
        
        .panel-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .studio-alert-banner {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .studio-alert-banner.attention {
            background: rgba(245, 158, 11, 0.2);
            border: 2px solid #f59e0b;
            color: #facc15;
        }
        
        .studio-alert-banner.on_air {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
        }
        
        .alert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        
        .alert-btn {
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #333;
            background: #1a1a1a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .alert-btn:hover {
            border-color: #3b82f6;
            background: #1e3a8a;
        }
        
        .alert-btn.high { border-color: #ef4444; }
        .alert-btn.high:hover { background: rgba(239, 68, 68, 0.2); }
        
        .alert-btn.medium { border-color: #f59e0b; }
        .alert-btn.medium:hover { background: rgba(245, 158, 11, 0.2); }
        
        .status-toggle {
            width: 100%;
            padding: 20px;
            border-radius: 12px;
            border: none;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 25px;
            transition: all 0.2s;
        }
        
        .status-toggle.standby {
            background: #22c55e;
            color: black;
        }
        
        .status-toggle.live {
            background: #ef4444;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .alerts-panel {
            width: 350px;
            background: #0a0a0a;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .alerts-header {
            padding: 20px;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        
        .alerts-header h2 {
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .responses-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .response-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid #3b82f6;
        }
        
        .response-card .from { font-weight: bold; color: #3b82f6; font-size: 0.85rem; margin-bottom: 6px; }
        .response-card .msg { color: #cbd5e1; font-size: 0.95rem; line-height: 1.4; }
        .response-card .time { font-size: 0.75rem; color: #666; margin-top: 8px; }
        
        .chat-section {
            height: 220px;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .chat-header-small {
            padding: 12px 20px;
            background: #111;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
        }
        
        .chat-messages-small {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-msg-small {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
        }
        
        .chat-msg-small .sender { font-weight: bold; color: #3b82f6; font-size: 0.75rem; margin-bottom: 4px; }
        
        .chat-input-small {
            display: flex;
            padding: 12px;
            background: #111;
            gap: 8px;
            border-top: 1px solid #333;
        }
        
        .chat-input-small input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .chat-input-small input:focus { outline: none; border-color: #3b82f6; }
        
        .chat-input-small button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Mobile broadcast */
        .mobile-broadcast { display: none; }
        
        .mobile-header-bar {
            background: #1E1E1E;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .mobile-header-status {
            color: #888;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .mobile-header-status.live { color: #ef4444; }
        .mobile-retorno-pill {
            background: #219653;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mobile-retorno-pill.off { background: #333; color: #888; }
        .mobile-vu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 24px 0;
        }
        .mobile-vu-meter {
            width: 40px;
            height: 120px;
            background: #1E1E1E;
            border-radius: 20px;
            display: flex;
            flex-direction: column-reverse;
            padding: 6px;
            gap: 4px;
        }
        .mobile-vu-segment {
            flex: 1;
            min-height: 8px;
            background: #333;
            border-radius: 6px;
            transition: background 0.1s;
        }
        .mobile-vu-segment.active { background: #219653; }
        .mobile-vu-segment.peaking { background: #ef4444; }
        .mobile-vu-badge {
            margin-top: 10px;
            padding: 6px 14px;
            background: #1E1E1E;
            border-radius: 8px;
            color: #60a5fa;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .mobile-btn-al-aire {
            width: 100%;
            padding: 24px;
            background: #219653;
            border: none;
            border-radius: 14px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(33, 150, 83, 0.3);
            transition: all 0.2s;
        }
        .mobile-btn-al-aire.live {
            background: #ef4444;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3);
        }
        .mobile-btn-al-aire .icon { font-size: 2rem; }
        .mobile-btn-al-aire .label { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; }
        .mobile-btn-al-aire .sublabel { font-size: 0.85rem; opacity: 0.9; }
        .mobile-btn-notificar {
            width: 100%;
            padding: 16px 20px;
            background: #D35400;
            border: none;
            border-radius: 14px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.95rem;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(211, 84, 0, 0.3);
            position: relative;
        }
        /* FIX 8: badge de alerta entrante sobre el botón notificar */
        .mobile-alert-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: #f59e0b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 900;
            animation: pulse 1s infinite;
        }
        .mobile-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a0a0a;
            padding: 12px 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            gap: 12px;
            border-top: 1px solid #333;
        }
        .mobile-nav-btn {
            flex: 1;
            max-width: 80px;
            padding: 14px;
            background: #1E1E1E;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-nav-btn.active { background: #219653; }
        .mobile-nav-btn:active { transform: scale(0.98); }
        .mobile-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-radius: 20px 20px 0 0;
            max-height: 75vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .mobile-sheet.open { transform: translateY(0); }
        .mobile-sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .mobile-sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .mobile-sheet-handle {
            width: 40px;
            height: 4px;
            background: #444;
            border-radius: 2px;
            margin: 12px auto;
        }
        .mobile-sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 30px;
        }
        .mobile-sheet-header {
            padding: 10px 0 20px;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .desktop-dashboard { display: none !important; }
            .mobile-broadcast {
                display: flex;
                flex-direction: column;
                padding: 20px;
                padding-bottom: 100px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                min-height: 100vh;
            }
            .main-content {
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }
            .info-panel {
                width: 100%;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #333;
                padding: 15px;
            }
            .center-panel { min-height: auto; }
            .alerts-panel {
                width: 100%;
                min-height: 200px;
                border-left: none;
                border-top: 1px solid #333;
            }
            .top-bar {
                padding: 12px 15px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo { font-size: 1.2rem; }
            .logo small { font-size: 0.65rem; margin-left: 6px; }
            .top-status {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 10px;
            }
            .connection-error { font-size: 0.75rem; padding: 6px 10px; }
            .room-code { font-size: 0.85rem; }
            .alert-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .alert-btn { padding: 18px 12px; font-size: 0.85rem; min-height: 52px; }
            .status-toggle { padding: 18px; font-size: 1rem; min-height: 52px; }
            .panel-content { padding: 15px; }
            .studio-alert-banner { padding: 16px; font-size: 1.1rem; }
            .chat-section { height: 180px; min-height: 180px; }
        }

        @media (max-width: 400px) {
            .lobby-box { padding: 30px 20px; }
            .lobby-box h1 { font-size: 2rem; }
            .alert-grid { grid-template-columns: 1fr; }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .top-bar { padding-top: max(12px, env(safe-area-inset-top)); }
            .lobby-screen { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ALERT_TYPES = [
            { id: 'ready',   label: 'Listo',         severity: 'normal', icon: '🎤' },
            { id: 'problem', label: 'Problema',       severity: 'high',   icon: '⚠️' },
            { id: 'visual',  label: 'Visual',         severity: 'medium', icon: '👁️' },
            { id: 'blocked', label: 'Bloqueado',      severity: 'high',   icon: '🚧' },
            { id: '5min',    label: '5 min',          severity: 'medium', icon: '⏱️' },
            { id: 'custom',  label: 'Personalizado',  severity: 'normal', icon: '✏️' }
        ];

        const ReporterDashboard = () => {
            const [inRoom, setInRoom]                     = useState(false);
            const [connecting, setConnecting]             = useState(false); // FIX 3
            const [roomCode, setRoomCode]                 = useState('');
            const [reporterName, setReporterName]         = useState('');
            const [status, setStatus]                     = useState('standby');
            const [studioAlert, setStudioAlert]           = useState(null);
            const [unreadStudioAlert, setUnreadStudioAlert] = useState(false); // FIX 8
            const [responses, setResponses]               = useState([]);
            const [chatMessages, setChatMessages]         = useState([]);
            const [chatInput, setChatInput]               = useState('');
            const [connectionError, setConnectionError]   = useState(null);
            const [customAlertMessage, setCustomAlertMessage] = useState('');
            const [mqttConnected, setMqttConnected]       = useState(false);
            const [ifbConnected, setIfbConnected]         = useState(false);
            const [micLevel, setMicLevel]                 = useState(0);
            const [micMuted, setMicMuted]                 = useState(false);
            const [mobileSheet, setMobileSheet]           = useState(null);

            const peerRef             = useRef(null);
            const mqttRef             = useRef(null);
            const callRef             = useRef(null);
            const micStreamRef        = useRef(null);
            const ifbAudioRef         = useRef(null);
            const analyserRef         = useRef(null);
            const animationFrameRef   = useRef(null);
            const audioCtxVuRef       = useRef(null); // FIX 2: ref dedicado para el AudioContext del VU
            const chatBottomRef       = useRef(null); // FIX 11: scroll automático en chat mobile
            const statusRef           = useRef(status); // FIX 4: ref para heartbeat sin stale closure

            // FIX 4: mantener statusRef sincronizado con status
            useEffect(() => { statusRef.current = status; }, [status]);

            const publishReporterStatus = useCallback((s) => {
                if (!mqttRef.current?.connected || !peerRef.current) return;
                mqttRef.current.publish(`radio/${roomCode}/reporters`, JSON.stringify({
                    id: peerRef.current.id,
                    name: reporterName,
                    status: s
                }));
            }, [roomCode, reporterName]);

            const applyMicMute = useCallback((muted) => {
                const stream = micStreamRef.current;
                if (!stream) return;
                stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
                if (muted) setMicLevel(0);
            }, []);

            // FIX 8: beep de notificación para alertas entrantes del estudio
            const playAlertBeep = useCallback((type) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = type === 'on_air' ? 880 : 660;
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                    osc.onended = () => { try { ctx.close(); } catch(e) {} };
                    // Vibración en mobile
                    if (navigator.vibrate) navigator.vibrate(type === 'on_air' ? [200, 100, 200] : [150]);
                } catch(e) {}
            }, []);

            const joinRoom = async () => {
                if (!roomCode || !reporterName) return alert('Completá todos los campos');
                setConnecting(true); // FIX 3: mostrar estado de conexión

                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    micStreamRef.current = stream;
                    applyMicMute(micMuted);
                } catch (e) {
                    alert('No se pudo acceder al micrófono');
                    setConnecting(false);
                    return;
                }

                const peerId = `reporter_${roomCode}_${Math.random().toString(36).substr(2, 9)}`;
                peerRef.current = new Peer(peerId, {
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    clientId: `mqtt_reporter_${Math.random().toString(16).substr(2, 8)}`,
                    reconnectPeriod: 3000
                });
                mqttRef.current = client;

                client.on('connect', () => {
                    setConnectionError(null);
                    setMqttConnected(true);
                    client.subscribe(`radio/${roomCode}/studio_alert`);
                    client.subscribe(`radio/${roomCode}/alerts/response`);
                    client.subscribe(`radio/${roomCode}/chat`);
                });

                client.on('error', (err) => {
                    console.error('MQTT error:', err);
                    setConnectionError('Error MQTT. Alertas y chat pueden no funcionar.');
                });

                // FIX 4: usar 'offline' en lugar de 'close' + client.reconnecting (no estándar)
                client.on('offline', () => {
                    setConnectionError('Desconectado del broker. Reconectando...');
                });

                client.on('message', (topic, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        if (topic.includes('studio_alert')) {
                            if (data.reporterId === peerRef.current?.id) {
                                setStudioAlert({ type: data.type, from: data.from });
                                setUnreadStudioAlert(true); // FIX 8
                                playAlertBeep(data.type);   // FIX 8
                                setTimeout(() => setStudioAlert(null), 5000);
                            }
                        }
                        if (topic.includes('alerts/response') && data.to === peerRef.current?.id) {
                            setResponses(prev => [
                                { ...data, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) },
                                ...prev
                            ].slice(0, 50));
                        }
                        if (topic.includes('/chat')) {
                            setChatMessages(prev => [...prev, data].slice(-100));
                        }
                    } catch (e) {}
                });

                // FIX 3: setInRoom(true) SOLO dentro de peer.on('open'), no antes
                peerRef.current.on('open', () => {
                    setConnectionError(null);
                    setConnecting(false);
                    setInRoom(true); // ← movido aquí, dentro del callback asíncrono

                    const studioPeerId = `studio_${roomCode}`;
                    const call = peerRef.current.call(studioPeerId, micStreamRef.current);
                    callRef.current = call;

                    call.on('stream', (remoteStream) => {
                        setIfbConnected(true);
                        if (!ifbAudioRef.current) {
                            ifbAudioRef.current = new Audio();
                            ifbAudioRef.current.autoplay = true;
                        }
                        ifbAudioRef.current.srcObject = remoteStream;
                        ifbAudioRef.current.play().catch(() => {
                            document.addEventListener('click', function retry() {
                                ifbAudioRef.current?.play?.();
                                document.removeEventListener('click', retry);
                            }, { once: true });
                        });
                    });

                    call.on('close', () => {
                        setIfbConnected(false);
                        callRef.current = null;
                    });
                });

                peerRef.current.on('error', (err) => {
                    console.error('PeerJS error:', err);
                    setConnecting(false);
                    setConnectionError('Error PeerJS. Verificá que el estudio esté abierto.');
                });
            };

            // FIX 4: publicar inmediatamente al cambiar status; el intervalo es solo heartbeat
            useEffect(() => {
                if (!inRoom || !mqttConnected || !peerRef.current) return;
                publishReporterStatus(status);
                // Heartbeat: usa statusRef para no crear closure stale
                const t = setInterval(() => publishReporterStatus(statusRef.current), 5000);
                return () => clearInterval(t);
            }, [inRoom, status, mqttConnected, publishReporterStatus]);

            // FIX 2: VU meter en useEffect separado, sin depender de micMuted
            // micMuted se gestiona solo a través de applyMicMute (track.enabled)
            useEffect(() => {
                if (!inRoom || !micStreamRef.current) return;

                let ctx;
                try {
                    ctx = new (window.AudioContext || window.webkitAudioContext)();
                    audioCtxVuRef.current = ctx;
                    const source = ctx.createMediaStreamSource(micStreamRef.current);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);
                    analyserRef.current = analyser;

                    const data = new Uint8Array(analyser.frequencyBinCount);
                    const tick = () => {
                        if (!analyserRef.current) return;
                        analyserRef.current.getByteFrequencyData(data);
                        // FIX 7: escala corregida a /128 en lugar de /40
                        const avg = data.reduce((a, b) => a + b, 0) / data.length;
                        setMicLevel(avg);
                        animationFrameRef.current = requestAnimationFrame(tick);
                    };
                    tick();
                } catch(e) {}

                return () => {
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                    if (analyserRef.current) {
                        try { analyserRef.current.disconnect(); } catch(e) {}
                        analyserRef.current = null;
                    }
                    if (audioCtxVuRef.current) {
                        try { audioCtxVuRef.current.close(); } catch(e) {}
                        audioCtxVuRef.current = null;
                    }
                };
            }, [inRoom]); // ← solo depende de inRoom, no de micMuted

            useEffect(() => { applyMicMute(micMuted); }, [micMuted, applyMicMute]);

            // FIX 11: scroll automático al último mensaje en chat mobile
            useEffect(() => {
                if (chatBottomRef.current) {
                    chatBottomRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatMessages]);

            const sendAlert = (alertType, customMsg = '') => {
                if (!mqttRef.current?.connected || !peerRef.current) return;
                const payload = {
                    reporterId: peerRef.current.id,
                    reporterName,
                    alertId: alertType.id,
                    alertLabel: alertType.label,
                    message: alertType.id === 'custom' ? (customMsg || 'Mensaje personalizado') : alertType.label,
                    severity: alertType.severity,
                    timestamp: Date.now(),
                    isLive: status === 'live'
                };
                mqttRef.current.publish(`radio/${roomCode}/alerts`, JSON.stringify(payload));
                // FIX 10: limpiar el campo de alerta personalizada tras enviar
                if (alertType.id === 'custom') setCustomAlertMessage('');
            };

            const sendChat = (e) => {
                e.preventDefault();
                if (!chatInput.trim() || !mqttRef.current) return;
                const payload = {
                    id: Date.now(),
                    sender: reporterName,
                    text: chatInput.trim(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                mqttRef.current.publish(`radio/${roomCode}/chat`, JSON.stringify(payload));
                setChatMessages(prev => [...prev, payload]);
                setChatInput('');
            };

            // FIX 5: orden correcto de cleanup: call → peer → mqtt → mic → IFB audio
            useEffect(() => {
                return () => {
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                    if (analyserRef.current) { try { analyserRef.current.disconnect(); } catch(e) {} }
                    if (audioCtxVuRef.current) { try { audioCtxVuRef.current.close(); } catch(e) {} }
                    // FIX 5: call antes que peer
                    if (callRef.current) { try { callRef.current.close(); } catch(e) {} callRef.current = null; }
                    if (peerRef.current) { peerRef.current.destroy(); peerRef.current = null; }
                    if (mqttRef.current) { mqttRef.current.end(); mqttRef.current = null; }
                    if (micStreamRef.current) { micStreamRef.current.getTracks().forEach(t => t.stop()); }
                    // FIX 6: limpiar IFB audio element
                    if (ifbAudioRef.current) {
                        ifbAudioRef.current.pause();
                        ifbAudioRef.current.srcObject = null;
                        ifbAudioRef.current = null;
                    }
                };
            }, []);

            if (!inRoom) {
                return (
                    <div className="lobby-screen">
                        <div className="lobby-box">
                            <h1>STREAM<span>RADIO</span></h1>
                            <p>REPORTERO / MÓVIL</p>
                            <input
                                className="lobby-input"
                                placeholder="CÓDIGO DE SALA"
                                value={roomCode}
                                onChange={e => setRoomCode(e.target.value.toUpperCase())}
                                disabled={connecting}
                            />
                            <input
                                className="lobby-input"
                                placeholder="NOMBRE DEL REPORTERO"
                                value={reporterName}
                                onChange={e => setReporterName(e.target.value)}
                                style={{textTransform: 'none'}}
                                disabled={connecting}
                            />
                            {/* FIX 3: botón deshabilitado y texto de estado mientras conecta */}
                            <button className="lobby-btn" onClick={joinRoom} disabled={connecting}>
                                {connecting ? 'CONECTANDO...' : 'CONECTAR'}
                            </button>
                            {connectionError && (
                                <p style={{marginTop: 15, color: '#f59e0b', fontSize: '0.85rem'}}>{connectionError}</p>
                            )}
                        </div>
                    </div>
                );
            }

            // FIX 7: escala corregida /128 para valor promedio del analizador (rango 0-255)
            const VU_SEGMENTS = 8;
            const vuActiveCount = Math.min(VU_SEGMENTS, Math.ceil((micLevel / 128) * VU_SEGMENTS));

            return (
                <>
                <div className="dashboard desktop-dashboard">
                    <div className="top-bar">
                        <div className="logo">
                            STREAM<span>RADIO</span>
                            <small>REPORTERO</small>
                        </div>
                        <div className="top-status">
                            {connectionError && <span className="connection-error" onClick={() => setConnectionError(null)}>⚠️ {connectionError}</span>}
                            <span className="room-code">SALA: <b>{roomCode}</b></span>
                            <span className="online-status">● CONECTADO</span>
                        </div>
                    </div>

                    <div className="main-content">
                        <div className="info-panel">
                            <h2>📊 Estado</h2>
                            <div className="info-box">
                                <div className="info-label">Modo</div>
                                <div className="info-value">{status === 'live' ? 'EN VIVO' : 'STANDBY'}</div>
                            </div>
                            <div className={`status-indicator ${status}`}>
                                <div className={`status-dot ${status === 'live' ? 'red' : 'green'}`}></div>
                                <span className="status-text">{status === 'live' ? '🔴 TRANSMITIENDO' : '⚫ STANDBY'}</span>
                            </div>
                            <button
                                className={`status-toggle ${status}`}
                                style={{marginTop: 15}}
                                onClick={() => setStatus(s => s === 'standby' ? 'live' : 'standby')}
                            >
                                {status === 'standby' ? '⚫ Pasar a EN VIVO' : '🔴 Volver a STANDBY'}
                            </button>
                            <div className="ifb-control">
                                <div className="ifb-title">🎧 Retorno (IFB)</div>
                                <div className="ifb-status">
                                    {ifbConnected ? 'Retorno activo — escuchás al estudio' : 'Esperando retorno del estudio...'}
                                </div>
                            </div>
                        </div>

                        <div className="center-panel">
                            <div className="tabs">
                                <button className="tab active">📢 Enviar alerta</button>
                            </div>
                            <div className="panel-content">
                                {studioAlert && (
                                    <div className={`studio-alert-banner ${studioAlert.type}`}>
                                        {studioAlert.type === 'attention' ? '⚠️ ATENTO' : '🔴 AL AIRE'} — {studioAlert.from}
                                    </div>
                                )}
                                <p style={{marginBottom: 15, color: '#94a3b8', fontSize: '0.85rem'}}>Tocá para enviar alerta al estudio:</p>
                                <div className="alert-grid">
                                    {ALERT_TYPES.filter(a => a.id !== 'custom').map(a => (
                                        <button key={a.id} className={`alert-btn ${a.severity}`} onClick={() => sendAlert(a)}>
                                            {a.icon} {a.label}
                                        </button>
                                    ))}
                                </div>
                                <div style={{marginTop: 20}}>
                                    <input
                                        className="lobby-input"
                                        placeholder="Alerta personalizada..."
                                        value={customAlertMessage}
                                        onChange={e => setCustomAlertMessage(e.target.value)}
                                        style={{marginBottom: 10, textTransform: 'none'}}
                                    />
                                    <button
                                        className="alert-btn"
                                        onClick={() => sendAlert(ALERT_TYPES.find(a => a.id === 'custom'), customAlertMessage)}
                                    >
                                        ✏️ Enviar personalizada
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="alerts-panel">
                            <div className="alerts-header">
                                <h2>📩 Respuestas del estudio</h2>
                            </div>
                            <div className="responses-list">
                                {responses.length === 0 && <div style={{textAlign: 'center', color: '#666', marginTop: 30}}>Sin respuestas aún</div>}
                                {responses.map((r, i) => (
                                    <div key={i} className="response-card">
                                        <div className="from">{r.from}</div>
                                        <div className="msg">{r.message}</div>
                                        <div className="time">{r.time}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="chat-section">
                                <div className="chat-header-small">💬 Chat</div>
                                <div className="chat-messages-small">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className="chat-msg-small">
                                            <div className="sender">{m.sender}</div>
                                            <div>{m.text}</div>
                                        </div>
                                    ))}
                                    <div ref={chatBottomRef} />
                                </div>
                                <form className="chat-input-small" onSubmit={sendChat}>
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Mensaje..." />
                                    <button type="submit">➤</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                {/* ── MOBILE VIEW ── */}
                <div className="mobile-broadcast">
                    <div className="mobile-header-bar">
                        <span className={`mobile-header-status ${status === 'live' ? 'live' : ''}`}>
                            {status === 'live' ? 'EN VIVO' : 'STANDBY'}
                        </span>
                        <div className={`mobile-retorno-pill ${ifbConnected ? '' : 'off'}`}>
                            <span>🎧</span>
                            <span>{ifbConnected ? 'RETORNO OK' : 'SIN RETORNO'}</span>
                        </div>
                    </div>

                    {/* FIX 8: banner de alerta visible siempre en mobile, fuera del sheet */}
                    {studioAlert && (
                        <div className={`studio-alert-banner ${studioAlert.type}`} style={{marginBottom: 16}}>
                            {studioAlert.type === 'attention' ? '⚠️ ATENTO' : '🔴 AL AIRE'} — {studioAlert.from}
                        </div>
                    )}

                    <div className="mobile-vu-container">
                        <div className="mobile-vu-meter">
                            {Array.from({ length: VU_SEGMENTS }).map((_, i) => (
                                <div
                                    key={i}
                                    className={`mobile-vu-segment ${
                                        i < vuActiveCount
                                            ? (i >= VU_SEGMENTS - 2 ? 'peaking' : 'active')
                                            : ''
                                    }`}
                                />
                            ))}
                        </div>
                        {/* FIX 9: icono de micrófono cambia según estado de mute */}
                        <div className="mobile-vu-badge">{micMuted ? '🔇 MIC EN SILENCIO' : '🎙️ 48KHZ / MONO'}</div>
                    </div>

                    <button
                        className={`mobile-btn-al-aire ${status === 'live' ? 'live' : ''}`}
                        onClick={() => setStatus(s => s === 'standby' ? 'live' : 'standby')}
                    >
                        <span className="icon">{status === 'live' ? '⏹' : '▶'}</span>
                        <span className="label">Al aire</span>
                        <span className="sublabel">
                            {status === 'live' ? 'Transmitiendo al estudio' : 'Listo para salir al aire'}
                        </span>
                    </button>

                    {/* FIX 8: badge visual sobre el botón notificar si hay alerta no leída */}
                    <button
                        className="mobile-btn-notificar"
                        onClick={() => { setMobileSheet('alerts'); setUnreadStudioAlert(false); }}
                    >
                        {unreadStudioAlert && <span className="mobile-alert-badge">!</span>}
                        🚨 NOTIFICAR AL CONTROL
                    </button>

                    <div className="mobile-bottom-nav">
                        <button
                            className={`mobile-nav-btn ${mobileSheet === 'chat' ? 'active' : ''}`}
                            onClick={() => setMobileSheet(mobileSheet === 'chat' ? null : 'chat')}
                            title="Chat"
                        >💬</button>
                        {/* FIX 9: ícono cambia entre 🎙️ y 🔇 según estado mute */}
                        <button
                            className={`mobile-nav-btn ${micMuted ? '' : 'active'}`}
                            onClick={() => setMicMuted(m => !m)}
                            title={micMuted ? 'Activar micrófono' : 'Silenciar micrófono'}
                        >{micMuted ? '🔇' : '🎙️'}</button>
                        <button
                            className={`mobile-nav-btn ${ifbConnected ? 'active' : ''}`}
                            title="Retorno IFB"
                        >🎧</button>
                        <button
                            className="mobile-nav-btn"
                            onClick={() => { if (confirm('¿Desconectar?')) window.location.reload(); }}
                            title="Salir"
                        >🚪</button>
                    </div>
                </div>

                <div className={`mobile-sheet-overlay ${mobileSheet ? 'open' : ''}`} onClick={() => setMobileSheet(null)} />
                <div className={`mobile-sheet ${mobileSheet ? 'open' : ''}`}>
                    <div className="mobile-sheet-handle" onClick={() => setMobileSheet(null)} style={{cursor: 'pointer'}} />
                    <div className="mobile-sheet-content">

                        {mobileSheet === 'chat' && (
                            <>
                                <div className="mobile-sheet-header">💬 Chat</div>
                                <div className="chat-messages-small" style={{maxHeight: 200, marginBottom: 15}}>
                                    {chatMessages.length === 0 && <div style={{color: '#666', padding: 20}}>Sin mensajes</div>}
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className="chat-msg-small">
                                            <div className="sender">{m.sender}</div>
                                            <div>{m.text}</div>
                                        </div>
                                    ))}
                                    {/* FIX 11: ancla de scroll al final del chat en mobile */}
                                    <div ref={chatBottomRef} />
                                </div>
                                <form className="chat-input-small" onSubmit={sendChat}>
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Mensaje..." />
                                    <button type="submit">➤</button>
                                </form>
                            </>
                        )}

                        {mobileSheet === 'alerts' && (
                            <>
                                <div className="mobile-sheet-header">🚨 Notificar al control</div>
                                {studioAlert && (
                                    <div className={`studio-alert-banner ${studioAlert.type}`} style={{marginBottom: 15}}>
                                        {studioAlert.type === 'attention' ? '⚠️ ATENTO' : '🔴 AL AIRE'} — {studioAlert.from}
                                    </div>
                                )}
                                <div className="alert-grid" style={{marginBottom: 15}}>
                                    {ALERT_TYPES.filter(a => a.id !== 'custom').map(a => (
                                        <button
                                            key={a.id}
                                            className={`alert-btn ${a.severity}`}
                                            onClick={() => { sendAlert(a); setMobileSheet(null); }}
                                        >
                                            {a.icon} {a.label}
                                        </button>
                                    ))}
                                </div>
                                {/* FIX 10: limpiar campo tras enviar (gestionado en sendAlert) */}
                                <input
                                    className="lobby-input"
                                    placeholder="Alerta personalizada..."
                                    value={customAlertMessage}
                                    onChange={e => setCustomAlertMessage(e.target.value)}
                                    style={{marginBottom: 10, textTransform: 'none'}}
                                />
                                <button
                                    className="alert-btn"
                                    onClick={() => {
                                        sendAlert(ALERT_TYPES.find(a => a.id === 'custom'), customAlertMessage);
                                        setMobileSheet(null);
                                    }}
                                >✏️ Enviar personalizada</button>

                                <div className="mobile-sheet-header" style={{marginTop: 25}}>📩 Respuestas</div>
                                {responses.length === 0 && <div style={{color: '#666', padding: 10}}>Sin respuestas</div>}
                                {responses.slice(0, 5).map((r, i) => (
                                    <div key={i} className="response-card" style={{marginBottom: 10}}>
                                        <div className="from">{r.from}</div>
                                        <div className="msg">{r.message}</div>
                                        <div className="time">{r.time}</div>
                                    </div>
                                ))}
                            </>
                        )}

                    </div>
                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReporterDashboard />);
    </script>
</body>
</html>
