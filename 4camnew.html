                            <span className="text-[9px] text-slate-500 uppercase tracking-widest font-bold">MIC LEVEL</span>
                        </div>
                    )}

                    {/* ===== PANEL DE GANANCIA DEL MICRÓFONO ===== */}
                    <div
                        className="guest-gain-panel glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-2 shadow-xl"
                        style={{ bottom: 'calc(5.5rem + env(safe-area-inset-bottom, 0px))' }}
                    >
                        <span className="text-[11px] font-black text-emerald-400 uppercase tracking-wider whitespace-nowrap">🎤 Gain</span>
                        <input
                            type="range" min="0.3" max="2.5" step="0.05"
                            value={micGain}
                            onChange={e => setMicGain(parseFloat(e.target.value))}
                            className="touch-slider w-28"
                            style={{ width: 'clamp(80px, 25vw, 120px)' }}
                        />
                        <span className={`text-[12px] font-black tabular-nums w-12 text-right ${micGain > 1.8 ? 'text-amber-400' : micGain < 0.6 ? 'text-red-400' : 'text-white'}`}>
                            {`${Math.round(20 * Math.log10(micGain)) > 0 ? '+' : ''}${Math.round(20 * Math.log10(micGain))}dB`}
                        </span>
                        <button
                            onClick={() => setMicGain(1.0)}
                            className="text-[10px] text-slate-500 font-bold px-2 py-1 rounded-lg bg-slate-800 border border-slate-700 hover:text-white transition-colors"
                            style={{ minWidth: '36px', minHeight: '36px', touchAction: 'manipulation' }}
                            title="Resetear a 0dB"
                        >RST</button>
                    </div>

                    {/* ===== CONTROLES PRINCIPALES (adaptables iPhone + Android) ===== */}
                    <div
                        className="guest-controls-bar glass-panel rounded-full flex items-center shadow-2xl"
                        style={{ gap: 'clamp(0.35rem, 2vw, 0.75rem)', padding: 'clamp(0.6rem, 2vw, 1rem) clamp(1rem, 4vw, 1.5rem)' }}
                    >
                        {/* Badge de canal — visible solo en pantallas ≥ sm */}
                        <div className="text-xs font-black text-slate-400 uppercase tracking-widest px-2 py-1 bg-slate-800 rounded hidden sm:block">CH {slotId}</div>

                        {/* Mic */}
                        <button
                            id="guest-btn-mic"
                            onClick={toggleMic}
                            className={`guest-ctrl-btn ${micMuted ? 'bg-red-500 ring-2 ring-red-400 shadow-[0_0_15px_rgba(239,68,68,0.5)]' : 'bg-slate-800 hover:bg-slate-700'}`}
                            title={micMuted ? 'Mic SILENCIADO — toca para reactivar' : 'Mic activo — toca para silenciar'}
                            aria-label={micMuted ? 'Reactivar micrófono' : 'Silenciar micrófono'}
                        >{micMuted ? '🔇' : '🎤'}</button>

                        {/* Cam */}
                        <button
                            id="guest-btn-cam"
                            onClick={toggleCam}
                            className={`guest-ctrl-btn ${camOff ? 'bg-red-500 hover:bg-red-600' : 'bg-slate-800 hover:bg-slate-700'}`}
                            title={camOff ? 'Cámara APAGADA' : 'Cámara activa'}
                            aria-label={camOff ? 'Encender cámara' : 'Apagar cámara'}
                        >{camOff ? '🚫' : '🎥'}</button>

                        {/* Switch Camera */}
                        <button
                            id="guest-btn-flip"
                            onClick={switchCamera}
                            className="guest-ctrl-btn bg-blue-500 hover:bg-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.5)]"
                            title="Cambiar cámara frontal/trasera"
                            aria-label="Girar cámara"
                        >🔄</button>

                        {/* Separador */}
                        <div className="w-px bg-slate-700" style={{ height: '2rem', flexShrink: 0 }}></div>

                        {/* Foto */}
                        <button
                            id="guest-btn-photo"
                            onClick={() => takeSnapshot(localStream.current, `Mobile_Cam${slotId}`)}
                            className="guest-ctrl-btn bg-slate-800 hover:bg-slate-700"
                            title="Capturar foto"
                            aria-label="Tomar foto"
                        >📸</button>

                        {/* Grabar */}
                        <button
                            id="guest-btn-rec"
                            onClick={toggleRecording}
                            className={`guest-ctrl-btn ${isRecording ? 'bg-red-500 animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.6)]' : 'bg-slate-800 hover:bg-slate-700'}`}
                            title={isRecording ? 'Detener grabación' : 'Grabar video local'}
                            aria-label={isRecording ? 'Detener grabación' : 'Iniciar grabación'}
                        >{isRecording ? '⏹️' : '🔴'}</button>
                    </div>
                </div>
            );
        };

        // --- OBS VIEW --- //
        const ObsView = ({ roomName, slotId }) => {
            const [status, setStatus] = useState(`INICIANDO ENLACE...`);
            const [stream, setStream] = useState(null);
            const peer = useRef(null);

            useEffect(() => {
                let pingInterval;
                const baseId = roomName.toUpperCase();
                const guestId = `sc_guest_${baseId}_${slotId}`;

                peer.current = new Peer(`sc_obs_${baseId}_${slotId}`, PEER_CONFIG);

                // Reconexión agresiva para OBS (Es el cliente que no debe fallar)
                peer.current.on('disconnected', () => {
                    console.warn(`[OBS] Señalización perdida. Autoreconectando al servidor...`);
                    if (!peer.current.destroyed) peer.current.reconnect();
                });
                peer.current.on('error', (err) => {
                    console.error(`[OBS] Error PeerJS:`, err.type, err);
                    if (err.type === 'network' || err.type === 'disconnected') {
                        setTimeout(() => { if (!peer.current.destroyed) peer.current.reconnect(); }, 2000);
                    }
                });

                const startPing = () => {
                    if (!pingInterval) {
                        pingInterval = setInterval(() => {
                            const conn = peer.current.connect(guestId, { reliable: false });
                            conn.on('open', () => { conn.send('WAKE_UP_OBS'); setTimeout(() => conn.close(), 500); });
                        }, 3000);
                    }
                };

                peer.current.on('open', () => { setStatus(`BUSCANDO MÓVIL ${slotId}...`); startPing(); });

                peer.current.on('call', (call) => {
                    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
                    setStatus('RECIBIENDO...');
                    call.answer();

                    const checkIce = () => {
                        if (call.peerConnection && (call.peerConnection.iceConnectionState === 'disconnected' || call.peerConnection.iceConnectionState === 'failed' || call.peerConnection.iceConnectionState === 'closed')) {
                            console.warn(`[OBS] Conexión ICE con Móvil ${slotId} rota. Reactivando Auto-Ping de rescate...`);
                            call.close();
                        }
                    };
                    if (call.peerConnection) call.peerConnection.addEventListener('iceconnectionstatechange', checkIce);

                    call.on('stream', (s) => { setStream(s); setStatus(''); });
                    call.on('close', () => {
                        if (call.peerConnection) call.peerConnection.removeEventListener('iceconnectionstatechange', checkIce);
                        setStream(null);
                        setStatus(`MÓVIL ${slotId} DESCONECTADO... RECONECTANDO`);
                        startPing();
                    });
                });

                return () => { if (pingInterval) clearInterval(pingInterval); peer.current?.destroy(); };
            }, [roomName, slotId]);

            return (
                <div className="w-screen h-screen relative bg-transparent overflow-hidden flex items-center justify-center">
                    {stream ? (
                        <VideoPlayer stream={stream} muted={false} className="w-full h-full object-cover absolute top-0 left-0 z-10" />
                    ) : (
                        <div className="absolute z-50 bg-black/85 backdrop-blur-md px-8 py-6 rounded-2xl flex flex-col items-center gap-4 border border-yellow-500/50 shadow-[0_0_50px_rgba(234,179,8,0.2)]">
                            <span className="text-5xl animate-pulse">📶</span>
                            <span className="text-yellow-400 font-mono text-xl font-bold tracking-widest text-center">{status}</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- ROUTER / APP --- //
        const App = () => {
            const [appState, setAppState] = useState({ mode: null, room: null, slot: '1', camCount: 3 });
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const m = params.get('mode');
                const r = params.get('room');
                const s = params.get('slot') || '1';
                const c = params.get('camcount') ? parseInt(params.get('camcount')) : 3;
                if (m && r) {
                    if (m === 'obs') document.body.classList.add('obs-mode');
                    setAppState({ mode: m, room: r, slot: s, camCount: c });
                } else {
                    setAppState({ mode: 'lobby', room: Math.random().toString(36).substring(2, 6).toUpperCase(), slot: '1', camCount: c });
                }
            }, []);

            if (appState.mode === 'director') return <DirectorView roomName={appState.room} cameraCount={appState.camCount} />;
            if (appState.mode === 'obs') return <ObsView roomName={appState.room} slotId={appState.slot} />;
            if (appState.mode === 'guest') return <GuestView roomName={appState.room} slotId={appState.slot} />;
            if (appState.mode === 'lobby') return <Lobby initialRoom={appState.room} />;

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
