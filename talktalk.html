<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamTalk V9.0 (Pocket Mode)</title>

    <!-- LIBRERÍAS -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PEER JS (WebRTC P2P) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes strobe-flash {
            0%, 100% { background-color: #eab308; }
            50% { background-color: #000000; }
        }
        .animate-strobe {
            animation: strobe-flash 0.15s infinite;
        }
    </style>
</head>

<body class="bg-[#10111A] text-[#A9B0D8] font-sans h-screen overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const PEER_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        };
        const DEFAULT_ROLES = ['CAM 1', 'CAM 2', 'CAM 3', 'CAM 4', 'SONIDO', 'PISO'];

        // --- SISTEMA REUTILIZABLE DE EFECTOS DE SONIDO (Previene fugas de AudioContext) ---
        const playSoundEffect = (frequency, duration, type = 'sine', volume = 0.1) => {
            try {
                if (!window._soundAudioCtx || window._soundAudioCtx.state === 'closed') {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    window._soundAudioCtx = new AudioContextClass();
                }
                const audioCtx = window._soundAudioCtx;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + duration);
            } catch (e) {
                console.warn("No se pudo reproducir el efecto de sonido:", e);
            }
        };

        const playAlertSoundEffect = () => {
            try {
                if (!window._soundAudioCtx || window._soundAudioCtx.state === 'closed') {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    window._soundAudioCtx = new AudioContextClass();
                }
                const audioCtx = window._soundAudioCtx;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                const now = audioCtx.currentTime;
                
                // Primer pitido
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.frequency.value = 1200;
                gain1.gain.setValueAtTime(0.15, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.12);

                // Segundo pitido
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.frequency.value = 1500;
                gain2.gain.setValueAtTime(0.15, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.27);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.27);
            } catch (e) {
                console.warn("No se pudo reproducir el sonido de alerta:", e);
            }
        };

        // --- COMPONENTE AUDIO PLAYER PARA EL CREW (Evita re-bindings de srcObject y cortes de audio) ---
        const CrewAudioPlayer = ({ peerId, stream, volume, muted }) => {
            const audioRef = useRef(null);

            useEffect(() => {
                if (audioRef.current && stream) {
                    if (audioRef.current.srcObject !== stream) {
                        audioRef.current.srcObject = stream;
                    }
                }
            }, [stream]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = volume !== undefined ? volume : 1;
                }
            }, [volume]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.muted = muted;
                    if (!muted) {
                        audioRef.current.play().catch(e => console.log("Autoplay crew audio block:", e));
                    }
                }
            }, [muted]);

            return (
                <audio
                    ref={audioRef}
                    autoPlay
                    playsInline
                />
            );
        };


        // --- COMPONENTE DIRECTOR ---
        const DirectorView = ({ roomName }) => {
            const [status, setStatus] = useState('Listo para iniciar');
            const [isSystemActive, setIsSystemActive] = useState(false);
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [micMuted, setMicMuted] = useState(true);

            useEffect(() => {
                const handleOnline = () => setIsOffline(false);
                const handleOffline = () => setIsOffline(true);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);
            const [crewList, setCrewList] = useState([]);
            const [partyline, setPartyline] = useState(false);
            const [volumes, setVolumes] = useState({});
            const [crewData, setCrewData] = useState({});

            const [targets, setTargets] = useState(['TODOS']);
            const [dynamicRoles, setDynamicRoles] = useState([]);

            const [audioDevices, setAudioDevices] = useState([]);
            const [selectedAudio, setSelectedAudio] = useState('');

            const peer = useRef(null);
            const baseStream = useRef(null);
            const activePeers = useRef({});

            const audioStreamsRef = useRef({});
            const [talkingStates, setTalkingStates] = useState({});

            const directorAudioCtx = useRef(null);
            const dirMicSource = useRef(null);
            const dirMicHPF = useRef(null);
            const crewAudioSources = useRef({});
            const crewAnalysers = useRef({});

            const [messages, setMessages] = useState([]);
            const [isChatOpen, setIsChatOpen] = useState(false);
            const [chatTarget, setChatTarget] = useState('TODOS');
            const [chatInput, setChatInput] = useState('');
            const [unreadCount, setUnreadCount] = useState(0);
            const [tallyStates, setTallyStates] = useState({});
            const [alerts, setAlerts] = useState({});

            useEffect(() => {
                navigator.mediaDevices.getUserMedia({ audio: true }).then((tempStream) => {
                    tempStream.getTracks().forEach(t => t.stop());
                    navigator.mediaDevices.enumerateDevices().then(devs => {
                        const audios = devs.filter(d => d.kind === 'audioinput');
                        setAudioDevices(audios);
                        if (audios.length > 0) setSelectedAudio(audios[0].deviceId);
                    });
                }).catch(e => setStatus('Error: Permiso de micrófono denegado.'));

                return () => {
                    if (peer.current) peer.current.destroy();
                    if (baseStream.current) baseStream.current.getTracks().forEach(t => t.stop());
                };
            }, []);

            const applyAudioRouting = () => {
                if (!directorAudioCtx.current) return;
                const currentTargets = targets;
                const isMasterMuted = micMuted;

                Object.values(activePeers.current).forEach(peerInfo => {
                    const dest = peerInfo.dest;
                    if (!dest) return;

                    if (dirMicSource.current) {
                        try { dirMicSource.current.disconnect(dest); } catch (e) { }
                    }
                    if (dirMicHPF.current) {
                        try { dirMicHPF.current.disconnect(dest); } catch (e) { }
                        const isTargeted = currentTargets.includes('TODOS') || currentTargets.includes(peerInfo.role);
                        if (!isMasterMuted && isTargeted) {
                            dirMicHPF.current.connect(dest);
                        }
                    }

                    Object.keys(crewAudioSources.current).forEach(sourcePeerId => {
                        const srcNode = crewAudioSources.current[sourcePeerId];
                        if (!srcNode) return;
                        try { srcNode.disconnect(dest); } catch (e) { }
                        if (partyline && talkingStates[sourcePeerId] && sourcePeerId !== peerInfo.id) {
                            srcNode.connect(dest);
                        }
                    });

                    if (peerInfo.track) {
                        peerInfo.track.enabled = true;
                    }
                });

                setCrewList(Object.values(activePeers.current).map(p => ({
                    id: p.id, name: p.role,
                    receiving: !isMasterMuted && (currentTargets.includes('TODOS') || currentTargets.includes(p.role))
                })));
            };

            useEffect(() => { applyAudioRouting(); }, [targets, micMuted, partyline, talkingStates]);

            const startDirector = async () => {
                if (!selectedAudio) return;
                try {
                    setStatus('Conectando hardware...');
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            deviceId: { exact: selectedAudio },
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            channelCount: 1,
                            sampleRate: 48000,
                            latency: 0
                        }
                    });

                    baseStream.current = stream;
                    setIsSystemActive(true);
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!directorAudioCtx.current) directorAudioCtx.current = new AudioContextClass({ latencyHint: 'interactive', sampleRate: 48000 });

                    if (dirMicSource.current) {
                        try { dirMicSource.current.disconnect(); } catch (e) { }
                    }
                    if (dirMicHPF.current) {
                        try { dirMicHPF.current.disconnect(); } catch (e) { }
                    }
                    dirMicSource.current = directorAudioCtx.current.createMediaStreamSource(stream);
                    
                    // Crear y conectar Filtro de Paso Alto (HPF) a 100Hz para el Director
                    dirMicHPF.current = directorAudioCtx.current.createBiquadFilter();
                    dirMicHPF.current.type = 'highpass';
                    dirMicHPF.current.frequency.value = 100;
                    dirMicSource.current.connect(dirMicHPF.current);

                    const directorId = `st_dir_${roomName.replace(/\s+/g, '').toUpperCase()}`;

                    if (peer.current) peer.current.destroy();
                    peer.current = new Peer(directorId, PEER_CONFIG);

                    peer.current.on('open', () => {
                        setStatus('Matriz Activa. Esperando al Crew...');
                    });

                    peer.current.on('disconnected', () => {
                        console.log("Señalización del Director desconectada. Reconectando...");
                        setStatus('Reconectando señalización...');
                        peer.current.reconnect();
                    });

                    peer.current.on('connection', (conn) => {
                        const role = conn.metadata?.role?.toUpperCase() || 'INVITADO';

                        if (role !== 'INVITADO') {
                            const existingPeerId = Object.keys(activePeers.current).find(id => activePeers.current[id].role === role);
                            if (existingPeerId) {
                                removePeer(existingPeerId);
                            }
                        }

                        if (!DEFAULT_ROLES.includes(role) && role !== 'TODOS') {
                            setDynamicRoles(prev => prev.includes(role) ? prev : [...prev, role]);
                        }

                        conn.on('data', (data) => {
                            if (data.type === 'PTT') {
                                setTalkingStates(prev => ({ ...prev, [conn.peer]: data.state }));
                            }
                            if (data.type === 'PING') {
                                conn.send({ type: 'PONG' });
                                if (data.bat !== undefined) {
                                    setCrewData(prev => ({ ...prev, [conn.peer]: { ...prev[conn.peer], bat: data.bat } }));
                                }
                            }
                            if (data.type === 'STATS') {
                                setCrewData(prev => ({
                                    ...prev,
                                    [conn.peer]: {
                                        ...prev[conn.peer],
                                        ...(data.ping !== undefined && { ping: data.ping }),
                                        ...(data.qos !== undefined && { qos: data.qos })
                                    }
                                }));
                            }
                            if (data.type === 'CHAT') {
                                setMessages(prev => [...prev, { id: Math.random(), sender: role, text: data.text, timestamp: Date.now() }]);
                                playNotificationSound();
                                if (!isChatOpen) setUnreadCount(c => c + 1);
                            }
                            if (data.type === 'ALERT') {
                                setAlerts(prev => ({ ...prev, [role]: true }));
                                playAlertSound();
                            }
                        });

                        conn.on('open', () => {
                            if (!baseStream.current) return;

                            const peerDest = directorAudioCtx.current.createMediaStreamDestination();
                            const customStream = peerDest.stream;

                            const call = peer.current.call(conn.peer, customStream);

                            activePeers.current[conn.peer] = { id: conn.peer, conn, call, track: customStream.getAudioTracks()[0], role, dest: peerDest };
                            applyAudioRouting();

                            // Sync Tally state upon connection
                            const existingTally = tallyStates[role] || 'OFF';
                            conn.send({ type: 'TALLY_STATE', state: existingTally });

                            call.on('stream', (crewStream) => {
                                audioStreamsRef.current[conn.peer] = crewStream;
                                setTalkingStates(prev => ({ ...prev, [conn.peer]: false }));

                                if (directorAudioCtx.current) {
                                    const source = directorAudioCtx.current.createMediaStreamSource(crewStream);
                                    crewAudioSources.current[conn.peer] = source;

                                    const analyser = directorAudioCtx.current.createAnalyser();
                                    analyser.fftSize = 32;
                                    source.connect(analyser);
                                    crewAnalysers.current[conn.peer] = analyser;
                                }
                            });

                            call.on('close', () => removePeer(conn.peer));
                            call.on('error', () => removePeer(conn.peer));
                        });

                        conn.on('close', () => removePeer(conn.peer));
                    });

                    peer.current.on('error', (err) => {
                        if (err.type === 'unavailable-id') setStatus('Error: Sala ocupada. Reintenta en 10s.');
                        else setStatus('Error de conexión de red.');
                    });

                } catch (e) {
                    setStatus('Error de hardware. Revisa permisos.');
                }
            };

            const removePeer = (id) => {
                if (activePeers.current[id]) {
                    const peerInfo = activePeers.current[id];
                    if (peerInfo.dest) {
                        if (dirMicSource.current) {
                            try { dirMicSource.current.disconnect(peerInfo.dest); } catch (e) {}
                        }
                        if (dirMicHPF.current) {
                            try { dirMicHPF.current.disconnect(peerInfo.dest); } catch (e) {}
                        }
                        Object.values(crewAudioSources.current).forEach(srcNode => {
                            try { srcNode.disconnect(peerInfo.dest); } catch (e) {}
                        });
                    }
                    if (peerInfo.track) peerInfo.track.stop();
                    if (peerInfo.call) peerInfo.call.close();
                    if (peerInfo.conn) peerInfo.conn.close();
                    delete activePeers.current[id];
                }
                if (crewAudioSources.current[id]) {
                    try { crewAudioSources.current[id].disconnect(); } catch (e) { }
                    delete crewAudioSources.current[id];
                }
                if (crewAnalysers.current[id]) {
                    try { crewAnalysers.current[id].disconnect(); } catch (e) {}
                    delete crewAnalysers.current[id];
                }
                delete audioStreamsRef.current[id];
                applyAudioRouting();
                setTalkingStates(prev => { const n = { ...prev }; delete n[id]; return n; });
                setCrewData(prev => { const n = { ...prev }; delete n[id]; return n; });
            };

            const toggleTarget = (t) => {
                if (t === 'TODOS') { setTargets(['TODOS']); }
                else {
                    let newTargets = targets.filter(x => x !== 'TODOS');
                    if (newTargets.includes(t)) {
                        newTargets = newTargets.filter(x => x !== t);
                        if (newTargets.length === 0) newTargets = ['TODOS'];
                    } else newTargets.push(t);
                    setTargets(newTargets);
                }
            };

            const copyLink = () => {
                const url = `${window.location.href.split('?')[0]}?mode=crew&room=${roomName}`;
                navigator.clipboard.writeText(url);
                alert("Link copiado.");
            };

            const toggleTally = (role, type) => {
                const current = tallyStates[role] || 'OFF';
                const next = current === type ? 'OFF' : type;
                
                setTallyStates(prev => ({ ...prev, [role]: next }));
                if (next === 'PGM') {
                    setAlerts(prev => ({ ...prev, [role]: false }));
                }
                
                const peerId = Object.keys(activePeers.current).find(id => activePeers.current[id].role === role);
                if (peerId) {
                    const peerInfo = activePeers.current[peerId];
                    if (peerInfo && peerInfo.conn && peerInfo.conn.open) {
                        peerInfo.conn.send({ type: 'TALLY_STATE', state: next });
                    }
                }
            };

            const sendChatMessage = () => {
                if (!chatInput.trim()) return;
                const msgText = chatInput.trim();
                const newMsg = {
                    id: Math.random(),
                    sender: 'Director',
                    text: msgText,
                    timestamp: Date.now(),
                    target: chatTarget
                };
                
                setMessages(prev => [...prev, newMsg]);
                
                if (chatTarget === 'TODOS') {
                    Object.values(activePeers.current).forEach(peerInfo => {
                        if (peerInfo.conn && peerInfo.conn.open) {
                            peerInfo.conn.send({ type: 'CHAT', text: msgText, sender: 'Director' });
                        }
                    });
                } else {
                    const peerId = Object.keys(activePeers.current).find(id => activePeers.current[id].role === chatTarget);
                    if (peerId) {
                        const peerInfo = activePeers.current[peerId];
                        if (peerInfo.conn && peerInfo.conn.open) {
                            peerInfo.conn.send({ type: 'CHAT', text: msgText, sender: 'Director' });
                        }
                    }
                }
                setChatInput('');
            };

            const playNotificationSound = () => {
                playSoundEffect(880, 0.15);
            };

            const playAlertSound = () => {
                playAlertSoundEffect();
            };

            useEffect(() => {
                if (!isSystemActive) return;
                
                let active = true;
                const updateVus = () => {
                    if (!active) return;
                    
                    Object.keys(crewAnalysers.current).forEach(peerId => {
                        const analyser = crewAnalysers.current[peerId];
                        if (analyser) {
                            const dataArray = new Uint8Array(analyser.frequencyBinCount);
                            analyser.getByteFrequencyData(dataArray);
                            let sum = 0;
                            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                            const avg = sum / dataArray.length;
                            
                            const container = document.getElementById(`vu-segments-${peerId}`);
                            if (container) {
                                const segmentsCount = 15;
                                const litSegments = Math.min(Math.round((avg / 60) * segmentsCount), segmentsCount);
                                const children = container.children;
                                for (let i = 0; i < children.length; i++) {
                                    if (i < litSegments) {
                                        if (i < 9) {
                                            children[i].style.backgroundColor = '#22c55e'; // Verde
                                        } else if (i < 13) {
                                            children[i].style.backgroundColor = '#eab308'; // Amarillo
                                        } else {
                                            children[i].style.backgroundColor = '#ef4444'; // Rojo
                                        }
                                    } else {
                                        children[i].style.backgroundColor = '#1e293b'; // Apagado
                                    }
                                }
                            }
                        }
                    });
                    
                    requestAnimationFrame(updateVus);
                };
                
                requestAnimationFrame(updateVus);
                
                return () => {
                    active = false;
                };
            }, [isSystemActive]);

            const allMatrixRoles = [...DEFAULT_ROLES, ...dynamicRoles];

            if (!isSystemActive) {
                return (
                    <div className="flex flex-col items-center justify-center h-full p-5 text-center">
                        <div className="bg-[#141522] p-7 rounded-xl border-2 border-[#3E437C] shadow-[0_0_35px_rgba(62,67,124,0.4)] max-w-[400px] w-full">
                            <h2 className="text-2xl font-black mb-2 text-[#4945A4]">PANEL DE DIRECTOR</h2>
                            <p className="mb-4 text-sm text-[#A9B0D8]">Selecciona tu micrófono antes de abrir la sala.</p>

                            <select className="box-border w-full bg-[#10111A] border-2 border-[#3E437C] text-[#A9B0D8] p-4 rounded-lg text-sm outline-none mb-5" value={selectedAudio} onChange={(e) => setSelectedAudio(e.target.value)}>
                                {audioDevices.length === 0 && <option>Buscando audios...</option>}
                                {audioDevices.map(d => <option key={d.deviceId} value={d.deviceId}>{d.label || 'Micrófono'}</option>)}
                            </select>

                            <button className="w-full p-[15px] font-bold text-base rounded-lg cursor-pointer border-none transition duration-200 mb-2.5 bg-[#4945A4] text-white hover:bg-[#5A56C4]" onClick={startDirector}>INICIAR MATRIZ IFB</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen bg-[#10111A] relative">
                    {isOffline && (
                        <div className="absolute top-0 left-0 w-full h-full bg-red-900/90 z-50 flex flex-col items-center justify-center">
                            <h1 className="text-4xl font-black text-white mb-2">⚠ SIN CONEXIÓN</h1>
                            <p className="text-white text-lg">Internet interrumpido. Revisando red...</p>
                        </div>
                    )}
                    {/* Renderizador oculto de audios entrantes (Controlados por estado de PTT) */}
                    <div style={{ display: 'none' }}>
                        {Object.keys(talkingStates).map(peerId => (
                            <CrewAudioPlayer
                                key={peerId}
                                peerId={peerId}
                                stream={audioStreamsRef.current[peerId]}
                                volume={volumes[peerId]}
                                muted={!talkingStates[peerId]}
                            />
                        ))}
                    </div>

                    <div className="py-4 px-6 bg-[#141522] border-b-2 border-[#3E437C] flex justify-between items-center shadow-[0_4px_15px_rgba(0,0,0,0.4)]">
                        <div>
                            <div className="font-black text-xl text-blue-400">STREAM<span className="text-white">TALK</span> V9.0</div>
                            <div className="text-xs text-gray-400 font-bold tracking-widest">{status}</div>
                        </div>
                        <button className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-xs font-bold" onClick={copyLink}>
                            🔗 COPIAR LINK
                        </button>
                    </div>

                    <div className="px-4 pt-3 flex flex-col gap-2">
                        <label className="text-[10px] font-bold text-gray-500 uppercase">Grupos Rápidos de Destino</label>
                        <div className="flex gap-2">
                            <button 
                                className="bg-[#23253A] border border-[#3E437C] text-[#A9B0D8] text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-[#4945A4] hover:text-white transition-all cursor-pointer"
                                onClick={() => setTargets(['CAM 1', 'CAM 2', 'CAM 3', 'CAM 4'])}
                            >
                                📹 SOLO CÁMARAS
                            </button>
                            <button 
                                className="bg-[#23253A] border border-[#3E437C] text-[#A9B0D8] text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-[#4945A4] hover:text-white transition-all cursor-pointer"
                                onClick={() => setTargets(['SONIDO', 'PISO', 'PROD'])}
                            >
                                🏃‍♂️ SOLO PISO / PROD
                            </button>
                            <button 
                                className="bg-[#23253A] border border-[#3E437C] text-[#A9B0D8] text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-[#f59e0b] hover:text-black transition-all cursor-pointer"
                                onClick={() => setTargets(['TODOS'])}
                            >
                                📢 TODOS
                            </button>
                        </div>
                    </div>

                    <div className="px-4 pt-3 pb-1 flex justify-between items-center">
                        <label className="text-[10px] font-bold text-gray-500">DESTINOS DE AUDIO (RUTEO)</label>
                        <button className={`text-[10px] font-bold px-2 py-1 rounded ${partyline ? 'bg-purple-600 text-white shadow-[0_0_10px_#9333ea]' : 'bg-gray-800 text-gray-400'}`}
                            onClick={() => setPartyline(!partyline)}>
                            {partyline ? '🔥 PARTY MIX ON' : '🎧 PARTY MIX OFF'}
                        </button>
                    </div>
                    <div className="grid grid-cols-4 gap-3 p-5 bg-[#141522] border-2 border-[#3E437C] rounded-xl mt-[15px] mx-[15px] mb-0 shadow-[0_0_20px_rgba(62,67,124,0.2)]">
                        <button className={`py-3 px-[5px] rounded-md text-[0.8rem] font-bold text-center bg-transparent border-2 border-[#3E437C] cursor-pointer transition-all duration-200 ${targets.includes('TODOS') ? 'bg-[#f59e0b] border-[#f59e0b] text-black' : 'text-[#A9B0D8] hover:border-[#4945A4] hover:bg-[#4945A4]/10'}`} onClick={() => toggleTarget('TODOS')}>
                            📢 TODOS
                        </button>
                        {allMatrixRoles.map(role => (
                            <button key={role} className={`py-3 px-[5px] rounded-md text-[0.8rem] font-bold text-center bg-transparent border-2 border-[#3E437C] cursor-pointer transition-all duration-200 ${targets.includes(role) ? 'bg-[#4945A4] border-[#4945A4] text-white' : 'text-[#A9B0D8] hover:border-[#4945A4] hover:bg-[#4945A4]/10'}`} onClick={() => toggleTarget(role)}>
                                {role}
                            </button>
                        ))}
                    </div>

                    <button className={`flex-1 m-[15px] rounded-[30px] text-[1.8rem] font-bold border border-transparent cursor-pointer transition-all duration-300 flex flex-col items-center justify-center gap-3 active:scale-[0.98] ${micMuted ? 'bg-[#12131C] border-[#3E437C] text-[#434483]' : 'bg-[#152414] border-[#17291B] text-[#406D37]'}`} onClick={() => setMicMuted(!micMuted)}>
                        <span>{micMuted ? '🎙️ SILENCIO' : '🔴 HABLANDO'}</span>
                        <span className="text-sm font-normal opacity-70">
                            {micMuted ? 'Toca para hablar al destino' : `Enviando audio a: ${targets.join(', ')}`}
                        </span>
                    </button>

                    <div className="p-[15px] bg-[#141522] h-[250px] overflow-y-auto m-[0_15px_15px_15px] rounded-xl border-2 border-[#3E437C]">
                        <div className="text-[10px] font-bold text-gray-500 mb-2 uppercase flex justify-between">
                            <span>Conectados en sala ({crewList.length})</span>
                            <span className="text-green-400">🎧 Recibiendo retorno del Crew</span>
                        </div>
                        {crewList.length === 0 && <div className="text-sm text-gray-600 italic">Esperando que el equipo se una...</div>}

                        {crewList.map(crew => (
                            <div key={crew.id} className={`bg-transparent border-b border-[#23253A] py-3 px-[5px] mb-1 flex flex-col justify-between text-[0.85rem] text-[#A9B0D8] transition duration-200 hover:text-white items-start ${crew.receiving ? 'border-l-2 border-[#ef4444] pl-2.5' : ''}`}>
                                <div className="flex justify-between items-center w-full">
                                    <div className="flex items-center gap-2">
                                        <span>📱 {crew.name}</span>
                                        {crewData[crew.id]?.bat !== undefined && <span className="text-[10px] text-gray-400 font-bold">🔋 {crewData[crew.id].bat}%</span>}
                                        {crewData[crew.id]?.ping !== undefined && <span className="text-[10px] text-blue-400 font-bold">📡 {crewData[crew.id].ping}ms</span>}
                                        {crewData[crew.id]?.qos === 'MALO' && <span className="text-[10px] text-red-500 font-bold animate-pulse">⚠️ RED MALA</span>}
                                        {crewData[crew.id]?.qos === 'OK' && <span className="text-[10px] text-green-500 font-bold">✅ SEÑAL</span>}
                                        {talkingStates[crew.id] && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full animate-pulse">HABLANDO</span>}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {alerts[crew.name] && (
                                            <button 
                                                onClick={() => setAlerts(prev => ({ ...prev, [crew.name]: false }))}
                                                className="bg-yellow-500 text-black text-[9px] font-black px-2 py-1 rounded animate-pulse shadow-[0_0_10px_rgba(234,179,8,0.7)] flex items-center gap-1 cursor-pointer mr-1"
                                                title="Hacer clic para limpiar alerta"
                                            >
                                                🔔 PEDIDO PASO
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => toggleTally(crew.name, 'PGM')}
                                            className={`text-[9px] font-black px-2 py-1 rounded transition-colors cursor-pointer ${
                                                tallyStates[crew.name] === 'PGM' 
                                                    ? 'bg-red-600 text-white shadow-[0_0_10px_rgba(239,68,68,0.7)] animate-pulse' 
                                                    : 'bg-gray-800 text-gray-400 hover:bg-red-600/30'
                                            }`}
                                        >
                                            PGM
                                        </button>
                                        <button 
                                            onClick={() => toggleTally(crew.name, 'PVW')}
                                            className={`text-[9px] font-black px-2 py-1 rounded transition-colors cursor-pointer ${
                                                tallyStates[crew.name] === 'PVW' 
                                                    ? 'bg-green-600 text-black shadow-[0_0_10px_rgba(34,197,94,0.7)]' 
                                                    : 'bg-gray-800 text-gray-400 hover:bg-green-600/30'
                                            }`}
                                        >
                                            PVW
                                        </button>
                                        <button className="bg-yellow-600/20 border border-yellow-500 hover:bg-yellow-500 text-white text-[10px] font-bold px-2 py-0.5 rounded transition-colors"
                                            onClick={() => activePeers.current[crew.id]?.conn.send({ type: 'STROBE' })}
                                            title="Enviar Alerta Estroboscópica Visual">
                                            ⚡
                                        </button>
                                        <button className="bg-red-600/20 border border-red-500 hover:bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded transition-colors"
                                            onClick={() => activePeers.current[crew.id]?.conn.send({ type: 'TALLY' })}>
                                            ⚠️
                                        </button>
                                        <span className={crew.receiving ? "text-red-400 text-xs animate-pulse" : "text-gray-500 text-xs"}>
                                            {crew.receiving ? 'Director Hablando' : 'En espera'}
                                        </span>
                                    </div>
                                </div>
                                <div className="w-full flex items-center gap-2 mt-2">
                                    <span className="text-[10px] text-gray-400 font-bold">VOL</span>
                                    <input type="range" className="flex-1 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                                        min="0" max="1" step="0.05"
                                        value={volumes[crew.id] !== undefined ? volumes[crew.id] : 1}
                                        onChange={e => setVolumes(prev => ({ ...prev, [crew.id]: parseFloat(e.target.value) }))} />
                                </div>
                                <div className="w-full flex items-center gap-2 mt-1">
                                    <span className="text-[9px] text-gray-500 font-bold">MIC</span>
                                    <div id={`vu-segments-${crew.id}`} className="flex-1 flex gap-[2px] h-2 bg-gray-950 p-[1px] rounded">
                                        {Array.from({ length: 15 }).map((_, i) => (
                                            <div key={i} className="flex-1 bg-gray-800 rounded-[1px] transition-colors duration-75"></div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Botón flotante de chat */}
                    <button 
                        onClick={() => { setIsChatOpen(true); setUnreadCount(0); }}
                        className="fixed bottom-4 right-4 bg-purple-600 hover:bg-purple-500 text-white rounded-full p-4 shadow-[0_0_15px_rgba(147,51,234,0.6)] cursor-pointer z-50 flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95"
                    >
                        💬
                        {unreadCount > 0 && (
                            <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center animate-pulse">
                                {unreadCount}
                            </span>
                        )}
                    </button>

                    {/* Panel lateral de chat (Drawer) */}
                    {isChatOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex justify-end transition-opacity duration-300">
                            <div className="absolute inset-0" onClick={() => setIsChatOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-[#141522] border-l-2 border-[#3E437C] h-full flex flex-col shadow-[0_0_35px_rgba(62,67,124,0.5)] z-10">
                                <div className="p-4 border-b border-[#3E437C] bg-[#10111A] flex justify-between items-center">
                                    <h3 className="font-black text-lg text-purple-400">CHAT DE PRODUCCIÓN</h3>
                                    <button onClick={() => setIsChatOpen(false)} className="text-gray-400 hover:text-white font-bold text-lg p-2">✕</button>
                                </div>
                                <div className="p-3 bg-[#10111A]/50 border-b border-[#3E437C]/60 flex items-center gap-2">
                                    <span className="text-[10px] font-bold text-gray-400 uppercase">ENVIAR A:</span>
                                    <select 
                                        value={chatTarget} 
                                        onChange={(e) => setChatTarget(e.target.value)}
                                        className="bg-[#10111A] border border-[#3E437C] text-xs text-[#A9B0D8] rounded px-2 py-1 outline-none flex-1"
                                    >
                                        <option value="TODOS">📢 TODOS</option>
                                        {[...DEFAULT_ROLES, ...dynamicRoles].map(role => (
                                            <option key={role} value={role}>{role}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                                    {messages.length === 0 && (
                                        <div className="text-center text-gray-500 italic text-sm my-auto">
                                            No hay mensajes. Escribe algo para iniciar.
                                        </div>
                                    )}
                                    {messages.map(msg => {
                                        const isSelf = msg.sender === 'Yo' || msg.sender === 'Director';
                                        return (
                                            <div 
                                                key={msg.id} 
                                                className={`flex flex-col max-w-[85%] rounded-lg p-2.5 text-sm ${
                                                    isSelf 
                                                        ? 'self-end bg-[#4945A4] text-white rounded-tr-none' 
                                                        : 'self-start bg-[#23253A] text-[#A9B0D8] rounded-tl-none'
                                                }`}
                                            >
                                                <span className="text-[10px] font-bold text-purple-300 mb-1 uppercase">
                                                    {isSelf ? 'Yo' : msg.sender} {msg.target && msg.target !== 'TODOS' && <span className="text-yellow-400 text-[8px]">[A {msg.target}]</span>}
                                                </span>
                                                <p className="break-all font-semibold leading-snug">{msg.text}</p>
                                                <span className="text-[8px] text-gray-400 self-end mt-1">
                                                    {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="p-4 border-t border-[#3E437C] bg-[#10111A]">
                                    <form 
                                        onSubmit={(e) => { e.preventDefault(); sendChatMessage(); }}
                                        className="flex gap-2"
                                    >
                                        <input 
                                            type="text" 
                                            value={chatInput} 
                                            onChange={(e) => setChatInput(e.target.value)}
                                            placeholder="Escribe un mensaje..."
                                            className="flex-1 bg-[#10111A] border border-[#3E437C] text-sm text-white rounded-lg px-3 py-2 outline-none focus:border-purple-500 mb-0 font-normal text-left"
                                        />
                                        <button 
                                            type="submit"
                                            className="bg-purple-600 hover:bg-purple-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors cursor-pointer"
                                        >
                                            Enviar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- COMPONENTE CREW (POCKET MODE EDITION) ---
        const CrewView = ({ roomName, crewName }) => {
            const [joined, setJoined] = useState(false);
            const [status, setStatus] = useState('Configurando...');
            const [receiving, setReceiving] = useState(false);
            const [isDirectorTalking, setIsDirectorTalking] = useState(false);
            const [isTalking, setIsTalking] = useState(false);
            const [pocketMode, setPocketMode] = useState(false);
            const [tally, setTally] = useState(false);
            const [tallyState, setTallyState] = useState('OFF');
            const [airRequestCooldown, setAirRequestCooldown] = useState(false);
            const [isLatchEnabled, setIsLatchEnabled] = useState(false);
            const [strobeActive, setStrobeActive] = useState(false);

            const [messages, setMessages] = useState([]);
            const [isChatOpen, setIsChatOpen] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const [unreadCount, setUnreadCount] = useState(0);

            const [audioDevices, setAudioDevices] = useState([]);
            const [selectedAudio, setSelectedAudio] = useState('');

            const peer = useRef(null);
            const localStreamRef = useRef(null);
            const dataConnRef = useRef(null);
            const pingTimerRef = useRef(null);
            const isIntentionalDisconnect = useRef(false);
            const qosTimerRef = useRef(null);

            const incomingAudioRef = useRef(null);
            const animRef = useRef(null);
            const crewAnalyserRef = useRef(null);
            const crewSourceRef = useRef(null);
            const rawStreamRef = useRef(null);
            const reconnectTimer = useRef(null);
            const backoffRef = useRef(1000);
            const [networkQoS, setNetworkQoS] = useState('excelente');

            const wasTalking = useRef(false);

            useEffect(() => {
                if (isDirectorTalking && !wasTalking.current) {
                    try { if (navigator.vibrate) navigator.vibrate([150, 100, 150]); } catch (e) { }
                    try {
                        if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                            new Notification("STREAMTALK V9", { body: "Estás recibiendo audio en tu canal." });
                        }
                    } catch (e) { }
                }
                wasTalking.current = isDirectorTalking;
            }, [isDirectorTalking]);

            // --- WAKE LOCK IMPLACABLE (Mantiene la pantalla encendida eternamente) ---
            useEffect(() => {
                if (!joined) return;
                let wakeLock = null;
                const requestWakeLock = async () => {
                    try {
                        if ('wakeLock' in navigator) {
                            wakeLock = await navigator.wakeLock.request('screen');
                            console.log("Pantalla forzada a mantenerse encendida.");
                        }
                    } catch (err) { console.log(err); }
                };

                requestWakeLock();

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') requestWakeLock();
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLock !== null) wakeLock.release().catch(() => { });
                };
            }, [joined]);

            // Obtener dispositivos
            useEffect(() => {
                if (joined) return;
                navigator.mediaDevices.getUserMedia({ audio: true }).then((tempStream) => {
                    tempStream.getTracks().forEach(t => t.stop());
                    navigator.mediaDevices.enumerateDevices().then(devs => {
                        const audios = devs.filter(d => d.kind === 'audioinput');
                        setAudioDevices(audios);
                        if (audios.length > 0) setSelectedAudio(audios[0].deviceId);
                    });
                }).catch(e => setStatus('Permiso de micrófono requerido para hablar.'));
            }, [joined]);

            const cleanupAudioNodes = () => {
                if (animRef.current) cancelAnimationFrame(animRef.current);
                if (crewSourceRef.current) {
                    try { crewSourceRef.current.disconnect(); } catch (e) {}
                    crewSourceRef.current = null;
                }
                if (crewAnalyserRef.current) {
                    try { crewAnalyserRef.current.disconnect(); } catch (e) {}
                    crewAnalyserRef.current = null;
                }
            };

            // Iniciar conexión
            useEffect(() => {
                if (!joined) return;

                const connectToDirector = async () => {
                    setStatus('Iniciando hardware...');

                    try {
                        if (!localStreamRef.current) {
                            const rawStream = await navigator.mediaDevices.getUserMedia({
                                audio: {
                                    deviceId: selectedAudio ? { exact: selectedAudio } : undefined,
                                    echoCancellation: true,
                                    noiseSuppression: true,
                                    autoGainControl: true,
                                    channelCount: 1,
                                    sampleRate: 48000,
                                    latency: 0
                                }
                            });
                            rawStreamRef.current = rawStream;

                            const audioCtx = window._globalAudioCtx;
                            if (audioCtx) {
                                const micSource = audioCtx.createMediaStreamSource(rawStream);
                                const hpf = audioCtx.createBiquadFilter();
                                hpf.type = 'highpass';
                                hpf.frequency.value = 100; // HPF a 100Hz para el Crew
                                const dest = audioCtx.createMediaStreamDestination();
                                micSource.connect(hpf);
                                hpf.connect(dest);
                                
                                const processedStream = dest.stream;
                                processedStream.getAudioTracks().forEach(t => t.enabled = false);
                                localStreamRef.current = processedStream;
                            } else {
                                rawStream.getAudioTracks().forEach(t => t.enabled = false);
                                localStreamRef.current = rawStream;
                            }
                        }
                    } catch (e) {
                        setStatus('❌ Error de micrófono local.');
                        return;
                    }

                    setStatus('Buscando Director...');
                    isIntentionalDisconnect.current = true;
                    if (peer.current) peer.current.destroy();
                    isIntentionalDisconnect.current = false;
                    peer.current = new Peer(undefined, PEER_CONFIG);

                    peer.current.on('open', (id) => {
                        const directorId = `st_dir_${roomName.replace(/\s+/g, '').toUpperCase()}`;

                        const conn = peer.current.connect(directorId, { metadata: { role: crewName } });
                        dataConnRef.current = conn;

                        let lastPongTime = Date.now();
                        let lastPingSent = Date.now();

                        conn.on('open', () => {
                            setStatus('Conectado. Esperando ruteo...');
                            if (window.screen && screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('portrait').catch(e => { });
                            }
                            lastPongTime = Date.now();
                            if (pingTimerRef.current) clearInterval(pingTimerRef.current);
                            pingTimerRef.current = setInterval(() => {
                                if (conn && conn.open) {
                                    lastPingSent = Date.now();
                                    if (navigator.getBattery) {
                                        navigator.getBattery().then(b => {
                                            conn.send({ type: 'PING', bat: Math.round(b.level * 100) });
                                        }).catch(() => conn.send({ type: 'PING' }));
                                    } else {
                                        conn.send({ type: 'PING' });
                                    }
                                    if (Date.now() - lastPongTime > 12000) {
                                        if (pingTimerRef.current) clearInterval(pingTimerRef.current);
                                        scheduleReconnect('Heartbeat perdido. Reconectando...');
                                    }
                                }
                            }, 5000);
                        });

                        conn.on('data', (data) => {
                            if (data && data.type === 'PONG') {
                                lastPongTime = Date.now();
                                conn.send({ type: 'STATS', ping: lastPongTime - lastPingSent });
                            }
                            if (data && data.type === 'TALLY') {
                                setTally(true);
                                try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) { }
                                setTimeout(() => setTally(false), 2500);
                            }
                            if (data && data.type === 'STROBE') {
                                setStrobeActive(true);
                                try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200, 100, 500]); } catch (e) { }
                                playNotificationSound();
                                setTimeout(() => setStrobeActive(false), 3000);
                            }
                            if (data && data.type === 'TALLY_STATE') {
                                setTallyState(data.state);
                                if (data.state === 'PGM') {
                                    try { if (navigator.vibrate) navigator.vibrate([300, 100, 300]); } catch (e) {}
                                } else if (data.state === 'PVW') {
                                    try { if (navigator.vibrate) navigator.vibrate(150); } catch (e) {}
                                }
                            }
                            if (data && data.type === 'CHAT') {
                                setMessages(prev => [...prev, { id: Math.random(), sender: 'Director', text: data.text, timestamp: Date.now() }]);
                                playNotificationSound();
                                if (!isChatOpen) setUnreadCount(c => c + 1);
                            }
                        });

                        conn.on('error', () => scheduleReconnect('Error de datos.'));
                        conn.on('close', () => scheduleReconnect('Director desconectado.'));
                    });

                    peer.current.on('disconnected', () => {
                        console.log("Señalización del Crew desconectada. Reconectando...");
                        peer.current.reconnect();
                    });

                    peer.current.on('call', (call) => {
                        call.answer(localStreamRef.current);

                        call.on('stream', (remoteStream) => {
                            setStatus('✅ EN LÍNEA');
                            setReceiving(true);

                            if (incomingAudioRef.current) {
                                incomingAudioRef.current.srcObject = remoteStream;
                                incomingAudioRef.current.volume = 1;
                                incomingAudioRef.current.play().catch(e => console.error("Autoplay bloqueado", e));
                            }

                            backoffRef.current = 1000;
                            if (call.peerConnection) {
                                if (qosTimerRef.current) clearInterval(qosTimerRef.current);
                                qosTimerRef.current = setInterval(async () => {
                                    if (!call.peerConnection) return;
                                    try {
                                        const stats = await call.peerConnection.getStats();
                                        stats.forEach(report => {
                                            if (report.type === 'inbound-rtp' && report.kind === 'audio') {
                                                const pl = report.packetsLost || 0;
                                                const j = report.jitter || 0;
                                                const isPoor = j > 0.05 || (pl - (call._lastPl || 0)) > 5;
                                                setNetworkQoS(isPoor ? 'degradada' : 'excelente');
                                                if (dataConnRef.current && dataConnRef.current.open) {
                                                    dataConnRef.current.send({ type: 'STATS', qos: isPoor ? 'MALO' : 'OK' });
                                                }
                                                call._lastPl = pl;
                                            }
                                        });
                                    } catch (e) { }
                                }, 2500);
                            }

                            try {
                                if (animRef.current) cancelAnimationFrame(animRef.current);
                                
                                // Limpiar nodos previos si existen
                                if (crewSourceRef.current) {
                                    try { crewSourceRef.current.disconnect(); } catch (e) {}
                                    crewSourceRef.current = null;
                                }
                                if (crewAnalyserRef.current) {
                                    try { crewAnalyserRef.current.disconnect(); } catch (e) {}
                                    crewAnalyserRef.current = null;
                                }

                                const audioCtx = window._globalAudioCtx;
                                if (audioCtx) {
                                    const analyser = audioCtx.createAnalyser();
                                    analyser.fftSize = 32;
                                    const source = audioCtx.createMediaStreamSource(remoteStream);
                                    source.connect(analyser);
                                    crewAnalyserRef.current = analyser;
                                    crewSourceRef.current = source;
                                    
                                    const dataArray = new Uint8Array(analyser.frequencyBinCount);
                                    const updateLevel = () => {
                                        if (!crewAnalyserRef.current) return;
                                        analyser.getByteFrequencyData(dataArray);
                                        let sum = 0;
                                        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                                        const avg = sum / dataArray.length;
                                        
                                        const talking = avg > 10;
                                        setIsDirectorTalking(prev => {
                                            if (prev !== talking) return talking;
                                            return prev;
                                        });

                                        const container = document.getElementById('vu-segments-director');
                                        if (container) {
                                            const segmentsCount = 15;
                                            const litSegments = Math.min(Math.round((avg / 60) * segmentsCount), segmentsCount);
                                            const children = container.children;
                                            for (let i = 0; i < children.length; i++) {
                                                if (i < litSegments) {
                                                    if (i < 9) {
                                                        children[i].style.backgroundColor = '#22c55e'; // Verde
                                                    } else if (i < 13) {
                                                        children[i].style.backgroundColor = '#eab308'; // Amarillo
                                                    } else {
                                                        children[i].style.backgroundColor = '#ef4444'; // Rojo
                                                    }
                                                } else {
                                                    children[i].style.backgroundColor = '#1e293b'; // Apagado
                                                }
                                            }
                                        }

                                        const pulseRing = document.getElementById('dir-audio-ring');
                                        if (pulseRing) {
                                            if (talking) {
                                                pulseRing.style.opacity = Math.min(avg / 50, 1);
                                                pulseRing.style.transform = `scale(${1 + (avg / 300)})`;
                                            } else {
                                                pulseRing.style.opacity = 0;
                                                pulseRing.style.transform = 'scale(1)';
                                            }
                                        }

                                        animRef.current = requestAnimationFrame(updateLevel);
                                    };
                                    updateLevel();
                                }
                            } catch (e) { }
                        });

                        call.on('close', () => {
                            setReceiving(false);
                            cleanupAudioNodes();
                            if (qosTimerRef.current) {
                                clearInterval(qosTimerRef.current);
                                qosTimerRef.current = null;
                            }
                            scheduleReconnect('Llamada finalizada.');
                        });

                        call.on('error', (err) => {
                            cleanupAudioNodes();
                            if (qosTimerRef.current) {
                                clearInterval(qosTimerRef.current);
                                qosTimerRef.current = null;
                            }
                            scheduleReconnect('Error en la llamada.');
                        });
                    });

                    peer.current.on('error', (err) => { scheduleReconnect('Buscando señal del Director...'); });
                };

                const scheduleReconnect = (msg) => {
                    if (isIntentionalDisconnect.current) return;
                    setStatus(msg); setReceiving(false);
                    if (reconnectTimer.current) clearTimeout(reconnectTimer.current);

                    try {
                        if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                            new Notification("STREAMTALK V9", { body: "Señal perdida. Reconectando al Director..." });
                        }
                    } catch (e) { }

                    const nextDelay = backoffRef.current + (Math.random() * 500);
                    reconnectTimer.current = setTimeout(connectToDirector, nextDelay);
                    backoffRef.current = Math.min(backoffRef.current * 2, 8000);
                };

                const handleOnline = () => scheduleReconnect('Red detectada. Reconectando...');
                const handleOffline = () => setStatus('⚠ RED DESCONECTADA');
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                connectToDirector();

                return () => {
                    isIntentionalDisconnect.current = true;
                    if (peer.current) peer.current.destroy();
                    if (localStreamRef.current) {
                        localStreamRef.current.getTracks().forEach(t => t.stop());
                        localStreamRef.current = null;
                    }
                    if (rawStreamRef.current) {
                        rawStreamRef.current.getTracks().forEach(t => t.stop());
                        rawStreamRef.current = null;
                    }
                    if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
                    cleanupAudioNodes();
                    if (pingTimerRef.current) clearInterval(pingTimerRef.current);
                    if (qosTimerRef.current) {
                        clearInterval(qosTimerRef.current);
                        qosTimerRef.current = null;
                    }
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, [joined, roomName, crewName, selectedAudio]);

            const startTalk = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                setIsTalking(true);
                if (dataConnRef.current && dataConnRef.current.open) {
                    dataConnRef.current.send({ type: 'PTT', state: true });
                }
                if (navigator.vibrate) navigator.vibrate(50);
            };

            const stopTalk = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                setIsTalking(false);
                if (dataConnRef.current && dataConnRef.current.open) {
                    dataConnRef.current.send({ type: 'PTT', state: false });
                }
            };

            const handlePttClick = () => {
                if (!isLatchEnabled) return;
                if (isTalking) {
                    setIsTalking(false);
                    if (dataConnRef.current && dataConnRef.current.open) {
                        dataConnRef.current.send({ type: 'PTT', state: false });
                    }
                } else {
                    setIsTalking(true);
                    if (dataConnRef.current && dataConnRef.current.open) {
                        dataConnRef.current.send({ type: 'PTT', state: true });
                    }
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            };

            const sendAirRequest = () => {
                if (airRequestCooldown) return;
                
                if (dataConnRef.current && dataConnRef.current.open) {
                    dataConnRef.current.send({ type: 'ALERT' });
                    setAirRequestCooldown(true);
                    setTimeout(() => setAirRequestCooldown(false), 5000);
                    if (navigator.vibrate) navigator.vibrate(100);
                } else {
                    alert("No estás conectado al Director.");
                }
            };

            const sendChatMessage = () => {
                if (!chatInput.trim()) return;
                const msgText = chatInput.trim();
                const newMsg = {
                    id: Math.random(),
                    sender: 'Yo',
                    text: msgText,
                    timestamp: Date.now()
                };
                
                setMessages(prev => [...prev, newMsg]);
                
                if (dataConnRef.current && dataConnRef.current.open) {
                    dataConnRef.current.send({ type: 'CHAT', text: msgText });
                }
                setChatInput('');
            };

            const playNotificationSound = () => {
                playSoundEffect(880, 0.15);
            };

            useEffect(() => {
                try {
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({ title: 'StreamTalk PTT', artist: 'Crew' });
                        navigator.mediaSession.setActionHandler('play', () => startTalk(null));
                        navigator.mediaSession.setActionHandler('pause', () => stopTalk(null));
                    }
                } catch (e) { }

                return () => {
                    try {
                        if ('mediaSession' in navigator) {
                            navigator.mediaSession.setActionHandler('play', null);
                            navigator.mediaSession.setActionHandler('pause', null);
                        }
                    } catch (e) { }
                }
            }, []);

            useEffect(() => {
                if (incomingAudioRef.current) incomingAudioRef.current.muted = isTalking;
                if (localStreamRef.current) {
                    localStreamRef.current.getAudioTracks().forEach(t => t.enabled = isTalking);
                }
            }, [isTalking]);

            const handleJoin = () => {
                if (!window._globalAudioCtx) {
                    window._globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive', sampleRate: 48000 });
                }
                if (window._globalAudioCtx.state === 'suspended') {
                    window._globalAudioCtx.resume();
                }

                if (incomingAudioRef.current) {
                    incomingAudioRef.current.play().catch(e => { });
                }
                setJoined(true);
            };

            return (
                <div style={{ width: '100%', height: '100%' }}>
                    {tally && <div className="absolute top-0 left-0 w-full h-full bg-red-600 z-[9999] animate-ping opacity-80 pointer-events-none"></div>}
                    {strobeActive && (
                        <div className="fixed inset-0 z-[99999] flex flex-col items-center justify-center animate-strobe pointer-events-none text-white">
                            <span className="text-[5rem] animate-bounce">🚨</span>
                            <span className="text-2xl font-black uppercase tracking-widest mt-4 bg-black/80 px-4 py-2 rounded-lg border-2 border-yellow-500 shadow-[0_0_20px_#eab308]">
                                LLAMADA DEL DIRECTOR
                            </span>
                        </div>
                    )}
                    <audio ref={incomingAudioRef} autoPlay playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }}></audio>

                    {/* --- POCKET MODE OVERLAY --- */}
                    {pocketMode && (
                        <div className="absolute top-0 left-0 w-full h-full bg-black z-[9999] flex flex-col items-center justify-center text-[#333]" onDoubleClick={() => setPocketMode(false)}>
                            <div className="text-[4rem] opacity-20 mb-5">🔒</div>
                            <div className="text-base font-bold uppercase opacity-30">Modo Bolsillo Activo</div>
                            <div className="text-[10px] text-gray-600 mt-4 uppercase">Doble toque en la pantalla para salir</div>
                        </div>
                    )}

                    {!joined ? (
                        <div className="flex flex-col items-center justify-center h-full p-5 text-center">
                            <div className="bg-[#141522] p-7 rounded-xl border-2 border-[#3E437C] shadow-[0_0_35px_rgba(62,67,124,0.4)] max-w-[400px] w-full">
                                <h2 className="text-2xl font-black mb-2 text-[#4945A4]">STREAM<span className="text-[#A9B0D8]">TALK</span></h2>
                                <p className="mb-4 text-sm text-[#A9B0D8]">Receptor Pocket Mode V9</p>

                                <div className="bg-[#10111A] border-2 border-[#3E437C] p-4 rounded-lg mb-4 text-left shadow-[0_0_15px_rgba(62,67,124,0.3)]">
                                    <p className="text-xs font-bold text-[#A9B0D8] mb-1">👤 ROL: <span className="text-white">{crewName.toUpperCase()}</span></p>
                                    <p className="text-xs font-bold text-[#A9B0D8]">🏢 SALA: <span className="text-white">{roomName.toUpperCase()}</span></p>
                                </div>

                                <label className="block text-left text-[10px] font-bold text-[#A9B0D8] mb-1">SELECCIONA TU MICRÓFONO</label>
                                <select className="box-border w-full bg-[#10111A] border-2 border-[#3E437C] text-[#A9B0D8] p-4 rounded-lg text-sm outline-none mb-5" value={selectedAudio} onChange={(e) => setSelectedAudio(e.target.value)}>
                                    {audioDevices.length === 0 && <option>Revisando hardware...</option>}
                                    {audioDevices.map(d => <option key={d.deviceId} value={d.deviceId}>{d.label || 'Micrófono'}</option>)}
                                </select>

                                <button className="w-full p-[15px] font-bold text-base rounded-lg cursor-pointer border-none transition duration-200 mb-2.5 bg-[#4945A4] text-white hover:bg-[#5A56C4] shadow-lg" onClick={handleJoin}>
                                    🎧 CONECTAR Y ESCUCHAR
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className={`flex flex-col items-center h-screen p-5 text-center relative transition-all duration-300 ${
                            tallyState === 'PGM' 
                                ? 'bg-[#381212] border-[8px] border-[#ef4444]' 
                                : tallyState === 'PVW' 
                                    ? 'bg-[#12381e] border-[8px] border-[#22c55e]'
