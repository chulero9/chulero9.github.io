                                    : 'bg-[#10111A]'
                        }`}>
                            {tallyState !== 'OFF' && (
                                <div className={`w-full py-2 mb-2 rounded-lg font-black text-center text-sm animate-pulse tracking-widest ${
                                    tallyState === 'PGM' 
                                        ? 'bg-red-600 text-white shadow-[0_0_15px_rgba(239,68,68,0.7)]' 
                                        : 'bg-green-600 text-black shadow-[0_0_15px_rgba(34,197,94,0.7)]'
                                }`}>
                                    {tallyState === 'PGM' ? '🔴 PROGRAM / AL AIRE' : '🟢 PREVIEW / PREVIO'}
                                </div>
                            )}
                            
                            <div className="w-full flex justify-between px-4 mb-4">
                                <span className="text-xs font-bold text-[#A9B0D8]">SALA: {roomName}</span>
                                <span className={networkQoS === 'degradada' ? 'text-xs font-bold text-red-500 animate-pulse uppercase' : 'text-xs font-bold text-[#A9B0D8] uppercase'}>{networkQoS === 'degradada' ? '⚠️ RED POBRE' : status}</span>
                            </div>

                            <h2 className="text-3xl font-black text-white mb-6 tracking-widest">{crewName.toUpperCase()}</h2>

                            <div className={`w-[120px] h-[120px] rounded-full border-[6px] bg-[#141522] flex items-center justify-center text-[3rem] my-5 mx-0 transition-all duration-300 relative ${isDirectorTalking ? 'border-[#ef4444] text-[#ef4444] shadow-[0_0_50px_rgba(239,68,68,0.5)]' : 'border-[#4945A4] text-[#4945A4] shadow-[0_0_30px_rgba(73,69,164,0.4)]'}`}>
                                {isDirectorTalking ? '🗣️' : '🎧'}
                                <div id="dir-audio-ring" className="absolute -top-[6px] -left-[6px] -right-[6px] -bottom-[6px] rounded-full border-[6px] border-[#ef4444] opacity-0 pointer-events-none transition-transform duration-75"></div>
                            </div>

                            <div className="h-6 mb-4">
                                {isDirectorTalking ? (
                                    <p className="text-lg font-bold text-red-400 animate-pulse uppercase">Recibiendo Audio...</p>
                                ) : (
                                    receiving && <p className="text-sm font-bold text-[#4945A4] uppercase">Canal Silenciado</p>
                                )}
                            </div>

                            {/* Vúmetro segmentado profesional del Director */}
                            <div className="w-full max-w-[200px] mb-6 flex flex-col gap-1.5 items-center">
                                <span className="text-[9px] font-bold text-[#4945A4] tracking-widest uppercase">Señal Director</span>
                                <div id="vu-segments-director" className="w-full flex gap-[2px] h-2 bg-gray-950 p-[1px] rounded">
                                    {Array.from({ length: 15 }).map((_, i) => (
                                        <div key={i} className="flex-1 bg-gray-800 rounded-[1px] transition-colors duration-75"></div>
                                    ))}
                                </div>
                            </div>

                            <div
                                className={`w-full max-w-[300px] flex-1 my-2.5 mx-0 rounded-[20px] border-4 text-[1.5rem] font-black flex flex-col items-center justify-center shadow-[0_10px_30px_rgba(0,0,0,0.5)] transition duration-100 cursor-pointer select-none ${isTalking ? 'bg-[#2E502B] border-[#406D37] shadow-[0_0_40px_rgba(64,109,55,0.8)] text-white scale-95' : 'bg-[#152414] border-[#17291B] text-[#406D37]'}`}
                                onMouseDown={!isLatchEnabled ? startTalk : undefined} 
                                onMouseUp={!isLatchEnabled ? stopTalk : undefined} 
                                onMouseLeave={!isLatchEnabled ? stopTalk : undefined}
                                onTouchStart={!isLatchEnabled ? startTalk : undefined} 
                                onTouchEnd={!isLatchEnabled ? stopTalk : undefined}
                                onClick={isLatchEnabled ? handlePttClick : undefined}
                                onContextMenu={(e) => e.preventDefault()}
                            >
                                {isTalking ? '🎙️ ENVIANDO...' : (isLatchEnabled ? 'TOCA PARA HABLAR' : 'PUSH TO TALK')}
                                <span className="text-[0.9rem] opacity-80 mt-1">{isTalking ? 'Suelta/Toca para escuchar' : (isLatchEnabled ? 'Presiona una vez para abrir micro' : 'Mantén presionado para hablar')}</span>
                            </div>

                            {/* Control de Modo Latch (Manos Libres) */}
                            <div className="flex items-center justify-center gap-2 mb-4">
                                <span className="text-[10px] font-bold text-[#A9B0D8] uppercase">🔒 Candado Micro (Latch):</span>
                                <button 
                                    onClick={() => {
                                        if (isTalking) {
                                            // Detener audio al cambiar de modo
                                            setIsTalking(false);
                                            if (dataConnRef.current && dataConnRef.current.open) {
                                                dataConnRef.current.send({ type: 'PTT', state: false });
                                            }
                                        }
                                        setIsLatchEnabled(!isLatchEnabled);
                                    }}
                                    className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all duration-200 cursor-pointer ${
                                        isLatchEnabled 
                                            ? 'bg-purple-600 text-white shadow-[0_0_10px_rgba(147,51,234,0.6)]' 
                                            : 'bg-[#23253A] border border-[#3E437C] text-gray-400 hover:text-white'
                                    }`}
                                >
                                    {isLatchEnabled ? 'MANOS LIBRES ACTIVO' : 'PULSADO MANUAL'}
                                </button>
                            </div>

                            <button 
                                onClick={sendAirRequest}
                                disabled={airRequestCooldown}
                                className={`w-full p-[15px] font-bold text-base rounded-lg cursor-pointer transition duration-200 mb-2.5 mt-2 border-none ${
                                    airRequestCooldown
                                        ? 'bg-[#ef4444]/20 text-[#ef4444]/60 cursor-not-allowed border border-[#ef4444]/40'
                                        : 'bg-[#eab308] hover:bg-[#ca8a04] text-black shadow-[0_0_15px_rgba(234,179,8,0.3)]'
                                }`}
                            >
                                {airRequestCooldown ? '🔔 SOLICITUD ENVIADA...' : '🔔 SOLICITAR PASO (PEDIR AIRE)'}
                            </button>

                            <button className="w-full p-[15px] font-bold text-base rounded-lg cursor-pointer border-none transition duration-200 mb-2.5 bg-black/30 border-2 border-[#3E437C] text-[#888] hover:border-[#4945A4] hover:text-white mt-4" onClick={() => setPocketMode(true)}>
                                🔒 ACTIVAR MODO BOLSILLO
                            </button>

                            <div className="mt-4 text-[10px] font-bold text-[#4945A4] uppercase px-6">
                                IMPORTANTE: Usa el "Modo Bolsillo" para simular la pantalla apagada en negro y evitar que el teléfono corte el audio y bloquee la app.
                            </div>
                        </div>
                    )}

                    {/* Botón flotante de chat */}
                    <button 
                        onClick={() => { setIsChatOpen(true); setUnreadCount(0); }}
                        className="fixed bottom-4 right-4 bg-purple-600 hover:bg-purple-500 text-white rounded-full p-4 shadow-[0_0_15px_rgba(147,51,234,0.6)] cursor-pointer z-50 flex items-center justify-center transition-all duration-200 hover:scale-105 active:scale-95"
                    >
                        💬
                        {unreadCount > 0 && (
                            <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center animate-pulse">
                                {unreadCount}
                            </span>
                        )}
                    </button>

                    {/* Panel lateral de chat (Drawer) */}
                    {isChatOpen && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex justify-end transition-opacity duration-300">
                            <div className="absolute inset-0" onClick={() => setIsChatOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-[#141522] border-l-2 border-[#3E437C] h-full flex flex-col shadow-[0_0_35px_rgba(62,67,124,0.5)] z-10">
                                <div className="p-4 border-b border-[#3E437C] bg-[#10111A] flex justify-between items-center">
                                    <h3 className="font-black text-lg text-purple-400">CHAT DE PRODUCCIÓN</h3>
                                    <button onClick={() => setIsChatOpen(false)} className="text-gray-400 hover:text-white font-bold text-lg p-2">✕</button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                                    {messages.length === 0 && (
                                        <div className="text-center text-gray-500 italic text-sm my-auto">
                                            No hay mensajes. Escribe algo para iniciar.
                                        </div>
                                    )}
                                    {messages.map(msg => {
                                        const isSelf = msg.sender === 'Yo';
                                        return (
                                            <div 
                                                key={msg.id} 
                                                className={`flex flex-col max-w-[85%] rounded-lg p-2.5 text-sm ${
                                                    isSelf 
                                                        ? 'self-end bg-[#4945A4] text-white rounded-tr-none' 
                                                        : 'self-start bg-[#23253A] text-[#A9B0D8] rounded-tl-none'
                                                }`}
                                            >
                                                <span className="text-[10px] font-bold text-purple-300 mb-1 uppercase">
                                                    {msg.sender}
                                                </span>
                                                <p className="break-all font-semibold leading-snug">{msg.text}</p>
                                                <span className="text-[8px] text-gray-400 self-end mt-1">
                                                    {new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="p-4 border-t border-[#3E437C] bg-[#10111A]">
                                    <form 
                                        onSubmit={(e) => { e.preventDefault(); sendChatMessage(); }}
                                        className="flex gap-2"
                                    >
                                        <input 
                                            type="text" 
                                            value={chatInput} 
                                            onChange={(e) => setChatInput(e.target.value)}
                                            placeholder="Escribe un mensaje..."
                                            className="flex-1 bg-[#10111A] border border-[#3E437C] text-sm text-white rounded-lg px-3 py-2 outline-none focus:border-purple-500 mb-0 font-normal text-left"
                                        />
                                        <button 
                                            type="submit"
                                            className="bg-purple-600 hover:bg-purple-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors cursor-pointer"
                                        >
                                            Enviar
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- LOBBY Y ENRUTADOR ---
        const App = () => {
            const [mode, setMode] = useState('lobby');
            const [roomName, setRoomName] = useState('');
            const [tempInput, setTempInput] = useState('');
            const [crewName, setCrewName] = useState('');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const m = params.get('mode');
                const r = params.get('room');

                let savedRoom = '', savedCrew = '';
                try {
                    savedRoom = localStorage.getItem('st_roomName');
                    savedCrew = localStorage.getItem('st_crewName');
                } catch (e) { }

                if (r) setRoomName(r);
                else setRoomName(savedRoom || Math.random().toString(36).substring(2, 6).toUpperCase());

                if (savedCrew) setTempInput(savedCrew);

                if (m === 'director') setMode('director');
                else if (m === 'crew') setMode('crew-setup');

                try {
                    if ('Notification' in window && Notification.permission === 'default') {
                        const p = Notification.requestPermission();
                        if (p && p.catch) p.catch(() => { });
                    }
                } catch (e) { }
            }, []);

            const enterAsDirector = () => {
                if (!roomName.trim()) return alert("Ingresa un nombre de sala");
                const url = new URL(window.location);
                url.searchParams.set('mode', 'director');
                url.searchParams.set('room', roomName);
                window.location.href = url.toString();
            };

            const submitCrewName = (name) => {
                if (!name.trim()) return alert("Debes ingresar un nombre o rol.");
                const upperName = name.trim().toUpperCase();

                try {
                    localStorage.setItem('st_crewName', upperName);
                    localStorage.setItem('st_roomName', roomName);
                } catch (e) { }

                setCrewName(upperName);
                setMode('crew-active');
            };

            if (mode === 'director') return <DirectorView roomName={roomName} />;
            if (mode === 'crew-active') return <CrewView roomName={roomName} crewName={crewName} />;

            if (mode === 'crew-setup') {
                return (
                    <div className="flex flex-col items-center justify-center h-full p-5 text-center">
                        <div className="bg-[#141522] p-7 rounded-xl border-2 border-[#3E437C] shadow-[0_0_35px_rgba(62,67,124,0.4)] max-w-[400px] w-full">
                            <h1 className="text-2xl font-black mb-1 text-white">IDENTIFICACIÓN</h1>
                            <p className="text-xs text-[#A9B0D8] mb-6">Sala: {roomName}</p>

                            <label className="block text-left text-xs font-bold text-[#A9B0D8] mb-2">ELIGE TU PUESTO O ESCRIBE TU NOMBRE</label>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {['CAM 1', 'CAM 2', 'CAM 3', 'SONIDO', 'PISO', 'PROD'].map(preset => (
                                    <button key={preset} className="bg-[#12131C] border-2 border-[#3E437C] text-[#A9B0D8] text-xs font-bold py-3 rounded hover:bg-[#4945A4] hover:text-white transition-all shadow-[0_0_10px_rgba(62,67,124,0.2)]" onClick={() => submitCrewName(preset)}>{preset}</button>
                                ))}
                            </div>
                            <div className="w-full border-t-2 border-[#3E437C] my-4"></div>
                            <input className="box-border w-full bg-[#10111A] border-2 border-[#3E437C] text-white p-4 rounded-lg text-lg text-center font-bold mb-4 outline-none uppercase focus:border-[#4945A4]" value={tempInput} onChange={(e) => setTempInput(e.target.value.toUpperCase())} placeholder="OTRO NOMBRE..." onKeyPress={(e) => e.key === 'Enter' && submitCrewName(tempInput)} />
                            <button className="w-full p-[15px] font-bold text-base rounded-lg cursor-pointer border-none transition duration-200 mb-2.5 bg-[#4945A4] text-white hover:bg-[#5A56C4]" onClick={() => submitCrewName(tempInput)}>CONTINUAR</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col items-center justify-center h-full p-5 text-center">
                    <div className="bg-[#141522] p-7 rounded-xl border-2 border-[#3E437C] shadow-[0_0_35px_rgba(62,67,124,0.4)] max-w-[400px] w-full">
                        <h1 className="text-3xl font-black mb-2 text-[#A9B0D8]">STREAM<span className="text-[#4945A4]">TALK</span> V9</h1>
                        <p className="text-[#A9B0D8] text-sm mb-8 font-bold">POCKET MODE EDITION</p>

                        <label className="block text-left text-xs font-bold text-[#A9B0D8] mb-2">CÓDIGO DE PRODUCCIÓN</label>
                        <input className="box-border w-full bg-[#10111A] border-2 border-[#3E437C] text-white p-4 rounded-lg text-lg text-center font-bold mb-4 outline-none uppercase focus:border-[#4945A4]" value={roomName} onChange={(e) => setRoomName(e.target.value.toUpperCase())} placeholder="EJ: SHOW-1" />

                        <button className="w-full p-[15px] font-bold text-base rounded-lg cursor-pointer border-none transition duration-200 mb-2.5 bg-[#4945A4] text-white hover:bg-[#5A56C4]" onClick={enterAsDirector}>ENTRAR COMO DIRECTOR</button>
                        <button className="w-full p-[15px] font-bold text-base rounded-lg cursor-pointer border-none transition duration-200 mb-2.5 bg-[#23253A] text-white" onClick={() => setMode('crew-setup')}>ENTRAR COMO EQUIPO</button>

                        <p className="text-[10px] text-[#A9B0D8] mt-6 text-left leading-tight">
                            * Novedad V9.0: "Modo Bolsillo". Soluciona el corte de audio simulando una pantalla en negro sin toques, forzando al navegador a permanecer 100% encendido.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
