<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamTalk V9.0 (Pocket Mode)</title>

    <!-- LIBRERÍAS -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PEER JS (WebRTC P2P) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            background-color: #10111A;
            color: #A9B0D8;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* --- LOBBY & SETUP --- */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

        .glass-box {
            background: #141522;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #3E437C;
            box-shadow: 0 0 35px rgba(62, 67, 124, 0.4);
            max-width: 400px;
            width: 100%;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            background: #10111A;
            border: 2px solid #3E437C;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            outline: none;
            text-transform: uppercase;
        }

        input:focus {
            border-color: #4945A4;
        }

        select {
            box-sizing: border-box;
            width: 100%;
            background: #10111A;
            border: 2px solid #3E437C;
            color: #A9B0D8;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-blue {
            background: #4945A4;
            color: white;
        }

        .btn-blue:hover {
            background: #5A56C4;
        }

        .btn-green {
            background: #4945A4;
            color: white;
        }

        .btn-green:hover {
            background: #5A56C4;
        }

        .btn-gray {
            background: #23253A;
            color: white;
        }

        .btn-dark {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #3E437C;
            color: #888;
        }

        .btn-dark:hover {
            border-color: #4945A4;
            color: white;
        }

        /* --- DIRECTOR VIEW (DARK MATTE VIBE) --- */
        .director-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #10111A;
        }

        .top-bar {
            padding: 15px 25px;
            background: #141522;
            border-bottom: 2px solid #3E437C;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        /* MATRIZ DE RUTEO (Botones Destino) */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 20px;
            background: #141522;
            border: 2px solid #3E437C;
            border-radius: 12px;
            margin: 15px 15px 0 15px;
            box-shadow: 0 0 20px rgba(62, 67, 124, 0.2);
        }

        .matrix-btn {
            padding: 12px 5px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            text-align: center;
            background: transparent;
            border: 2px solid #3E437C;
            color: #A9B0D8;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .matrix-btn:hover {
            border-color: #4945A4;
            background: rgba(73, 69, 164, 0.1);
        }

        .matrix-btn.active {
            background: #4945A4;
            border-color: #4945A4;
            color: white;
        }

        .matrix-btn.all-active {
            background: #f59e0b;
            border-color: #f59e0b;
            color: black;
        }

        /* BOTÓN PTT (Push To Talk / Toggle) */
        .mic-btn-huge {
            flex: 1;
            margin: 15px;
            border-radius: 30px;
            font-size: 1.8rem;
            font-weight: bold;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .mic-btn-huge.on {
            background: #152414;
            border-color: #17291B;
            color: #406D37;
        }

        .mic-btn-huge.off {
            background: #12131C;
            border-color: #3E437C;
            color: #434483;
        }

        .mic-btn-huge:active {
            transform: scale(0.98);
        }



        .crew-list {
            padding: 15px;
            background: #141522;
            border-top: 2px solid #3E437C;
            height: 250px;
            overflow-y: auto;
            margin: 0 15px 15px 15px;
            border-radius: 12px;
            border: 2px solid #3E437C;
        }

        .crew-item {
            background: transparent;
            border-bottom: 1px solid #23253A;
            padding: 12px 5px;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #A9B0D8;
            transition: 0.2s;
        }

        .crew-item:hover {
            color: white;
        }

        .crew-item.receiving {
            border-left: 2px solid #ef4444;
            padding-left: 10px;
        }

        /* SLIDERS DE VOLUMEN (Matte) */
        input[type=range] {
            -webkit-appearance: none;
            background: #10111A;
            border: 1px solid #3E437C;
            border-radius: 10px;
            height: 6px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            transition: 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* --- CREW VIEW (RECEPTOR BIDIRECCIONAL) --- */
        .crew-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
            background: #10111A;
            position: relative;
        }

        .status-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid #23253A;
            background: #141522;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-top: 20px;
            margin-bottom: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .status-ring.idle {
            border-color: #4945A4;
            color: #4945A4;
            box-shadow: 0 0 30px rgba(73, 69, 164, 0.4);
        }

        .status-ring.active {
            border-color: #ef4444;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .vu-ring {
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 6px solid #ef4444;
            opacity: 0;
            pointer-events: none;
        }

        /* BOTÓN PTT DEL CREW (Walkie Talkie) */
        .walkie-btn {
            width: 100%;
            max-width: 300px;
            flex: 1;
            margin-top: 10px;
            margin-bottom: 10px;
            background: #152414;
            color: #406D37;
            border-radius: 20px;
            border: 4px solid #17291B;
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .walkie-btn.talking {
            background: #2E502B;
            border-color: #406D37;
            box-shadow: 0 0 40px rgba(64, 109, 55, 0.8);
            color: white;
            transform: scale(0.95);
        }

        .walkie-btn span {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* --- POCKET MODE (FAKE LOCK SCREEN) --- */
        .pocket-mode-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            /* Texto muy oscuro para no gastar batería */
        }

        .pocket-icon {
            font-size: 4rem;
            opacity: 0.2;
            margin-bottom: 20px;
        }

        .pocket-text {
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const PEER_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        };
        const DEFAULT_ROLES = ['CAM 1', 'CAM 2', 'CAM 3', 'CAM 4', 'SONIDO', 'PISO'];

        // --- COMPONENTE DIRECTOR ---
        const DirectorView = ({ roomName }) => {
            const [status, setStatus] = useState('Listo para iniciar');
            const [isSystemActive, setIsSystemActive] = useState(false);
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [micMuted, setMicMuted] = useState(true);

            useEffect(() => {
                const handleOnline = () => setIsOffline(false);
                const handleOffline = () => setIsOffline(true);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);
            const [crewList, setCrewList] = useState([]);
            const [partyline, setPartyline] = useState(false);
            const [volumes, setVolumes] = useState({});
            const [crewData, setCrewData] = useState({});

            const [targets, setTargets] = useState(['TODOS']);
            const [dynamicRoles, setDynamicRoles] = useState([]);

            const [audioDevices, setAudioDevices] = useState([]);
            const [selectedAudio, setSelectedAudio] = useState('');

            const peer = useRef(null);
            const baseStream = useRef(null);
            const activePeers = useRef({});

            const audioStreamsRef = useRef({});
            const [talkingStates, setTalkingStates] = useState({});

            const directorAudioCtx = useRef(null);
            const dirMicSource = useRef(null);
            const crewAudioSources = useRef({});

            useEffect(() => {
                navigator.mediaDevices.getUserMedia({ audio: true }).then((tempStream) => {
                    tempStream.getTracks().forEach(t => t.stop());
                    navigator.mediaDevices.enumerateDevices().then(devs => {
                        const audios = devs.filter(d => d.kind === 'audioinput');
                        setAudioDevices(audios);
                        if (audios.length > 0) setSelectedAudio(audios[0].deviceId);
                    });
                }).catch(e => setStatus('Error: Permiso de micrófono denegado.'));

                return () => {
                    if (peer.current) peer.current.destroy();
                    if (baseStream.current) baseStream.current.getTracks().forEach(t => t.stop());
                };
            }, []);

            const applyAudioRouting = () => {
                if (!directorAudioCtx.current) return;
                const currentTargets = targets;
                const isMasterMuted = micMuted;

                Object.values(activePeers.current).forEach(peerInfo => {
                    const dest = peerInfo.dest;
                    if (!dest) return;

                    if (dirMicSource.current) {
                        try { dirMicSource.current.disconnect(dest); } catch(e){}
                        const isTargeted = currentTargets.includes('TODOS') || currentTargets.includes(peerInfo.role);
                        if (!isMasterMuted && isTargeted) {
                            dirMicSource.current.connect(dest);
                        }
                    }

                    Object.keys(crewAudioSources.current).forEach(sourcePeerId => {
                        const srcNode = crewAudioSources.current[sourcePeerId];
                        if (!srcNode) return;
                        try { srcNode.disconnect(dest); } catch(e){}
                        if (partyline && talkingStates[sourcePeerId] && sourcePeerId !== peerInfo.id) {
                            srcNode.connect(dest);
                        }
                    });

                    if (peerInfo.track) {
                        peerInfo.track.enabled = true;
                    }
                });

                setCrewList(Object.values(activePeers.current).map(p => ({
                    id: p.id, name: p.role,
                    receiving: !isMasterMuted && (currentTargets.includes('TODOS') || currentTargets.includes(p.role))
                })));
            };

            useEffect(() => { applyAudioRouting(); }, [targets, micMuted, partyline, talkingStates]);

            const startDirector = async () => {
                if (!selectedAudio) return;
                try {
                    setStatus('Conectando hardware...');
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            deviceId: { exact: selectedAudio },
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            channelCount: 1,
                            sampleRate: 48000,
                            latency: 0
                        }
                    });

                    baseStream.current = stream;
                    setIsSystemActive(true);
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!directorAudioCtx.current) directorAudioCtx.current = new AudioContextClass({ latencyHint: 'interactive', sampleRate: 48000 });

                    if (dirMicSource.current) {
                        try { dirMicSource.current.disconnect(); } catch (e) { }
                    }
                    dirMicSource.current = directorAudioCtx.current.createMediaStreamSource(stream);

                    const directorId = `st_dir_${roomName.replace(/\s+/g, '').toUpperCase()}`;

                    if (peer.current) peer.current.destroy();
                    peer.current = new Peer(directorId, PEER_CONFIG);

                    peer.current.on('open', () => {
                        setStatus('Matriz Activa. Esperando al Crew...');
                    });

                    peer.current.on('connection', (conn) => {
                        const role = conn.metadata?.role?.toUpperCase() || 'INVITADO';
                        
                        if (role !== 'INVITADO') {
                            const existingPeerId = Object.keys(activePeers.current).find(id => activePeers.current[id].role === role);
                            if (existingPeerId) {
                                removePeer(existingPeerId);
                            }
                        }

                        if (!DEFAULT_ROLES.includes(role) && role !== 'TODOS') {
                            setDynamicRoles(prev => prev.includes(role) ? prev : [...prev, role]);
                        }

                        conn.on('data', (data) => {
                            if (data.type === 'PTT') {
                                setTalkingStates(prev => ({ ...prev, [conn.peer]: data.state }));
                            }
                            if (data.type === 'PING') {
                                conn.send({ type: 'PONG' });
                                if (data.bat !== undefined) {
                                    setCrewData(prev => ({ ...prev, [conn.peer]: { ...prev[conn.peer], bat: data.bat } }));
                                }
                            }
                            if (data.type === 'STATS') {
                                setCrewData(prev => ({ 
                                    ...prev, 
                                    [conn.peer]: { 
                                        ...prev[conn.peer], 
                                        ...(data.ping !== undefined && { ping: data.ping }),
                                        ...(data.qos !== undefined && { qos: data.qos })
                                    } 
                                }));
                            }
                        });

                        conn.on('open', () => {
                            if (!baseStream.current) return;

                            const peerDest = directorAudioCtx.current.createMediaStreamDestination();
                            const customStream = peerDest.stream;

                            const call = peer.current.call(conn.peer, customStream);

                            activePeers.current[conn.peer] = { id: conn.peer, conn, call, track: customStream.getAudioTracks()[0], role, dest: peerDest };
                            applyAudioRouting();

                            call.on('stream', (crewStream) => {
                                audioStreamsRef.current[conn.peer] = crewStream;
                                setTalkingStates(prev => ({ ...prev, [conn.peer]: false }));

                                if (directorAudioCtx.current && !crewAudioSources.current[conn.peer]) {
                                    crewAudioSources.current[conn.peer] = directorAudioCtx.current.createMediaStreamSource(crewStream);
                                }
                            });

                            call.on('close', () => removePeer(conn.peer));
                            call.on('error', () => removePeer(conn.peer));
                        });

                        conn.on('close', () => removePeer(conn.peer));
                    });

                    peer.current.on('error', (err) => {
                        if (err.type === 'unavailable-id') setStatus('Error: Sala ocupada. Reintenta en 10s.');
                        else setStatus('Error de conexión de red.');
                    });

                } catch (e) {
                    setStatus('Error de hardware. Revisa permisos.');
                }
            };

            const removePeer = (id) => {
                if (crewAudioSources.current[id]) {
                    try { crewAudioSources.current[id].disconnect(); } catch (e) { }
                    delete crewAudioSources.current[id];
                }
                if (activePeers.current[id]) {
                    if (activePeers.current[id].track) activePeers.current[id].track.stop();
                    if (activePeers.current[id].call) activePeers.current[id].call.close();
                    if (activePeers.current[id].conn) activePeers.current[id].conn.close();
                    delete activePeers.current[id];
                    applyAudioRouting();
                }
                delete audioStreamsRef.current[id];
                setTalkingStates(prev => { const n = { ...prev }; delete n[id]; return n; });
                setCrewData(prev => { const n = { ...prev }; delete n[id]; return n; });
            };

            const toggleTarget = (t) => {
                if (t === 'TODOS') { setTargets(['TODOS']); }
                else {
                    let newTargets = targets.filter(x => x !== 'TODOS');
                    if (newTargets.includes(t)) {
                        newTargets = newTargets.filter(x => x !== t);
                        if (newTargets.length === 0) newTargets = ['TODOS'];
                    } else newTargets.push(t);
                    setTargets(newTargets);
                }
            };

            const copyLink = () => {
                const url = `${window.location.href.split('?')[0]}?mode=crew&room=${roomName}`;
                navigator.clipboard.writeText(url);
                alert("Link copiado.");
            };

            const allMatrixRoles = [...DEFAULT_ROLES, ...dynamicRoles];

            if (!isSystemActive) {
                return (
                    <div className="auth-container">
                        <div className="glass-box">
                            <h2 className="text-2xl font-black mb-2 text-[#4945A4]">PANEL DE DIRECTOR</h2>
                            <p className="mb-4 text-sm text-[#A9B0D8]">Selecciona tu micrófono antes de abrir la sala.</p>

                            <select value={selectedAudio} onChange={(e) => setSelectedAudio(e.target.value)}>
                                {audioDevices.length === 0 && <option>Buscando audios...</option>}
                                {audioDevices.map(d => <option key={d.deviceId} value={d.deviceId}>{d.label || 'Micrófono'}</option>)}
                            </select>

                            <button className="btn btn-blue" onClick={startDirector}>INICIAR MATRIZ IFB</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`director-layout relative ${!micMuted ? 'speaking' : ''}`}>
                    {isOffline && (
                        <div className="absolute top-0 left-0 w-full h-full bg-red-900/90 z-50 flex flex-col items-center justify-center">
                            <h1 className="text-4xl font-black text-white mb-2">⚠ SIN CONEXIÓN</h1>
                            <p className="text-white text-lg">Internet interrumpido. Revisando red...</p>
                        </div>
                    )}
                    {/* Renderizador oculto de audios entrantes (Controlados por estado de PTT) */}
                    <div style={{ display: 'none' }}>
                        {Object.keys(talkingStates).map(peerId => (
                            <audio
                                key={peerId}
                                autoPlay
                                playsInline
                                ref={el => {
                                    if (el) {
                                        if (audioStreamsRef.current[peerId] && el.srcObject !== audioStreamsRef.current[peerId]) {
                                            el.srcObject = audioStreamsRef.current[peerId];
                                        }
                                        el.volume = volumes[peerId] !== undefined ? volumes[peerId] : 1;
                                    }
                                }}
                                muted={!talkingStates[peerId]}
                            />
                        ))}
                    </div>

                    <div className="top-bar">
                        <div>
                            <div className="font-black text-xl text-blue-400">STREAM<span className="text-white">TALK</span> V9.0</div>
                            <div className="text-xs text-gray-400 font-bold tracking-widest">{status}</div>
                        </div>
                        <button className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded text-xs font-bold" onClick={copyLink}>
                            🔗 COPIAR LINK
                        </button>
                    </div>

                    <div className="px-4 pt-3 pb-1 flex justify-between items-center">
                        <label className="text-[10px] font-bold text-gray-500">DESTINOS DE AUDIO (RUTEO)</label>
                        <button className={`text-[10px] font-bold px-2 py-1 rounded ${partyline ? 'bg-purple-600 text-white shadow-[0_0_10px_#9333ea]' : 'bg-gray-800 text-gray-400'}`}
                            onClick={() => setPartyline(!partyline)}>
                            {partyline ? '🔥 PARTY MIX ON' : '🎧 PARTY MIX OFF'}
                        </button>
                    </div>
                    <div className="matrix-grid">
                        <button className={`matrix-btn ${targets.includes('TODOS') ? 'all-active' : ''}`} onClick={() => toggleTarget('TODOS')}>
                            📢 TODOS
                        </button>
                        {allMatrixRoles.map(role => (
                            <button key={role} className={`matrix-btn ${targets.includes(role) ? 'active' : ''}`} onClick={() => toggleTarget(role)}>
                                {role}
                            </button>
                        ))}
                    </div>

                    <button className={`mic-btn-huge ${micMuted ? 'off' : 'on'}`} onClick={() => setMicMuted(!micMuted)}>
                        <span>{micMuted ? '🎙️ SILENCIO' : '🔴 HABLANDO'}</span>
                        <span className="text-sm font-normal opacity-70">
                            {micMuted ? 'Toca para hablar al destino' : `Enviando audio a: ${targets.join(', ')}`}
                        </span>
                    </button>

                    <div className="crew-list">
                        <div className="text-[10px] font-bold text-gray-500 mb-2 uppercase flex justify-between">
                            <span>Conectados en sala ({crewList.length})</span>
                            <span className="text-green-400">🎧 Recibiendo retorno del Crew</span>
                        </div>
                        {crewList.length === 0 && <div className="text-sm text-gray-600 italic">Esperando que el equipo se una...</div>}

                        {crewList.map(crew => (
                            <div key={crew.id} className={`crew-item flex-col items-start ${crew.receiving ? 'receiving' : ''}`}>
                                <div className="flex justify-between items-center w-full">
                                    <div className="flex items-center gap-2">
                                        <span>📱 {crew.name}</span>
                                        {crewData[crew.id]?.bat !== undefined && <span className="text-[10px] text-gray-400 font-bold">🔋 {crewData[crew.id].bat}%</span>}
                                        {crewData[crew.id]?.ping !== undefined && <span className="text-[10px] text-blue-400 font-bold">📡 {crewData[crew.id].ping}ms</span>}
                                        {crewData[crew.id]?.qos === 'MALO' && <span className="text-[10px] text-red-500 font-bold animate-pulse">⚠️ RED MALA</span>}
                                        {crewData[crew.id]?.qos === 'OK' && <span className="text-[10px] text-green-500 font-bold">✅ SEÑAL</span>}
                                        {talkingStates[crew.id] && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full animate-pulse">HABLANDO</span>}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button className="bg-red-600 hover:bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded transition-colors"
                                            onClick={() => activePeers.current[crew.id]?.conn.send({ type: 'TALLY' })}>
                                            [ ALERTA ]
                                        </button>
                                        <span className={crew.receiving ? "text-red-400 text-xs animate-pulse" : "text-gray-500 text-xs"}>
                                            {crew.receiving ? 'Director Hablando' : 'En espera'}
                                        </span>
                                    </div>
                                </div>
                                <div className="w-full flex items-center gap-2 mt-2">
                                    <span className="text-[10px] text-gray-400 font-bold">VOL</span>
                                    <input type="range" className="flex-1 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                                        min="0" max="1" step="0.05"
                                        value={volumes[crew.id] !== undefined ? volumes[crew.id] : 1}
                                        onChange={e => setVolumes(prev => ({ ...prev, [crew.id]: parseFloat(e.target.value) }))} />
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE CREW (POCKET MODE EDITION) ---
        const CrewView = ({ roomName, crewName }) => {
            const [joined, setJoined] = useState(false);
            const [status, setStatus] = useState('Configurando...');
            const [receiving, setReceiving] = useState(false);
            const [vuLevel, setVuLevel] = useState(0);
            const [isTalking, setIsTalking] = useState(false);
            const [pocketMode, setPocketMode] = useState(false);
            const [tally, setTally] = useState(false);

            const [audioDevices, setAudioDevices] = useState([]);
            const [selectedAudio, setSelectedAudio] = useState('');

            const peer = useRef(null);
            const localStreamRef = useRef(null);
            const dataConnRef = useRef(null);
            const pingTimerRef = useRef(null);

            const incomingAudioRef = useRef(null);
            const animRef = useRef(null);
            const reconnectTimer = useRef(null);
            const backoffRef = useRef(1000);
            const [networkQoS, setNetworkQoS] = useState('excelente');

            const isDirectorTalking = vuLevel > 10;
            const wasTalking = useRef(false);

            useEffect(() => {
                if (isDirectorTalking && !wasTalking.current) {
                    try { if (navigator.vibrate) navigator.vibrate([150, 100, 150]); } catch (e) { }
                    try {
                        if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                            new Notification("STREAMTALK V9", { body: "Estás recibiendo audio en tu canal." });
                        }
                    } catch (e) { }
                }
                wasTalking.current = isDirectorTalking;
            }, [isDirectorTalking]);

            // --- WAKE LOCK IMPLACABLE (Mantiene la pantalla encendida eternamente) ---
            useEffect(() => {
                if (!joined) return;
                let wakeLock = null;
                const requestWakeLock = async () => {
                    try {
                        if ('wakeLock' in navigator) {
                            wakeLock = await navigator.wakeLock.request('screen');
                            console.log("Pantalla forzada a mantenerse encendida.");
                        }
                    } catch (err) { console.log(err); }
                };

                requestWakeLock();

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') requestWakeLock();
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    if (wakeLock !== null) wakeLock.release().catch(() => { });
                };
            }, [joined]);

            // Obtener dispositivos
            useEffect(() => {
                if (joined) return;
                navigator.mediaDevices.getUserMedia({ audio: true }).then((tempStream) => {
                    tempStream.getTracks().forEach(t => t.stop());
                    navigator.mediaDevices.enumerateDevices().then(devs => {
                        const audios = devs.filter(d => d.kind === 'audioinput');
                        setAudioDevices(audios);
                        if (audios.length > 0) setSelectedAudio(audios[0].deviceId);
                    });
                }).catch(e => setStatus('Permiso de micrófono requerido para hablar.'));
            }, [joined]);

            // Iniciar conexión
            useEffect(() => {
                if (!joined) return;

                const connectToDirector = async () => {
                    setStatus('Iniciando hardware...');

                    try {
                        if (!localStreamRef.current) {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                audio: {
                                    deviceId: selectedAudio ? { exact: selectedAudio } : undefined,
                                    echoCancellation: true,
                                    noiseSuppression: true,
                                    autoGainControl: true,
                                    channelCount: 1,
                                    sampleRate: 48000,
                                    latency: 0
                                }
                            });
                            stream.getAudioTracks().forEach(t => t.enabled = false);
                            localStreamRef.current = stream;
                        }
                    } catch (e) {
                        setStatus('❌ Error de micrófono local.');
                        return;
                    }

                    setStatus('Buscando Director...');
                    if (peer.current) peer.current.destroy();
                    peer.current = new Peer(undefined, PEER_CONFIG);

                    peer.current.on('open', (id) => {
                        const directorId = `st_dir_${roomName.replace(/\s+/g, '').toUpperCase()}`;

                        const conn = peer.current.connect(directorId, { metadata: { role: crewName } });
                        dataConnRef.current = conn;

                        let lastPongTime = Date.now();
                        let lastPingSent = Date.now();

                        conn.on('open', () => {
                            setStatus('Conectado. Esperando ruteo...');
                            if (window.screen && screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('portrait').catch(e => { });
                            }
                            lastPongTime = Date.now();
                            if (pingTimerRef.current) clearInterval(pingTimerRef.current);
                            pingTimerRef.current = setInterval(() => {
                                if (conn && conn.open) {
                                    lastPingSent = Date.now();
                                    if (navigator.getBattery) {
                                        navigator.getBattery().then(b => {
                                            conn.send({ type: 'PING', bat: Math.round(b.level * 100) });
                                        }).catch(() => conn.send({ type: 'PING' }));
                                    } else {
                                        conn.send({ type: 'PING' });
                                    }
                                    if (Date.now() - lastPongTime > 12000) {
                                        if (pingTimerRef.current) clearInterval(pingTimerRef.current);
                                        scheduleReconnect('Heartbeat perdido. Reconectando...');
                                    }
                                }
                            }, 5000);
                        });

                        conn.on('data', (data) => {
                            if (data && data.type === 'PONG') {
                                lastPongTime = Date.now();
                                conn.send({ type: 'STATS', ping: lastPongTime - lastPingSent });
                            }
                            if (data && data.type === 'TALLY') {
                                setTally(true);
                                try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) { }
                                setTimeout(() => setTally(false), 2500);
                            }
                        });

                        conn.on('error', () => scheduleReconnect('Error de datos.'));
                        conn.on('close', () => scheduleReconnect('Director desconectado.'));
                    });

                    peer.current.on('call', (call) => {
                        call.answer(localStreamRef.current);

                        call.on('stream', (remoteStream) => {
                            setStatus('✅ EN LÍNEA');
                            setReceiving(true);

                            if (incomingAudioRef.current) {
                                incomingAudioRef.current.srcObject = remoteStream;
                                incomingAudioRef.current.volume = 1;
                                incomingAudioRef.current.play().catch(e => console.error("Autoplay bloqueado", e));
                            }

                            backoffRef.current = 1000;
                            if (call.peerConnection) {
                                call.qosTimer = setInterval(async () => {
                                    if (!call.peerConnection) return;
                                    try {
                                        const stats = await call.peerConnection.getStats();
                                        stats.forEach(report => {
                                            if (report.type === 'inbound-rtp' && report.kind === 'audio') {
                                                const pl = report.packetsLost || 0;
                                                const j = report.jitter || 0;
                                                const isPoor = j > 0.05 || (pl - (call._lastPl || 0)) > 5;
                                                setNetworkQoS(isPoor ? 'degradada' : 'excelente');
                                                if (dataConnRef.current && dataConnRef.current.open) {
                                                    dataConnRef.current.send({ type: 'STATS', qos: isPoor ? 'MALO' : 'OK' });
                                                }
                                                call._lastPl = pl;
                                            }
                                        });
                                    } catch (e) { }
                                }, 2500);
                            }

                            try {
                                if (animRef.current) cancelAnimationFrame(animRef.current);
                                const audioCtx = window._globalAudioCtx;
                                const analyser = audioCtx.createAnalyser();
                                const source = audioCtx.createMediaStreamSource(remoteStream);
                                source.connect(analyser);
                                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                                const updateLevel = () => {
                                    analyser.getByteFrequencyData(dataArray);
                                    let sum = 0;
                                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                                    setVuLevel(sum / dataArray.length);
                                    animRef.current = requestAnimationFrame(updateLevel);
                                };
                                updateLevel();
                            } catch (e) { }
                        });

                        call.on('close', () => {
                            setReceiving(false);
                            if (animRef.current) cancelAnimationFrame(animRef.current);
                            if (call.qosTimer) clearInterval(call.qosTimer);
                            scheduleReconnect('Llamada finalizada.');
                        });
                    });

                    peer.current.on('error', (err) => { scheduleReconnect('Buscando señal del Director...'); });
                };

                const scheduleReconnect = (msg) => {
                    setStatus(msg); setReceiving(false);
                    if (reconnectTimer.current) clearTimeout(reconnectTimer.current);

                    try {
                        if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
                            new Notification("STREAMTALK V9", { body: "Señal perdida. Reconectando al Director..." });
                        }
                    } catch (e) { }

                    const nextDelay = backoffRef.current + (Math.random() * 500);
                    reconnectTimer.current = setTimeout(connectToDirector, nextDelay);
                    backoffRef.current = Math.min(backoffRef.current * 2, 8000);
                };

                const handleOnline = () => scheduleReconnect('Red detectada. Reconectando...');
                const handleOffline = () => setStatus('⚠ RED DESCONECTADA');
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                connectToDirector();

                return () => {
                    if (peer.current) peer.current.destroy();
                    if (localStreamRef.current) localStreamRef.current.getTracks().forEach(t => t.stop());
                    if (reconnectTimer.current) clearTimeout(reconnectTimer.current);
                    if (animRef.current) cancelAnimationFrame(animRef.current);
                    if (pingTimerRef.current) clearInterval(pingTimerRef.current);
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, [joined, roomName, crewName, selectedAudio]);

            const startTalk = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                setIsTalking(true);
                if (dataConnRef.current && dataConnRef.current.open) {
                    dataConnRef.current.send({ type: 'PTT', state: true });
                }
                if (navigator.vibrate) navigator.vibrate(50);
            };

            const stopTalk = (e) => {
                if (e && e.preventDefault) e.preventDefault();
                setIsTalking(false);
                if (dataConnRef.current && dataConnRef.current.open) {
                    dataConnRef.current.send({ type: 'PTT', state: false });
                }
            };

            useEffect(() => {
                try {
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({ title: 'StreamTalk PTT', artist: 'Crew' });
                        navigator.mediaSession.setActionHandler('play', () => startTalk(null));
                        navigator.mediaSession.setActionHandler('pause', () => stopTalk(null));
                    }
                } catch (e) { }

                return () => {
                    try {
                        if ('mediaSession' in navigator) {
                            navigator.mediaSession.setActionHandler('play', null);
                            navigator.mediaSession.setActionHandler('pause', null);
                        }
                    } catch (e) { }
                }
            }, []);

            useEffect(() => {
                if (incomingAudioRef.current) incomingAudioRef.current.muted = isTalking;
                if (localStreamRef.current) {
                    localStreamRef.current.getAudioTracks().forEach(t => t.enabled = isTalking);
                }
            }, [isTalking]);

            const handleJoin = () => {
                if (!window._globalAudioCtx) {
                    window._globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive', sampleRate: 48000 });
                }
                if (window._globalAudioCtx.state === 'suspended') {
                    window._globalAudioCtx.resume();
                }

                if (incomingAudioRef.current) {
                    incomingAudioRef.current.play().catch(e => { });
                }
                setJoined(true);
            };

            return (
                <div style={{ width: '100%', height: '100%' }}>
                    {tally && <div className="absolute top-0 left-0 w-full h-full bg-red-600 z-[9999] animate-ping opacity-80 pointer-events-none"></div>}
                    <audio ref={incomingAudioRef} autoPlay playsInline style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }}></audio>

                    {/* --- POCKET MODE OVERLAY --- */}
                    {pocketMode && (
                        <div className="pocket-mode-overlay" onDoubleClick={() => setPocketMode(false)}>
                            <div className="pocket-icon">🔒</div>
                            <div className="pocket-text">Modo Bolsillo Activo</div>
                            <div className="text-[10px] text-gray-600 mt-4 uppercase">Doble toque en la pantalla para salir</div>
                        </div>
                    )}

                    {!joined ? (
                        <div className="auth-container">
                            <div className="glass-box animate__animated animate__fadeIn">
                                <h2 className="text-2xl font-black mb-2 text-[#4945A4]">STREAM<span className="text-[#A9B0D8]">TALK</span></h2>
                                <p className="mb-4 text-sm text-[#A9B0D8]">Receptor Pocket Mode V9</p>

                                <div className="bg-[#10111A] border-2 border-[#3E437C] p-4 rounded-lg mb-4 text-left shadow-[0_0_15px_rgba(62,67,124,0.3)]">
                                    <p className="text-xs font-bold text-[#A9B0D8] mb-1">👤 ROL: <span className="text-white">{crewName.toUpperCase()}</span></p>
                                    <p className="text-xs font-bold text-[#A9B0D8]">🏢 SALA: <span className="text-white">{roomName.toUpperCase()}</span></p>
                                </div>

                                <label className="block text-left text-[10px] font-bold text-[#A9B0D8] mb-1">SELECCIONA TU MICRÓFONO</label>
                                <select value={selectedAudio} onChange={(e) => setSelectedAudio(e.target.value)}>
                                    {audioDevices.length === 0 && <option>Revisando hardware...</option>}
                                    {audioDevices.map(d => <option key={d.deviceId} value={d.deviceId}>{d.label || 'Micrófono'}</option>)}
                                </select>

                                <button className="btn btn-green shadow-lg" onClick={handleJoin}>
                                    🎧 CONECTAR Y ESCUCHAR
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className={`crew-layout ${isTalking ? 'speaking' : ''} ${isDirectorTalking && !isTalking ? 'receiving' : ''}`}>
                            <div className="w-full flex justify-between px-4 mb-4">
                                <span className="text-xs font-bold text-[#A9B0D8]">SALA: {roomName}</span>
                                <span className={networkQoS === 'degradada' ? 'text-xs font-bold text-red-500 animate-pulse uppercase' : 'text-xs font-bold text-[#A9B0D8] uppercase'}>{networkQoS === 'degradada' ? '⚠️ RED POBRE' : status}</span>
                            </div>

                            <h2 className="text-3xl font-black text-white mb-6 tracking-widest">{crewName.toUpperCase()}</h2>

                            <div className={`status-ring ${isDirectorTalking ? 'active' : 'idle'}`}>
                                {isDirectorTalking ? '🗣️' : '🎧'}
                                {isDirectorTalking && <div className="vu-ring" style={{ opacity: Math.min(vuLevel / 50, 1), transform: `scale(${1 + (vuLevel / 300)})` }}></div>}
                            </div>

                            <div className="h-6 mb-4">
                                {isDirectorTalking ? (
                                    <p className="text-lg font-bold text-red-400 animate-pulse uppercase">Recibiendo Audio...</p>
                                ) : (
                                    receiving && <p className="text-sm font-bold text-[#4945A4] uppercase">Canal Silenciado</p>
                                )}
                            </div>

                            <div
                                className={`walkie-btn ${isTalking ? 'talking' : ''}`}
                                onMouseDown={startTalk} onMouseUp={stopTalk} onMouseLeave={stopTalk}
                                onTouchStart={startTalk} onTouchEnd={stopTalk}
                            >
                                {isTalking ? '🎙️ ENVIANDO...' : 'PUSH TO TALK'}
                                <span>{isTalking ? 'Suelta para escuchar' : 'Mantén presionado para hablar'}</span>
                            </div>

                            <button className="btn btn-dark mt-4" onClick={() => setPocketMode(true)}>
                                🔒 ACTIVAR MODO BOLSILLO
                            </button>

                            <div className="mt-4 text-[10px] font-bold text-[#4945A4] uppercase px-6">
                                IMPORTANTE: Usa el "Modo Bolsillo" para simular la pantalla apagada en negro y evitar que el teléfono corte el audio y bloquee la app.
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- LOBBY Y ENRUTADOR ---
        const App = () => {
            const [mode, setMode] = useState('lobby');
            const [roomName, setRoomName] = useState('');
            const [tempInput, setTempInput] = useState('');
            const [crewName, setCrewName] = useState('');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const m = params.get('mode');
                const r = params.get('room');

                let savedRoom = '', savedCrew = '';
                try {
                    savedRoom = localStorage.getItem('st_roomName');
                    savedCrew = localStorage.getItem('st_crewName');
                } catch (e) { }

                if (r) setRoomName(r);
                else setRoomName(savedRoom || Math.random().toString(36).substring(2, 6).toUpperCase());

                if (savedCrew) setTempInput(savedCrew);

                if (m === 'director') setMode('director');
                else if (m === 'crew') setMode('crew-setup');

                try {
                    if ('Notification' in window && Notification.permission === 'default') {
                        const p = Notification.requestPermission();
                        if (p && p.catch) p.catch(() => { });
                    }
                } catch (e) { }
            }, []);

            const enterAsDirector = () => {
                if (!roomName.trim()) return alert("Ingresa un nombre de sala");
                const url = new URL(window.location);
                url.searchParams.set('mode', 'director');
                url.searchParams.set('room', roomName);
                window.location.href = url.toString();
            };

            const submitCrewName = (name) => {
                if (!name.trim()) return alert("Debes ingresar un nombre o rol.");
                const upperName = name.trim().toUpperCase();

                try {
                    localStorage.setItem('st_crewName', upperName);
                    localStorage.setItem('st_roomName', roomName);
                } catch (e) { }

                setCrewName(upperName);
                setMode('crew-active');
            };

            if (mode === 'director') return <DirectorView roomName={roomName} />;
            if (mode === 'crew-active') return <CrewView roomName={roomName} crewName={crewName} />;

            if (mode === 'crew-setup') {
                return (
                    <div className="auth-container">
                        <div className="glass-box animate__animated animate__zoomIn">
                            <h1 className="text-2xl font-black mb-1 text-white">IDENTIFICACIÓN</h1>
                            <p className="text-xs text-[#A9B0D8] mb-6">Sala: {roomName}</p>

                            <label className="block text-left text-xs font-bold text-[#A9B0D8] mb-2">ELIGE TU PUESTO O ESCRIBE TU NOMBRE</label>
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                {['CAM 1', 'CAM 2', 'CAM 3', 'SONIDO', 'PISO', 'PROD'].map(preset => (
                                    <button key={preset} className="bg-[#12131C] border-2 border-[#3E437C] text-[#A9B0D8] text-xs font-bold py-3 rounded hover:bg-[#4945A4] hover:text-white transition-all shadow-[0_0_10px_rgba(62,67,124,0.2)]" onClick={() => submitCrewName(preset)}>{preset}</button>
                                ))}
                            </div>
                            <div className="w-full border-t-2 border-[#3E437C] my-4"></div>
                            <input value={tempInput} onChange={(e) => setTempInput(e.target.value.toUpperCase())} placeholder="OTRO NOMBRE..." onKeyPress={(e) => e.key === 'Enter' && submitCrewName(tempInput)} />
                            <button className="btn btn-blue" onClick={() => submitCrewName(tempInput)}>CONTINUAR</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="auth-container">
                    <div className="glass-box animate__animated animate__zoomIn">
                        <h1 className="text-3xl font-black mb-2 text-[#A9B0D8]">STREAM<span className="text-[#4945A4]">TALK</span> V9</h1>
                        <p className="text-[#A9B0D8] text-sm mb-8 font-bold">POCKET MODE EDITION</p>

                        <label className="block text-left text-xs font-bold text-[#A9B0D8] mb-2">CÓDIGO DE PRODUCCIÓN</label>
                        <input value={roomName} onChange={(e) => setRoomName(e.target.value.toUpperCase())} placeholder="EJ: SHOW-1" />

                        <button className="btn btn-blue" onClick={enterAsDirector}>ENTRAR COMO DIRECTOR</button>
                        <button className="btn btn-gray" onClick={() => setMode('crew-setup')}>ENTRAR COMO EQUIPO</button>

                        <p className="text-[10px] text-[#A9B0D8] mt-6 text-left leading-tight">
                            * Novedad V9.0: "Modo Bolsillo". Soluciona el corte de audio simulando una pantalla en negro sin toques, forzando al navegador a permanecer 100% encendido.
                        </p>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
