<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream P2P v2</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --c-bg: #070b14;
            --c-surface: #0f172a;
            --c-card: #1a2337;
            --c-border: #263352;
            --c-accent: #3b82f6;
            --c-green: #10b981;
            --c-red: #ef4444;
            --c-yellow: #f59e0b;
            --c-muted: #64748b;
            --c-text: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--c-bg); color: var(--c-text); font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; height: 100vh; }

        /* ── Spinner ── */
        .spinner {
            width: 36px; height: 36px; border: 3px solid var(--c-border);
            border-top-color: var(--c-accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner.sm { width: 14px; height: 14px; border-width: 2px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ════════════════ VIEWER ════════════════ */
        .viewer-wrap { width: 100vw; height: 100vh; position: relative; background: #000; }
        .video-el    { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

        /* Loading */
        .v-loading {
            position: absolute; inset: 0; background: var(--c-surface);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; z-index: 50;
        }
        .v-loading-text { font-size: 13px; color: var(--c-muted); letter-spacing: 1.5px; text-transform: uppercase; }

        /* Reconnecting banner */
        .v-reconnect-banner {
            position: absolute; top: 0; left: 0; right: 0;
            background: rgba(245,158,11,0.92); color: #000;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 8px 16px; font-size: 12px; font-weight: 700;
            letter-spacing: 1px; z-index: 80;
        }

        /* Live badge */
        .v-live-badge {
            position: absolute; top: 16px; right: 16px;
            background: rgba(239,68,68,0.9); color: #fff;
            padding: 5px 11px; border-radius: 20px;
            font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
            z-index: 40; display: flex; align-items: center; gap: 5px;
            animation: livePulse 2s infinite;
        }
        .live-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; flex-shrink: 0; }
        @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:.65} }

        /* Room info + latency */
        .v-room-info {
            position: absolute; top: 16px; left: 16px;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
            padding: 6px 11px; border-radius: 8px;
            font-size: 11px; color: var(--c-muted); z-index: 40;
            display: flex; align-items: center; gap: 8px;
        }
        .v-latency {
            font-size: 11px; font-weight: 600;
            padding: 2px 7px; border-radius: 10px;
        }
        .v-latency.good  { color: #4ade80; background: rgba(74,222,128,.15); }
        .v-latency.ok    { color: #fbbf24; background: rgba(251,191,36,.15); }
        .v-latency.bad   { color: #f87171; background: rgba(248,113,113,.15); }

        /* Audio overlay */
        .v-audio-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.65);
            display: flex; align-items: center; justify-content: center;
            z-index: 70; backdrop-filter: blur(4px);
        }
        .v-audio-btn {
            background: var(--c-accent); color: #fff; border: none;
            padding: 15px 30px; border-radius: 50px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 24px rgba(59,130,246,.45);
        }

        /* Controls */
        .v-controls {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 60;
            opacity: 0; transition: opacity 0.25s; pointer-events: none;
        }
        .viewer-wrap:hover .v-controls,
        .viewer-wrap:focus-within .v-controls { opacity: 1; pointer-events: auto; }

        .v-btn {
            background: rgba(0,0,0,0.82); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.18); color: #fff;
            padding: 10px 18px; border-radius: 28px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 7px;
            transition: background 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .v-btn:active { transform: scale(0.94); }
        .v-btn.on { background: rgba(16,185,129,.88); border-color: var(--c-green); color: #000; }

        /* ── CHAT VIEWER ── */
        .v-chat-feed {
            position: absolute; bottom: 90px; left: 16px;
            width: 280px; max-height: 200px; overflow: hidden;
            display: flex; flex-direction: column-reverse; gap: 6px;
            z-index: 55; pointer-events: none;
        }
        .v-chat-msg {
            background: rgba(0,0,0,0.72); backdrop-filter: blur(8px);
            border-left: 3px solid var(--c-accent);
            padding: 7px 11px; border-radius: 0 8px 8px 0;
            font-size: 13px; color: #fff; line-height: 1.4;
            animation: chatIn 0.25s ease; max-width: 100%;
            word-break: break-word;
        }
        @keyframes chatIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        /* Fullscreen clean — sólo decorativos, audio overlay y chat quedan visibles */
        .viewer-wrap.fs-clean .v-live-badge,
        .viewer-wrap.fs-clean .v-room-info,
        .viewer-wrap.fs-clean .v-controls { display: none !important; }

        /* Error */
        .v-error {
            position: absolute; inset: 0; background: var(--c-surface);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; z-index: 100;
        }
        .v-error-btn {
            background: var(--c-accent); color: #fff; border: none;
            padding: 11px 28px; border-radius: 24px;
            font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
        }

        /* ════════════════ DIRECTOR ════════════════ */
        .d-layout { display: flex; flex-direction: column; height: 100vh; background: var(--c-bg); }

        .d-header {
            background: var(--c-surface); border-bottom: 1px solid var(--c-border);
            padding: 12px 18px; display: flex; align-items: center;
            justify-content: space-between; gap: 12px; flex-wrap: wrap;
        }
        .d-title { font-size: 15px; font-weight: 700; color: var(--c-accent); letter-spacing: .5px; }
        .d-stats  { font-size: 11px; color: var(--c-muted); display: flex; gap: 14px; }
        .d-stat   { display: flex; align-items: center; gap: 4px; }
        .d-stat-val { font-weight: 700; color: var(--c-text); }

        .d-body {
            flex: 1; display: grid; grid-template-columns: 1fr 290px;
            gap: 16px; padding: 16px; overflow: hidden; min-height: 0;
        }
        @media (max-width: 860px) { .d-body { grid-template-columns: 1fr; } }

        /* Left column */
        .d-left { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }

        /* Preview */
        .d-preview {
            background: #000; border: 2px solid var(--c-border);
            border-radius: 10px; overflow: hidden; aspect-ratio: 16/9;
            position: relative; flex-shrink: 0;
        }
        .d-preview video { width: 100%; height: 100%; object-fit: contain; display: block; }
        .d-preview-empty {
            display: flex; align-items: center; justify-content: center;
            height: 100%; color: var(--c-muted); font-size: 13px;
        }
        .d-live-tag {
            position: absolute; top: 10px; left: 10px;
            background: var(--c-red); padding: 3px 10px; border-radius: 4px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            animation: livePulse 2s infinite;
        }

        /* Quality indicator in preview */
        .d-quality-tag {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.65); padding: 3px 10px; border-radius: 4px;
            font-size: 10px; font-weight: 600; color: var(--c-muted);
        }

        /* Controls bar */
        .d-ctrls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .d-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 14px; border: none; border-radius: 6px;
            font-size: 12px; font-weight: 700; cursor: pointer;
            transition: opacity 0.15s;
        }
        .d-btn:disabled { opacity: .4; cursor: not-allowed; }
        .d-btn.red   { background: var(--c-red); color: #fff; }
        .d-btn.green { background: var(--c-green); color: #000; }
        .d-btn.blue  { background: var(--c-accent); color: #fff; }
        .d-btn.ghost { background: var(--c-card); border: 1px solid var(--c-border); color: var(--c-text); }

        select.d-select {
            background: var(--c-card); border: 1px solid var(--c-border);
            color: var(--c-text); padding: 7px 10px; border-radius: 6px;
            font-size: 12px; cursor: pointer;
        }
        select.d-select:disabled { opacity: .4; }

        /* Bitrate slider */
        .d-bitrate-wrap {
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; color: var(--c-muted);
        }
        input[type=range].d-slider {
            -webkit-appearance: none; width: 90px; height: 4px;
            background: var(--c-border); border-radius: 2px; outline: none;
        }
        input[type=range].d-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: var(--c-accent); cursor: pointer;
        }

        /* Log */
        .d-log {
            background: #000; border: 1px solid var(--c-border); border-radius: 6px;
            padding: 8px 10px; font-family: monospace; font-size: 10.5px;
            color: var(--c-muted); height: 80px; overflow-y: auto; flex-shrink: 0;
        }

        /* ── CHAT DIRECTOR ── */
        .d-chat-wrap {
            background: var(--c-card); border: 1px solid var(--c-border);
            border-radius: 8px; display: flex; flex-direction: column;
            flex: 1; min-height: 0; overflow: hidden;
        }
        .d-chat-header {
            padding: 8px 12px; font-size: 11px; font-weight: 700;
            color: var(--c-muted); border-bottom: 1px solid var(--c-border);
            letter-spacing: .8px; flex-shrink: 0;
        }
        .d-chat-feed {
            flex: 1; overflow-y: auto; padding: 8px 10px;
            display: flex; flex-direction: column; gap: 5px; min-height: 0;
        }
        .d-chat-entry {
            font-size: 12px; color: var(--c-text); line-height: 1.4;
            border-left: 2px solid var(--c-accent); padding-left: 8px;
        }
        .d-chat-entry .ts { color: var(--c-muted); font-size: 10px; margin-right: 5px; }
        .d-chat-input-wrap {
            display: flex; gap: 6px; padding: 8px;
            border-top: 1px solid var(--c-border); flex-shrink: 0;
        }
        .d-chat-input {
            flex: 1; background: var(--c-surface); border: 1px solid var(--c-border);
            color: var(--c-text); padding: 6px 10px; border-radius: 6px;
            font-size: 12px; outline: none;
        }
        .d-chat-input:focus { border-color: var(--c-accent); }

        /* Right column — slots */
        .d-right { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

        .d-slots-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .d-slots-title { font-size: 11px; font-weight: 700; color: var(--c-muted); letter-spacing: .8px; }
        .d-slots-count-wrap { display: flex; align-items: center; gap: 4px; }
        .d-slots-count-btn {
            width: 22px; height: 22px; border: 1px solid var(--c-border);
            background: var(--c-card); color: var(--c-text); border-radius: 4px;
            font-size: 14px; line-height: 1; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-weight: 700;
        }
        .d-slots-count-val { font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; }

        .d-slots-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }

        .d-slot-card {
            background: var(--c-card); border: 1px solid var(--c-border);
            border-radius: 8px; padding: 9px 11px;
            display: flex; align-items: center; gap: 8px;
            transition: border-color 0.2s;
        }
        .d-slot-card.live { border-color: var(--c-green); background: rgba(16,185,129,.07); }
        .d-slot-card.connected { border-color: rgba(59,130,246,.4); }

        .d-slot-num { font-size: 12px; font-weight: 700; color: var(--c-muted); min-width: 20px; }
        .d-slot-status {
            flex: 1; font-size: 10px; font-weight: 600; letter-spacing: .5px;
        }
        .d-slot-latency { font-size: 10px; font-weight: 700; min-width: 36px; text-align: right; }

        .d-link-btn {
            background: var(--c-accent); color: #fff; border: none;
            padding: 4px 9px; border-radius: 5px;
            font-size: 10px; font-weight: 700; cursor: pointer; flex-shrink: 0;
        }
        .d-link-btn:active { opacity: .75; }

        /* ════════ LOBBY ════════ */
        .lobby {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; background: var(--c-bg);
        }
        .lobby-card {
            background: var(--c-surface); padding: 36px 32px;
            border-radius: 16px; border: 1px solid var(--c-border);
            max-width: 400px; width: 90%; text-align: center;
        }
        .lobby-title { font-size: 26px; font-weight: 800; color: var(--c-accent); margin-bottom: 6px; }
        .lobby-sub   { font-size: 13px; color: var(--c-muted); margin-bottom: 24px; }
        .lobby-input {
            width: 100%; background: var(--c-card);
            border: 2px solid var(--c-border); border-radius: 8px;
            padding: 14px; text-align: center; font-size: 20px;
            font-weight: 700; color: var(--c-text); text-transform: uppercase;
            outline: none; letter-spacing: 3px; margin-bottom: 14px;
        }
        .lobby-input:focus { border-color: var(--c-accent); }
        .lobby-go {
            width: 100%; background: var(--c-red); color: #fff;
            border: none; padding: 14px; border-radius: 8px;
            font-size: 16px; font-weight: 800; cursor: pointer;
            transition: opacity 0.15s;
        }
        .lobby-go:disabled { opacity: .4; cursor: not-allowed; }
        .lobby-note { margin-top: 18px; font-size: 11px; color: var(--c-muted); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    /* ─── PeerJS config con STUN + TURN ─── */
    const PEER_CONFIG = {
        host: '0.peerjs.com', port: 443, secure: true,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
        }
    };

    /* ─── Helpers ─── */
    const ts = () => new Date().toLocaleTimeString('en-GB');

    /* ─── Bitrate presets (kbps) ─── */
    const BITRATE_PRESETS = [
        { label: 'Auto',  kbps: 0    },
        { label: '4K',    kbps: 8000 },
        { label: '1080p', kbps: 4000 },
        { label: '720p',  kbps: 2000 },
        { label: '480p',  kbps: 800  },
        { label: '360p',  kbps: 400  },
    ];

    /* Apply bitrate to an RTCPeerConnection */
    async function applyBitrate(pc, kbps) {
        if (!pc || kbps === 0) return;
        const senders = pc.getSenders().filter(s => s.track?.kind === 'video');
        for (const sender of senders) {
            const params = sender.getParameters();
            if (!params.encodings || params.encodings.length === 0) {
                params.encodings = [{}];
            }
            params.encodings[0].maxBitrate = kbps * 1000;
            try { await sender.setParameters(params); } catch (e) { console.warn('setParameters:', e); }
        }
    }

    /* ══════════════════════════════════════
       DIRECTOR
    ══════════════════════════════════════ */
    const Director = ({ room }) => {
        const [stream, setStream]             = useState(null);
        const [isBroadcasting, setIsBroad]    = useState(false);
        const [source, setSource]             = useState('camera');
        const [slotCount, setSlotCount]       = useState(3);       // ◀ FEATURE: slots dinámicos
        const [receivers, setReceivers]       = useState({});
        const [logs, setLogs]                 = useState([]);
        const [bitrateIdx, setBitrateIdx]     = useState(0);        // ◀ FEATURE: calidad adaptativa
        const [chatMsg, setChatMsg]           = useState('');       // ◀ FEATURE: chat
        const [chatHistory, setChatHistory]   = useState([]);

        const peerRef        = useRef(null);
        const streamRef      = useRef(null);
        const videoRef       = useRef(null);
        const broadRef       = useRef(false);
        const receiversRef   = useRef({});
        const heartbeatTimer = useRef(null);                         // ◀ FEATURE: heartbeat
        const bitrateIdxRef  = useRef(0);
        const chatFeedRef    = useRef(null);

        /* Sync bitrateIdx → ref for use inside async callbacks */
        useEffect(() => { bitrateIdxRef.current = bitrateIdx; }, [bitrateIdx]);

        const addLog = useCallback((msg) => {
            setLogs(p => [...p.slice(-30), `[${ts()}] ${msg}`]);
        }, []);

        const updateReceivers = useCallback((fn) => {
            setReceivers(p => { const n = fn(p); receiversRef.current = n; return n; });
        }, []);

        /* ─── Send stream to one viewer ─── */
        const sendToViewer = useCallback((slot) => {
            if (!peerRef.current || !streamRef.current) return;
            const vid = `view-${room}-${slot}`;

            const existing = receiversRef.current[slot];
            if (existing?.call) { try { existing.call.close(); } catch (_) {} }

            const call = peerRef.current.call(vid, streamRef.current);
            if (!call) { addLog(`Error al llamar #${slot}`); return; }

            updateReceivers(p => ({ ...p, [slot]: { ...p[slot], status: 'streaming', call } }));
            addLog(`Stream → #${slot}`);

            /* ─── FEATURE: calidad adaptativa ─── */
            call.on('stream', () => {}); // needs to be answered first
            call.peerConnection?.addEventListener('signalingstatechange', async () => {
                if (call.peerConnection?.signalingState === 'stable') {
                    const preset = BITRATE_PRESETS[bitrateIdxRef.current];
                    if (preset.kbps > 0) await applyBitrate(call.peerConnection, preset.kbps);
                }
            });

            call.on('close', () => {
                updateReceivers(p => ({ ...p, [slot]: { ...p[slot], status: 'connected', call: null } }));
            });
            call.on('error', () => {
                updateReceivers(p => ({ ...p, [slot]: { ...p[slot], status: 'error', call: null } }));
            });
        }, [room, addLog, updateReceivers]);

        /* ─── Apply bitrate change to all active calls ─── */
        const applyBitrateAll = useCallback(async (idx) => {
            const preset = BITRATE_PRESETS[idx];
            addLog(`Calidad → ${preset.label}${preset.kbps ? ' ('+preset.kbps+'kbps)' : ' (auto)'}`);
            const active = Object.values(receiversRef.current).filter(r => r.call?.peerConnection);
            for (const rec of active) {
                await applyBitrate(rec.call.peerConnection, preset.kbps);
            }
        }, [addLog]);

        /* ─── FEATURE: Heartbeat → enviar ping a todos los viewers cada 5s ─── */
        const startHeartbeat = useCallback(() => {
            if (heartbeatTimer.current) clearInterval(heartbeatTimer.current);
            heartbeatTimer.current = setInterval(() => {
                Object.values(receiversRef.current).forEach(rec => {
                    if (rec.conn?.open) {
                        rec.conn.send({ type: 'ping', ts: Date.now() });
                    }
                });
            }, 5000);
        }, []);

        const stopHeartbeat = useCallback(() => {
            if (heartbeatTimer.current) { clearInterval(heartbeatTimer.current); heartbeatTimer.current = null; }
        }, []);

        /* ─── FEATURE: Enviar chat a todos ─── */
        const sendChat = useCallback(() => {
            const msg = chatMsg.trim();
            if (!msg) return;
            const entry = { msg, time: ts() };
            setChatHistory(p => [...p.slice(-50), entry]);
            Object.values(receiversRef.current).forEach(rec => {
                if (rec.conn?.open) rec.conn.send({ type: 'chat', msg, time: entry.time });
            });
            setChatMsg('');
            setTimeout(() => { if (chatFeedRef.current) chatFeedRef.current.scrollTop = chatFeedRef.current.scrollHeight; }, 50);
        }, [chatMsg]);

        /* ─── PeerJS setup ─── */
        useEffect(() => {
            const id = `dir-${room}`;
            addLog(`Director ID: ${id}`);
            peerRef.current = new Peer(id, PEER_CONFIG);

            peerRef.current.on('open', () => addLog('Conectado al servidor'));

            peerRef.current.on('connection', conn => {
                const slot = conn.peer.replace(`view-${room}-`, '');
                addLog(`Viewer #${slot} conectado`);
                updateReceivers(p => ({ ...p, [slot]: { slot, conn, status: 'connected', call: null } }));

                conn.on('data', data => {
                    if (data === 'READY_FOR_STREAM') {
                        addLog(`#${slot} pide stream`);
                        if (streamRef.current && broadRef.current) sendToViewer(slot);
                        else conn.send({ type: 'waiting' });
                    }
                });

                conn.on('close', () => {
                    addLog(`Viewer #${slot} desconectado`);
                    updateReceivers(p => ({ ...p, [slot]: { ...p[slot], status: 'offline', call: null } }));
                });
            });

            peerRef.current.on('error', e => addLog(`PeerJS: ${e.type}`));

            return () => { stopHeartbeat(); peerRef.current?.destroy(); };
        }, [room, addLog, sendToViewer, updateReceivers, stopHeartbeat]);

        useEffect(() => {
            if (videoRef.current && stream) videoRef.current.srcObject = stream;
        }, [stream]);

        /* ─── Start / Stop broadcast ─── */
        const startBroadcast = async () => {
            try {
                let s;
                if (source === 'screen') {
                    s = await navigator.mediaDevices.getDisplayMedia({ video: { width: 1280, height: 720 }, audio: true });
                    s.getVideoTracks()[0].onended = stopBroadcast;
                } else {
                    s = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true });
                }
                streamRef.current = s;
                setStream(s);
                setIsBroad(true);
                broadRef.current = true;
                addLog('Broadcast iniciado');
                startHeartbeat();

                Object.entries(receiversRef.current).forEach(([slot, rec]) => {
                    if (rec.conn?.open) sendToViewer(slot);
                });
            } catch (e) {
                addLog(`Error: ${e.message}`);
                alert('Error al acceder al media: ' + e.message);
            }
        };

        const stopBroadcast = useCallback(() => {
            streamRef.current?.getTracks().forEach(t => t.stop());
            streamRef.current = null;
            setStream(null);
            setIsBroad(false);
            broadRef.current = false;
            stopHeartbeat();
            addLog('Broadcast detenido');
        }, [addLog, stopHeartbeat]);

        const copyLink = useCallback((slot) => {
            const url = `${location.origin}${location.pathname}?mode=view&room=${room}&slot=${slot}`;
            navigator.clipboard.writeText(url).then(() => addLog(`Link #${slot} copiado`));
        }, [room, addLog]);

        /* ─── Stats ─── */
        const liveCount = Object.values(receivers).filter(r => r.status === 'streaming').length;
        const connCount = Object.values(receivers).filter(r => r.status === 'connected').length;
        const curPreset = BITRATE_PRESETS[bitrateIdx];

        return (
            <div className="d-layout">
                {/* ── Header ── */}
                <div className="d-header">
                    <div>
                        <div className="d-title">🎬 DIRECTOR · {room}</div>
                    </div>
                    <div className="d-stats">
                        <span className="d-stat">📡 <span className="d-stat-val" style={{color:'#4ade80'}}>{liveCount}</span> live</span>
                        <span className="d-stat">🔗 <span className="d-stat-val">{connCount}</span> conectados</span>
                        <span className="d-stat">📶 <span className="d-stat-val">{curPreset.label}</span></span>
                    </div>
                    <div style={{display:'flex', gap:8, flexWrap:'wrap', alignItems:'center'}}>
                        {/* Source select */}
                        <select className="d-select" value={source} onChange={e => setSource(e.target.value)} disabled={isBroadcasting}>
                            <option value="camera">📷 Cámara</option>
                            <option value="screen">🖥️ Pantalla</option>
                        </select>

                        {/* ── FEATURE: Calidad adaptativa ── */}
                        <select
                            className="d-select"
                            value={bitrateIdx}
                            onChange={e => {
                                const idx = Number(e.target.value);
                                setBitrateIdx(idx);
                                bitrateIdxRef.current = idx;
                                applyBitrateAll(idx);
                            }}
                        >
                            {BITRATE_PRESETS.map((p, i) => (
                                <option key={i} value={i}>{p.label}{p.kbps ? ` · ${p.kbps}k` : ''}</option>
                            ))}
                        </select>

                        {/* Start / Stop */}
                        {!isBroadcasting
                            ? <button className="d-btn red" onClick={startBroadcast}>🔴 INICIAR</button>
                            : <button className="d-btn green" onClick={stopBroadcast}>⏹ DETENER</button>
                        }
                    </div>
                </div>

                {/* ── Body ── */}
                <div className="d-body">
                    {/* Left */}
                    <div className="d-left">
                        {/* Preview */}
                        <div className="d-preview">
                            {stream
                                ? <video ref={videoRef} autoPlay muted playsInline />
                                : <div className="d-preview-empty">Sin señal de video</div>
                            }
                            {isBroadcasting && <span className="d-live-tag">EN VIVO</span>}
                            {isBroadcasting && <span className="d-quality-tag">{curPreset.label}</span>}
                        </div>

                        {/* ── FEATURE: Chat director ── */}
                        <div className="d-chat-wrap">
                            <div className="d-chat-header">💬 MENSAJES A VIEWERS</div>
                            <div className="d-chat-feed" ref={chatFeedRef}>
                                {chatHistory.length === 0 && (
                                    <div style={{fontSize:11,color:'var(--c-muted)',padding:'4px 0'}}>
                                        Los mensajes aparecen en la pantalla de todos los viewers
                                    </div>
                                )}
                                {chatHistory.map((e, i) => (
                                    <div key={i} className="d-chat-entry">
                                        <span className="ts">{e.time}</span>{e.msg}
                                    </div>
                                ))}
                            </div>
                            <div className="d-chat-input-wrap">
                                <input
                                    className="d-chat-input"
                                    placeholder="Escribe un mensaje..."
                                    value={chatMsg}
                                    onChange={e => setChatMsg(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && sendChat()}
                                    maxLength={200}
                                />
                                <button className="d-btn blue" onClick={sendChat} style={{padding:'6px 12px'}}>
                                    ↵
                                </button>
                            </div>
                        </div>

                        {/* Log */}
                        <div className="d-log">
                            {logs.map((l, i) => <div key={i}>{l}</div>)}
                        </div>
                    </div>

                    {/* Right — slots */}
                    <div className="d-right">
                        {/* ── FEATURE: Slots dinámicos ── */}
                        <div className="d-slots-header">
                            <span className="d-slots-title">RECEPTORES</span>
                            <div className="d-slots-count-wrap">
                                <button className="d-slots-count-btn"
                                    onClick={() => setSlotCount(c => Math.max(1, c - 1))}>−</button>
                                <span className="d-slots-count-val">{slotCount}</span>
                                <button className="d-slots-count-btn"
                                    onClick={() => setSlotCount(c => Math.min(10, c + 1))}>+</button>
                            </div>
                        </div>

                        <div className="d-slots-list">
                            {Array.from({ length: slotCount }, (_, i) => i + 1).map(n => {
                                const rec = receivers[n];
                                const isLive = rec?.status === 'streaming';
                                const isConn = rec?.status === 'connected';
                                const statusLabel = isLive ? '● EN VIVO'
                                    : isConn ? '● CONECTADO'
                                    : rec?.status === 'offline' ? 'offline'
                                    : rec?.status === 'error' ? '✕ error'
                                    : '—';
                                const statusColor = isLive ? '#4ade80'
                                    : isConn ? '#60a5fa'
                                    : 'var(--c-muted)';

                                return (
                                    <div key={n} className={`d-slot-card ${isLive ? 'live' : isConn ? 'connected' : ''}`}>
                                        <span className="d-slot-num">#{n}</span>
                                        <span className="d-slot-status" style={{ color: statusColor }}>
                                            {statusLabel}
                                        </span>
                                        {isLive && rec?.latency !== undefined && (
                                            <span className="d-slot-latency" style={{
                                                color: rec.latency < 100 ? '#4ade80' : rec.latency < 300 ? '#fbbf24' : '#f87171'
                                            }}>{rec.latency}ms</span>
                                        )}
                                        <button className="d-link-btn" onClick={() => copyLink(n)}>LINK</button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    /* ══════════════════════════════════════
       VIEWER
    ══════════════════════════════════════ */
    const Viewer = ({ room, slot }) => {
        const [isReceiving, setIsReceiving]     = useState(false);
        const [isMuted, setIsMuted]             = useState(true);
        const [showAudioOverlay, setShowAudio]  = useState(false);
        const [hasError, setHasError]           = useState(false);
        const [isReconnecting, setIsReconn]     = useState(false);
        const [isFullscreen, setIsFullscreen]   = useState(false);
        const [latency, setLatency]             = useState(null);   // ◀ FEATURE: latencia
        const [chatMsgs, setChatMsgs]           = useState([]);     // ◀ FEATURE: chat
        const [isPiP, setIsPiP]                 = useState(false);  // ◀ FEATURE: PiP

        const peerRef           = useRef(null);
        const videoRef          = useRef(null);
        const connRef           = useRef(null);
        const currentCallRef    = useRef(null);
        const hasStreamRef      = useRef(false);
        const retryCountRef     = useRef(0);
        const retryTimerRef     = useRef(null);
        const lastPingRef       = useRef(Date.now());  // ◀ heartbeat
        const heartbeatWatcher  = useRef(null);        // ◀ heartbeat
        const latencyTimer      = useRef(null);        // ◀ latencia
        const MAX_RETRIES       = 10;

        /* ─── Fullscreen detection ─── */
        useEffect(() => {
            const onChange = () => {
                const el = document.fullscreenElement || document.webkitFullscreenElement;
                setIsFullscreen(!!el);
            };
            document.addEventListener('fullscreenchange', onChange);
            document.addEventListener('webkitfullscreenchange', onChange);
            return () => {
                document.removeEventListener('fullscreenchange', onChange);
                document.removeEventListener('webkitfullscreenchange', onChange);
            };
        }, []);

        /* ─── FEATURE: PiP events ─── */
        useEffect(() => {
            const vid = videoRef.current;
            if (!vid) return;
            const onEnter = () => setIsPiP(true);
            const onLeave = () => setIsPiP(false);
            vid.addEventListener('enterpictureinpicture', onEnter);
            vid.addEventListener('leavepictureinpicture', onLeave);
            return () => {
                vid.removeEventListener('enterpictureinpicture', onEnter);
                vid.removeEventListener('leavepictureinpicture', onLeave);
            };
        }, []);

        /* ─── FEATURE: Latencia via getStats ─── */
        const startLatencyMonitor = useCallback((pc) => {
            if (latencyTimer.current) clearInterval(latencyTimer.current);
            latencyTimer.current = setInterval(async () => {
                if (!pc || pc.connectionState === 'closed') return;
                try {
                    const stats = await pc.getStats();
                    stats.forEach(report => {
                        if (report.type === 'candidate-pair' && report.state === 'succeeded' && report.currentRoundTripTime != null) {
                            setLatency(Math.round(report.currentRoundTripTime * 1000));
                        }
                    });
                } catch (_) {}
            }, 2000);
        }, []);

        const stopLatencyMonitor = useCallback(() => {
            if (latencyTimer.current) { clearInterval(latencyTimer.current); latencyTimer.current = null; }
            setLatency(null);
        }, []);

        /* ─── FEATURE: Heartbeat watcher — detecta caída del Director ─── */
        const startHeartbeatWatcher = useCallback(() => {
            lastPingRef.current = Date.now();
            if (heartbeatWatcher.current) clearInterval(heartbeatWatcher.current);
            heartbeatWatcher.current = setInterval(() => {
                const elapsed = Date.now() - lastPingRef.current;
                if (elapsed > 15000 && hasStreamRef.current) {
                    console.log('Heartbeat perdido — Director posiblemente caído');
                    setIsReconn(true);
                }
            }, 5000);
        }, []);

        const stopHeartbeatWatcher = useCallback(() => {
            if (heartbeatWatcher.current) { clearInterval(heartbeatWatcher.current); heartbeatWatcher.current = null; }
        }, []);

        /* ─── Retry con backoff exponencial ─── */
        const scheduleRetry = useCallback(() => {
            if (retryTimerRef.current) clearTimeout(retryTimerRef.current);
            if (retryCountRef.current >= MAX_RETRIES) { setHasError(true); return; }
            const delay = Math.min(5000 * Math.pow(1.5, retryCountRef.current), 60000);
            retryCountRef.current += 1;
            console.log(`Reintento #${retryCountRef.current} en ${Math.round(delay/1000)}s`);
            retryTimerRef.current = setTimeout(() => {
                if (!hasStreamRef.current && connRef.current?.open) {
                    setIsReconn(true);
                    connRef.current.send('READY_FOR_STREAM');
                }
            }, delay);
        }, []);

        /* ─── FEATURE: Reconexión automática periódica si no hay stream ─── */
        useEffect(() => {
            const autoRetry = setInterval(() => {
                if (!hasStreamRef.current && connRef.current?.open) {
                    console.log('Auto-retry: solicitando stream al Director...');
                    connRef.current.send('READY_FOR_STREAM');
                }
            }, 30000);
            return () => clearInterval(autoRetry);
        }, []);

        /* ─── Chat: auto-dismiss msgs after 8s ─── */
        const addChatMsg = useCallback((msg) => {
            const id = Date.now();
            setChatMsgs(p => [...p.slice(-4), { id, msg }]);
            setTimeout(() => setChatMsgs(p => p.filter(m => m.id !== id)), 8000);
        }, []);

        /* ─── PeerJS setup ─── */
        useEffect(() => {
            const myId = `view-${room}-${slot}`;
            const dirId = `dir-${room}`;
            let idSuffix = '';

            const createPeer = (id) => {
                const peer = new Peer(id, PEER_CONFIG);

                peer.on('open', () => {
                    setIsReconn(false);
                    const conn = peer.connect(dirId, { reliable: true });
                    connRef.current = conn;

                    conn.on('open', () => {
                        console.log('Conectado al Director');
                        retryCountRef.current = 0;
                        if (!hasStreamRef.current) conn.send('READY_FOR_STREAM');
                    });

                    conn.on('data', data => {
                        /* ─── FEATURE: Heartbeat ─── */
                        if (data?.type === 'ping') {
                            lastPingRef.current = Date.now();
                            setIsReconn(false);
                            return;
                        }
                        /* ─── FEATURE: Chat ─── */
                        if (data?.type === 'chat') {
                            addChatMsg(data.msg);
                            return;
                        }
                        if (data === 'READY_FOR_STREAM' || data?.type === 'waiting') scheduleRetry();
                    });

                    conn.on('close', () => {
                        if (hasStreamRef.current) setIsReconn(true);
                        else scheduleRetry();
                    });
                    conn.on('error', () => scheduleRetry());
                });

                /* ─── FEATURE: Reconexión legítima del Director (no bloquear) ─── */
                peer.on('call', call => {
                    if (currentCallRef.current) {
                        try { currentCallRef.current.close(); } catch (_) {}
                    }
                    currentCallRef.current = call;
                    call.answer(null);

                    call.on('stream', remoteStream => {
                        hasStreamRef.current = true;
                        setIsReconn(false);
                        retryCountRef.current = 0;

                        if (videoRef.current) {
                            videoRef.current.srcObject = remoteStream;
                            videoRef.current.muted = true;
                            videoRef.current.play()
                                .then(() => { setIsReceiving(true); setShowAudio(true); })
                                .catch(() => { setIsReceiving(true); setShowAudio(true); });
                        }

                        /* ─── FEATURE: iniciar latency monitor y heartbeat watcher ─── */
                        if (call.peerConnection) startLatencyMonitor(call.peerConnection);
                        startHeartbeatWatcher();
                    });

                    call.on('close', () => {
                        setIsReceiving(false);
                        setIsReconn(true);
                        stopLatencyMonitor();
                        scheduleRetry();
                    });
                    call.on('error', () => { stopLatencyMonitor(); scheduleRetry(); });
                });

                peer.on('error', err => {
                    if (err.type === 'unavailable-id') {
                        if (!idSuffix) {
                            idSuffix = '-' + Math.random().toString(36).slice(2, 5);
                            setTimeout(() => createPeer(myId + idSuffix), 600);
                        } else setHasError(true);
                    } else if (err.type === 'peer-unavailable') {
                        scheduleRetry();
                    } else scheduleRetry();
                });

                return peer;
            };

            peerRef.current = createPeer(myId);

            return () => {
                if (retryTimerRef.current) clearTimeout(retryTimerRef.current);
                stopLatencyMonitor();
                stopHeartbeatWatcher();
                peerRef.current?.destroy();
            };
        }, [room, slot, scheduleRetry, addChatMsg, startLatencyMonitor, stopLatencyMonitor, startHeartbeatWatcher, stopHeartbeatWatcher]);

        /* ─── Handlers ─── */
        const enableAudio = useCallback(() => {
            if (videoRef.current) { videoRef.current.muted = false; setIsMuted(false); setShowAudio(false); }
        }, []);

        const toggleMute = useCallback(() => {
            if (videoRef.current) {
                const m = !videoRef.current.muted;
                videoRef.current.muted = m;
                setIsMuted(m);
            }
        }, []);

        const enterFullscreen = useCallback(() => {
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        }, []);

        /* ─── FEATURE: Picture-in-Picture ─── */
        const togglePiP = useCallback(async () => {
            if (!videoRef.current) return;
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else {
                    await videoRef.current.requestPictureInPicture();
                }
            } catch (e) { console.warn('PiP no disponible:', e.message); }
        }, []);

        /* ─── Latency color class ─── */
        const latencyClass = latency == null ? '' : latency < 100 ? 'good' : latency < 300 ? 'ok' : 'bad';

        /* ─── Error screen ─── */
        if (hasError) return (
            <div className="v-error">
                <div style={{fontSize:40}}>⚠️</div>
                <div style={{fontWeight:700,fontSize:16}}>CONEXIÓN PERDIDA</div>
                <div style={{fontSize:13,color:'var(--c-muted)'}}>Sin respuesta del Director tras varios intentos</div>
                <button className="v-error-btn" onClick={() => location.reload()}>REINTENTAR</button>
            </div>
        );

        return (
            <div className={`viewer-wrap ${isFullscreen ? 'fs-clean' : ''}`}>
                <video ref={videoRef} className="video-el" playsInline autoPlay muted={isMuted} />

                {/* Loading */}
                {!isReceiving && !isReconnecting && (
                    <div className="v-loading">
                        <div className="spinner" />
                        <div className="v-loading-text">CONECTANDO...</div>
                    </div>
                )}

                {/* Reconnecting banner */}
                {isReconnecting && (
                    <div className="v-reconnect-banner">
                        <div className="spinner sm" />
                        RECONECTANDO CON EL DIRECTOR...
                    </div>
                )}

                {/* Live badge */}
                {isReceiving && !isReconnecting && (
                    <div className="v-live-badge">
                        <span className="live-dot" />
                        EN VIVO
                    </div>
                )}

                {/* Room + latency */}
                <div className="v-room-info">
                    <span>{room} · #{slot}</span>
                    {/* ─── FEATURE: Indicador de latencia ─── */}
                    {latency != null && (
                        <span className={`v-latency ${latencyClass}`}>{latency}ms</span>
                    )}
                    {/* PiP indicator */}
                    {isPiP && <span style={{color:'#a78bfa',fontSize:10,fontWeight:700}}>▶ PiP</span>}
                </div>

                {/* Audio overlay — VISIBLE incluso en fullscreen */}
                {isReceiving && showAudioOverlay && (
                    <div className="v-audio-overlay" onClick={enableAudio}>
                        <button className="v-audio-btn">
                            <span>🔊</span>
                            <span>TOCA PARA ACTIVAR AUDIO</span>
                        </button>
                    </div>
                )}

                {/* ─── FEATURE: Chat feed ─── */}
                <div className="v-chat-feed">
                    {chatMsgs.map(m => (
                        <div key={m.id} className="v-chat-msg">{m.msg}</div>
                    ))}
                </div>

                {/* Controls */}
                {isReceiving && (
                    <div className="v-controls">
                        <button onClick={toggleMute} className={`v-btn ${!isMuted ? 'on' : ''}`}>
                            {isMuted ? '🔇' : '🔊'}
                            {isMuted ? 'Sin audio' : 'Con audio'}
                        </button>
                        {/* ─── FEATURE: PiP ─── */}
                        {document.pictureInPictureEnabled && (
                            <button onClick={togglePiP} className={`v-btn ${isPiP ? 'on' : ''}`}>
                                ⧉ {isPiP ? 'Salir PiP' : 'PiP'}
                            </button>
                        )}
                        <button onClick={enterFullscreen} className="v-btn">
                            ⛶ Pantalla completa
                        </button>
                    </div>
                )}
            </div>
        );
    };

    /* ══════════════════════════════════════
       LOBBY
    ══════════════════════════════════════ */
    const Lobby = () => {
        /* ─── FEATURE: Persistencia de sala en localStorage ─── */
        const [room, setRoom] = useState(() => {
            try { return localStorage.getItem('p2p_last_room') || ''; } catch { return ''; }
        });
        const [generated] = useState(() => Math.random().toString(36).slice(2, 6).toUpperCase());

        const finalRoom = room.trim().toUpperCase() || generated;

        const goDirector = () => {
            try { localStorage.setItem('p2p_last_room', finalRoom); } catch {}
            location.href = `?mode=director&room=${finalRoom}`;
        };

        return (
            <div className="lobby">
                <div className="lobby-card">
                    <div className="lobby-title">STREAM P2P</div>
                    <div className="lobby-sub">Transmisión directa · hasta 10 receptores</div>

                    <input
                        className="lobby-input"
                        value={room}
                        onChange={e => setRoom(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''))}
                        placeholder={generated}
                        maxLength={8}
                        spellCheck={false}
                    />
                    <div style={{fontSize:11,color:'var(--c-muted)',marginBottom:14,textAlign:'left'}}>
                        {room ? `Sala: ${finalRoom}` : `Sala aleatoria: ${generated} — o escribe tu propia`}
                        {room && (() => {
                            try { return localStorage.getItem('p2p_last_room') === finalRoom ? ' · ⭐ última sala' : ''; } catch { return ''; }
                        })()}
                    </div>

                    <button className="lobby-go" onClick={goDirector}>
                        🎬 INICIAR DIRECTOR
                    </button>
                    <div className="lobby-note">
                        Los receptores reciben video limpio con reconexión automática,<br/>
                        chat en tiempo real e indicador de latencia.
                    </div>
                </div>
            </div>
        );
    };

    /* ══════════════════════════════════════
       ROUTER
    ══════════════════════════════════════ */
    const App = () => {
        const [route, setRoute] = useState(null);

        useEffect(() => {
            const p = new URLSearchParams(location.search);
            const m = p.get('mode'), r = p.get('room'), s = p.get('slot');
            if (m === 'director' && r) setRoute({ mode: 'director', room: r });
            else if (m === 'view' && r && s) setRoute({ mode: 'view', room: r, slot: s });
            else setRoute({ mode: 'lobby' });
        }, []);

        if (!route) return null;
        if (route.mode === 'director') return <Director room={route.room} />;
        if (route.mode === 'view')     return <Viewer   room={route.room} slot={route.slot} />;
        return <Lobby />;
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
