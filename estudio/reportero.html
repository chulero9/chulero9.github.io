<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StreamRadio - Reportero</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0d;
            --bg-panel: #0d1117;
            --bg-card: #111820;
            --bg-hover: #161e2a;
            --border: #1e2a38;
            --border-hi: #2a3a50;
            --amber: #f5a623;
            --amber-dim: #9a6a18;
            --amber-glow: rgba(245, 166, 35, 0.15);
            --red-live: #e8392a;
            --red-glow: rgba(232, 57, 42, 0.2);
            --green: #1db954;
            --green-glow: rgba(29, 185, 84, 0.15);
            --ice: #c8dff0;
            --ice-dim: #5a7a95;
            --text-1: #eef2f7;
            --text-2: #7a95af;
            --text-3: #3d5166;
            --font-ui: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--bg-base);
            color: var(--text-1);
            font-family: var(--font-ui);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.012) 2px, rgba(255, 255, 255, 0.012) 4px);
        }

        /* ── LOBBY ── */
        .lobby-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 40%, #0d1a2a 0%, var(--bg-base) 70%);
        }

        .lobby-box {
            background: var(--bg-panel);
            padding: 50px;
            border-radius: 4px;
            border: 1px solid var(--border-hi);
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .lobby-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
        }

        .lobby-box h1 {
            font-size: 3rem;
            margin: 0 0 6px 0;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-1);
        }

        .lobby-box h1 span {
            color: var(--amber);
        }

        .lobby-box p {
            color: var(--text-2);
            margin-bottom: 32px;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .lobby-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-hi);
            color: var(--text-1);
            padding: 14px 16px;
            border-radius: 3px;
            font-size: 1.1rem;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
            font-family: var(--font-mono);
            letter-spacing: 0.2em;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .lobby-input:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 2px var(--amber-glow);
        }

        .lobby-btn {
            width: 100%;
            background: var(--amber);
            color: #0a0600;
            border: none;
            padding: 18px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-family: var(--font-ui);
            transition: all 0.15s;
            min-height: 48px;
        }

        .lobby-btn:hover {
            background: #ffbe4a;
            box-shadow: 0 0 24px var(--amber-glow);
        }

        .lobby-btn:disabled {
            background: var(--bg-card);
            color: var(--text-3);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ── DASHBOARD ── */
        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            padding: 0 28px;
            height: 52px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--amber);
        }

        .logo small {
            font-size: 0.65rem;
            color: var(--text-3);
            margin-left: 10px;
            font-weight: 400;
            letter-spacing: 0.1em;
            font-family: var(--font-mono);
        }

        .top-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .connection-error {
            color: var(--amber);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 10px;
            background: var(--amber-glow);
            border-radius: 2px;
            border: 1px solid var(--amber-dim);
            font-family: var(--font-mono);
        }

        .room-code {
            color: var(--text-3);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
        }

        .room-code b {
            color: var(--ice);
            margin-left: 6px;
        }

        .online-status {
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-family: var(--font-mono);
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── LEFT PANEL ── */
        .info-panel {
            width: 270px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .info-panel h2 {
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 18px;
            text-transform: uppercase;
            color: var(--text-3);
            letter-spacing: 0.2em;
            font-family: var(--font-mono);
        }

        .info-box {
            background: var(--bg-card);
            border-radius: 3px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .info-label {
            font-size: 0.65rem;
            color: var(--text-3);
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .info-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-1);
            line-height: 1;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        .status-indicator.live {
            background: rgba(232, 57, 42, 0.08);
            border-color: var(--red-live);
        }

        .status-indicator.standby {
            background: var(--green-glow);
            border-color: var(--green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: blink 1.2s steps(1) infinite;
            flex-shrink: 0;
        }

        .status-dot.red {
            background: var(--red-live);
        }

        .status-dot.green {
            background: var(--green);
        }

        .status-text {
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            font-family: var(--font-mono);
        }

        .status-indicator.live .status-text {
            color: var(--red-live);
        }

        .status-indicator.standby .status-text {
            color: var(--green);
        }

        .ifb-control {
            margin-top: 14px;
            padding: 14px;
            background: var(--bg-card);
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        .ifb-title {
            font-size: 0.65rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: var(--text-2);
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .ifb-status {
            font-size: 0.8rem;
            color: var(--ice);
            padding: 8px;
            background: rgba(200, 223, 240, 0.06);
            border-radius: 2px;
            border: 1px solid var(--border-hi);
            text-align: center;
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
        }

        /* ── CENTER ── */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            min-width: 0;
        }

        .tabs {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .tab {
            padding: 14px 24px;
            background: none;
            border: none;
            color: var(--text-3);
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-family: var(--font-ui);
            letter-spacing: 0.12em;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--amber);
            border-bottom-color: var(--amber);
            background: var(--bg-base);
        }

        .panel-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .studio-alert-banner {
            padding: 18px;
            border-radius: 3px;
            text-align: center;
            font-weight: 900;
            font-size: 1.1rem;
            margin-bottom: 18px;
            animation: pulse 1.5s infinite;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: var(--font-ui);
        }

        .studio-alert-banner.attention {
            background: rgba(245, 166, 35, 0.12);
            border: 1px solid var(--amber);
            color: var(--amber);
        }

        .studio-alert-banner.on_air {
            background: rgba(232, 57, 42, 0.12);
            border: 1px solid var(--red-live);
            color: var(--red-live);
        }

        .alert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
        }

        .alert-btn {
            padding: 14px;
            border-radius: 3px;
            border: 1px solid var(--border-hi);
            background: var(--bg-card);
            color: var(--text-1);
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: all 0.15s;
            font-family: var(--font-ui);
            letter-spacing: 0.05em;
        }

        .alert-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
            background: var(--amber-glow);
        }

        .alert-btn.high {
            border-color: rgba(232, 57, 42, 0.5);
        }

        .alert-btn.medium {
            border-color: rgba(245, 166, 35, 0.5);
        }

        .status-toggle {
            width: 100%;
            padding: 18px;
            border-radius: 3px;
            border: none;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: var(--font-ui);
            letter-spacing: 0.12em;
            transition: all 0.2s;
        }

        .status-toggle.standby {
            background: var(--green);
            color: #000;
        }

        .status-toggle.standby:hover {
            box-shadow: 0 0 20px var(--green-glow);
        }

        .status-toggle.live {
            background: var(--red-live);
            color: white;
            box-shadow: 0 0 20px var(--red-glow);
            animation: pulse 2s infinite;
        }

        /* ── RIGHT PANEL ── */
        .alerts-panel {
            width: 300px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .alerts-header {
            padding: 16px 18px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .alerts-header h2 {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-2);
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .responses-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
        }

        .response-card {
            background: var(--bg-card);
            border-radius: 2px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 3px solid var(--amber);
            border-right: 1px solid var(--border);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .response-card .from {
            font-weight: 700;
            color: var(--amber);
            font-size: 0.7rem;
            margin-bottom: 5px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .response-card .msg {
            color: var(--text-2);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .response-card .time {
            font-size: 0.65rem;
            color: var(--text-3);
            margin-top: 7px;
            font-family: var(--font-mono);
        }

        /* ── CHAT ── */
        .chat-section {
            height: 210px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .chat-header-small {
            padding: 10px 18px;
            background: var(--bg-panel);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            color: var(--text-3);
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .chat-messages-small {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg-small {
            background: var(--bg-card);
            padding: 9px 12px;
            border-radius: 2px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }

        .chat-msg-small .sender {
            font-weight: 700;
            color: var(--amber);
            font-size: 0.65rem;
            margin-bottom: 3px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .chat-input-small {
            display: flex;
            padding: 10px;
            background: var(--bg-panel);
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        .chat-input-small input {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 9px 12px;
            border-radius: 2px;
            font-size: 0.9rem;
            font-family: var(--font-ui);
        }

        .chat-input-small input:focus {
            outline: none;
            border-color: var(--amber);
        }

        .chat-input-small button {
            background: var(--amber);
            color: #000;
            border: none;
            padding: 9px 16px;
            border-radius: 2px;
            font-weight: 700;
            cursor: pointer;
            font-family: var(--font-ui);
        }

        /* ── AUDIO UNLOCK ── */
        .audio-unlock-banner {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--amber);
            color: #000;
            padding: 14px 28px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 0 30px var(--amber-glow);
            border: none;
            font-family: var(--font-ui);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        /* ── MOBILE ── */
        .mobile-broadcast {
            display: none;
        }

        .mobile-header-bar {
            background: var(--bg-panel);
            border-radius: 3px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .mobile-header-status {
            color: var(--text-3);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-family: var(--font-mono);
        }

        .mobile-header-status.live {
            color: var(--red-live);
        }

        .mobile-retorno-pill {
            background: var(--green);
            color: #000;
            padding: 5px 14px;
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
        }

        .mobile-retorno-pill.off {
            background: var(--bg-card);
            color: var(--text-3);
            border: 1px solid var(--border);
        }

        .mobile-vu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .mobile-vu-meter {
            width: 36px;
            height: 110px;
            background: var(--bg-card);
            border-radius: 4px;
            display: flex;
            flex-direction: column-reverse;
            padding: 5px;
            gap: 3px;
            border: 1px solid var(--border);
        }

        .mobile-vu-segment {
            flex: 1;
            min-height: 7px;
            background: var(--border);
            border-radius: 2px;
            transition: background 0.08s;
        }

        .mobile-vu-segment.active {
            background: var(--green);
        }

        .mobile-vu-segment.peaking {
            background: var(--red-live);
        }

        .mobile-vu-badge {
            margin-top: 8px;
            padding: 5px 12px;
            background: var(--bg-card);
            border-radius: 2px;
            color: var(--ice-dim);
            font-size: 0.7rem;
            font-weight: 600;
            font-family: var(--font-mono);
            border: 1px solid var(--border);
            letter-spacing: 0.08em;
        }

        .mobile-btn-al-aire {
            width: 100%;
            padding: 22px;
            background: var(--green);
            border: none;
            border-radius: 3px;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin-bottom: 14px;
            box-shadow: 0 4px 24px var(--green-glow);
            transition: all 0.2s;
        }

        .mobile-btn-al-aire.live {
            background: var(--red-live);
            color: white;
            box-shadow: 0 4px 24px var(--red-glow);
        }

        .mobile-btn-al-aire .icon {
            font-size: 1.8rem;
        }

        .mobile-btn-al-aire .label {
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-family: var(--font-ui);
        }

        .mobile-btn-al-aire .sublabel {
            font-size: 0.8rem;
            opacity: 0.85;
            font-family: var(--font-mono);
        }

        .mobile-btn-notificar {
            width: 100%;
            padding: 15px 20px;
            background: var(--amber);
            border: none;
            border-radius: 3px;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            position: relative;
            font-family: var(--font-ui);
            letter-spacing: 0.1em;
        }

        .mobile-alert-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: var(--red-live);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 900;
            animation: blink 1s steps(1) infinite;
        }

        .mobile-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-panel);
            padding: 10px 20px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid var(--border);
        }

        .mobile-nav-btn {
            flex: 1;
            max-width: 80px;
            padding: 13px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text-2);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-nav-btn.active {
            background: var(--green);
            border-color: var(--green);
            color: #000;
        }

        .mobile-nav-btn:active {
            transform: scale(0.96);
        }

        .mobile-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-panel);
            border-radius: 6px 6px 0 0;
            max-height: 75vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            border-top: 1px solid var(--border-hi);
        }

        .mobile-sheet.open {
            transform: translateY(0);
        }

        .mobile-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .mobile-sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-sheet-handle {
            width: 36px;
            height: 3px;
            background: var(--border-hi);
            border-radius: 2px;
            margin: 12px auto;
            cursor: pointer;
        }

        .mobile-sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 30px;
        }

        .mobile-sheet-header {
            padding: 10px 0 18px;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-family: var(--font-mono);
            color: var(--text-2);
        }

        @media (max-width: 768px) {
            .desktop-dashboard {
                display: none !important;
            }

            .mobile-broadcast {
                display: flex;
                flex-direction: column;
                padding: 18px;
                padding-bottom: 100px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                min-height: 100vh;
            }
        }

        @media (max-width: 400px) {
            .lobby-box {
                padding: 30px 20px;
            }

            .lobby-box h1 {
                font-size: 2rem;
            }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .top-bar {
                padding-top: max(12px, env(safe-area-inset-top));
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.7
            }
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1
            }

            50%,
            100% {
                opacity: 0.3
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-hi);
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const ALERT_TYPES = [
            { id: 'ready', label: 'Listo', severity: 'normal', icon: '🎤' },
            { id: 'problem', label: 'Problema', severity: 'high', icon: '⚠️' },
            { id: 'visual', label: 'Visual', severity: 'medium', icon: '👁️' },
            { id: 'blocked', label: 'Bloqueado', severity: 'high', icon: '🚧' },
            { id: '5min', label: '5 min', severity: 'medium', icon: '⏱️' },
            { id: 'custom', label: 'Personalizado', severity: 'normal', icon: '✏️' },
        ];

        const ReporterDashboard = () => {
            const [inRoom, setInRoom] = useState(false);
            const [connecting, setConnecting] = useState(false);
            const [roomCode, setRoomCode] = useState('');
            const [reporterName, setReporterName] = useState('');
            const [status, setStatus] = useState('standby');
            const [studioAlert, setStudioAlert] = useState(null);
            const [unreadStudioAlert, setUnreadStudioAlert] = useState(false);
            const [responses, setResponses] = useState([]);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [connectionError, setConnectionError] = useState(null);
            const [customAlertMessage, setCustomAlertMessage] = useState('');
            const [mqttConnected, setMqttConnected] = useState(false);
            const [ifbConnected, setIfbConnected] = useState(false);
            const [micLevel, setMicLevel] = useState(0);
            const [micMuted, setMicMuted] = useState(true);
            const [mobileSheet, setMobileSheet] = useState(null);
            const [audioBlocked, setAudioBlocked] = useState(false);
            const [studioOnline, setStudioOnline] = useState(false);
            const [recording, setRecording] = useState(false);
            const [highFidelity, setHighFidelity] = useState(false);
            const [peerStats, setPeerStats] = useState(null);

            const peerRef = useRef(null);
            const mqttRef = useRef(null);
            const callRef = useRef(null);
            const micStreamRef = useRef(null);
            const ifbAudioRef = useRef(null);
            const analyserRef = useRef(null);
            const animationFrameRef = useRef(null);
            const audioCtxVuRef = useRef(null);
            const chatBottomRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const recordedChunksRef = useRef([]);
            const statusRef = useRef(status);
            const inRoomRef = useRef(inRoom);
            const wakeLockRef = useRef(null);

            useEffect(() => { statusRef.current = status; }, [status]);
            useEffect(() => { inRoomRef.current = inRoom; }, [inRoom]);

            // ── Wake Lock (Evitar suspensión de pantalla) ────────────────────────────
            const requestWakeLock = async () => {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                        wakeLockRef.current.addEventListener('release', () => {
                            console.log('Wake Lock liberado');
                        });
                    }
                } catch (err) {
                    console.error('Wake Lock error:', err);
                }
            };

            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible' && inRoomRef.current) {
                        requestWakeLock();
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
            }, []);

            const getAudioCtx = useCallback(async () => {
                if (!audioCtxVuRef.current) audioCtxVuRef.current = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtxVuRef.current.state === 'suspended') await audioCtxVuRef.current.resume();
                return audioCtxVuRef.current;
            }, []);

            // ── Publicar estado del reportero ────────────────────────────────────────
            const publishReporterStatus = useCallback((s) => {
                if (!mqttRef.current?.connected || !peerRef.current) return;
                mqttRef.current.publish(
                    `radio/${roomCode}/reporters`,
                    JSON.stringify({ id: peerRef.current.id, name: reporterName, status: s })
                );
            }, [roomCode, reporterName]);

            // ── Mute/unmute micrófono ─────────────────────────────────────────────────
            const applyMicMute = useCallback((muted) => {
                micStreamRef.current?.getAudioTracks().forEach(t => { t.enabled = !muted; });
                if (muted) setMicLevel(0);
            }, []);

            // ── Grabación de Respaldo Local ───────────────────────────────────────────
            const toggleRecording = () => {
                if (recording) {
                    mediaRecorderRef.current?.stop();
                    setRecording(false);
                } else {
                    if (!micStreamRef.current) return alert("Pida permisos de micrófono primero");
                    try {
                        recordedChunksRef.current = [];
                        const mr = new MediaRecorder(micStreamRef.current, { mimeType: 'audio/webm' });
                        mr.ondataavailable = e => { if (e.data.size > 0) recordedChunksRef.current.push(e.data); };
                        mr.onstop = () => {
                            const blob = new Blob(recordedChunksRef.current, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = url;
                            a.download = `StreamRadio_${reporterName.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.webm`;
                            document.body.appendChild(a);
                            a.click();
                            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
                        };
                        mediaRecorderRef.current = mr;
                        mr.start(1000);
                        setRecording(true);
                    } catch (e) {
                        alert("No se pudo iniciar la grabación: " + e.message);
                    }
                }
            };

            // ── Modo Alta Fidelidad ───────────────────────────────────────────────────
            const toggleFidelity = async () => {
                const nextMode = !highFidelity;
                try {
                    if (micStreamRef.current) micStreamRef.current.getTracks().forEach(t => t.stop());
                    
                    const newConstraints = nextMode 
                        ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                        : { echoCancellation: true, noiseSuppression: false, autoGainControl: true };

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: newConstraints });
                    micStreamRef.current = stream;
                    applyMicMute(micMuted);

                    if (callRef.current && callRef.current.peerConnection) {
                        const sender = callRef.current.peerConnection.getSenders().find(s => s.track && s.track.kind === 'audio');
                        if (sender) sender.replaceTrack(stream.getAudioTracks()[0]);
                    }

                    if (analyserRef.current && audioCtxVuRef.current) {
                         const source = audioCtxVuRef.current.createMediaStreamSource(stream);
                         source.connect(analyserRef.current);
                    }

                    setHighFidelity(nextMode);
                } catch(e) {
                    alert('Error cambiando modo de fidelidad: ' + e.message);
                }
            };

            // ── Beep de alerta del estudio ────────────────────────────────────────────
            const playAlertBeep = useCallback(async (type) => {
                try {
                    const ctx = await getAudioCtx(); // Reutiliza contexto global
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.value = type === 'on_air' ? 880 : 660;
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
                    if (navigator.vibrate) navigator.vibrate(type === 'on_air' ? [200, 100, 200] : [150]);
                } catch (e) { }
            }, [getAudioCtx]);

            // ── Activar IFB manualmente (desbloqueo de autoplay) ─────────────────────
            const tryPlayIFB = useCallback(async () => {
                const el = ifbAudioRef.current;
                if (!el) return;
                // Si no hay stream asignado todavía, solo marcar que el usuario interactuó
                if (!el.srcObject) {
                    setAudioBlocked(false);
                    return;
                }
                try {
                    await el.play();
                    setAudioBlocked(false);
                    setIfbConnected(true);
                } catch (e) {
                    console.warn('IFB play failed:', e);
                    setAudioBlocked(true);
                }
            }, []);

            // ── Conectar a la sala ────────────────────────────────────────────────────
            const joinRoom = async () => {
                if (!roomCode.trim() || !reporterName.trim()) return alert('Completá todos los campos');
                setConnecting(true);
                setConnectionError(null);

                // Activar WakeLock para evitar que el OS suspenda el proceso/pantalla
                await requestWakeLock();

                // 1. Pedir micrófono
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: true }
                    });
                    micStreamRef.current = stream;
                    applyMicMute(micMuted);
                } catch (e) {
                    alert('No se pudo acceder al micrófono. Verificá los permisos.');
                    setConnecting(false);
                    return;
                }

                // 2. Crear peer con ID único
                const peerId = `reporter_${roomCode}_${Math.random().toString(36).substr(2, 9)}`;
                const peer = new Peer(peerId, {
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });
                peerRef.current = peer;

                // 3. MQTT
                const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    clientId: `mqtt_reporter_${Math.random().toString(16).substr(2, 8)}`,
                    reconnectPeriod: 3000
                });
                mqttRef.current = client;

                client.on('connect', () => {
                    setConnectionError(null);
                    setMqttConnected(true);
                    client.subscribe(`radio/${roomCode}/alerts/response`, { qos: 1 });
                    client.subscribe(`radio/${roomCode}/chat`);
                    client.subscribe(`radio/${roomCode}/studio`);
                    // Suscripción crítica: mover la suscripción aquí evita la condición de carrera
                    client.subscribe(`radio/${roomCode}/studio_alert/${peerId}`, { qos: 1 });
                });

                client.on('error', err => { console.error('MQTT:', err); setConnectionError('Error MQTT.'); });
                client.on('offline', () => setConnectionError('Desconectado. Reconectando...'));

                client.on('message', (topic, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());

                        // Alerta del estudio dirigida a este reportero
                        if (topic.includes('/studio_alert')) {
                            setStudioAlert({ type: data.type, from: data.from });
                            setUnreadStudioAlert(true);
                            playAlertBeep(data.type);
                            setTimeout(() => setStudioAlert(null), 5000);
                        }
                        // Respuesta del estudio a una alerta enviada
                        if (topic.endsWith('/alerts/response') && data.to === peerRef.current?.id) {
                            setResponses(prev => [{
                                ...data,
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            }, ...prev].slice(0, 50));
                        }
                        // Chat general
                        if (topic.endsWith('/chat')) {
                            setChatMessages(prev => [...prev, data].slice(-100));
                        }
                        // Estado del estudio online/offline
                        if (topic.endsWith('/studio')) {
                            setStudioOnline(data.status === 'online');
                        }
                    } catch (e) { }
                });

                // 4. PeerJS: cuando abre conexión, llamar al estudio
                peer.on('open', () => {
                    setConnectionError(null);
                    setConnecting(false);
                    setInRoom(true);

                    // Llamar al estudio con reconexión automática
                    const makeCall = () => {
                        if (!peerRef.current || !micStreamRef.current || peerRef.current.disconnected) return;
                        if (callRef.current) try { callRef.current.close(); } catch (e) { }

                        const call = peerRef.current.call(`studio_${roomCode}`, micStreamRef.current);
                        if (!call) {
                            setConnectionError('No se pudo llamar al estudio. ¿Está conectado?');
                            return;
                        }
                        callRef.current = call;

                        // Monitor de ICE para reconexión forzada en caso de cortes de red (Wifi a 4G)
                        if (call.peerConnection) {
                            call.peerConnection.addEventListener('iceconnectionstatechange', () => {
                                const state = call.peerConnection.iceConnectionState;
                                if (state === 'failed' || state === 'disconnected' || state === 'closed') {
                                    // Esperar un instante, si sigue desconectado forzamos el cierre para reconectar
                                    setTimeout(() => {
                                        if (call.peerConnection && ['failed', 'disconnected', 'closed'].includes(call.peerConnection.iceConnectionState)) {
                                            console.warn('ICE connection dropped, forcing reconnect...');
                                            call.close();
                                        }
                                    }, 4000);
                                }
                            });
                        }

                        // IFB: recibir audio del estudio
                        call.on('stream', async (remoteStream) => {
                            const el = ifbAudioRef.current;
                            if (!el) return;
                            el.srcObject = remoteStream;
                            try {
                                el.muted = false;
                                await el.play();
                                setAudioBlocked(false);
                                setIfbConnected(true);
                            } catch (e) {
                                console.warn('IFB autoplay bloqueado, mostrando banner');
                                setAudioBlocked(true);
                                setIfbConnected(false);
                            }
                        });

                        call.on('error', err => console.error('Call error:', err));
                        call.on('close', () => {
                            if (call.statsInterval) clearInterval(call.statsInterval);
                            setIfbConnected(false);
                            callRef.current = null;
                            // Intentar reconexión si seguimos en sala
                            setTimeout(() => { if (inRoomRef.current && peerRef.current && !peerRef.current.disconnected) makeCall(); }, 2500);
                        });

                        // Monitor Stats
                        if (call.statsInterval) clearInterval(call.statsInterval);
                        call.statsInterval = setInterval(async () => {
                            if (call.peerConnection) {
                                try {
                                    const stats = await call.peerConnection.getStats();
                                    let rtt = 0;
                                    let fractionLost = 0;
                                    stats.forEach(report => {
                                        if (report.type === 'remote-inbound-rtp') {
                                           rtt = report.roundTripTime * 1000 || rtt;
                                           fractionLost = report.fractionLost || fractionLost;
                                        }
                                        if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                                           rtt = report.currentRoundTripTime * 1000 || rtt;
                                        }
                                    });
                                    setPeerStats({ rtt, packetLoss: fractionLost });
                                } catch (e) {}
                            }
                        }, 2000);
                    };
                    makeCall();
                });

                peer.on('error', err => {
                    console.error('PeerJS:', err);
                    setConnecting(false);
                    setConnectionError('Error PeerJS. ¿El estudio está conectado con ese código?');
                });
            };

            // ── Heartbeat de estado ───────────────────────────────────────────────────
            useEffect(() => {
                if (!inRoom || !mqttConnected || !peerRef.current) return;
                publishReporterStatus(status);
                const t = setInterval(() => publishReporterStatus(statusRef.current), 5000);
                return () => clearInterval(t);
            }, [inRoom, status, mqttConnected, publishReporterStatus]);

            // ── VU Meter del micrófono ────────────────────────────────────────────────
            useEffect(() => {
                if (!inRoom || !micStreamRef.current) return;
                try {
                    getAudioCtx().then(ctx => {
                        if (!inRoomRef.current) return; // Cleanup de carrera
                        const source = ctx.createMediaStreamSource(micStreamRef.current);
                        const analyser = ctx.createAnalyser();
                        analyser.fftSize = 256;
                        source.connect(analyser);
                        analyserRef.current = analyser;

                        const data = new Uint8Array(analyser.frequencyBinCount);
                        const tick = () => {
                            if (!analyserRef.current) return;
                            analyserRef.current.getByteFrequencyData(data);
                            const avg = data.reduce((a, b) => a + b, 0) / data.length;
                            setMicLevel(avg);
                            animationFrameRef.current = requestAnimationFrame(tick);
                        };
                        tick();
                    });
                } catch (e) { console.error('VU error:', e); }

                return () => {
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                    if (analyserRef.current) { try { analyserRef.current.disconnect(); } catch (e) { } analyserRef.current = null; }
                    // No cerramos el audioCtx porque es global
                };
            }, [inRoom, getAudioCtx]);

            // Sincronizar micrófono con el estado "live/standby"
            useEffect(() => {
                setMicMuted(status !== 'live');
            }, [status]);

            // Aplicar mute cuando cambia micMuted
            useEffect(() => { applyMicMute(micMuted); }, [micMuted, applyMicMute]);

            // Scroll automático al último chat
            useEffect(() => {
                chatBottomRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [chatMessages]);

            // ── Enviar alerta al estudio ──────────────────────────────────────────────
            const sendAlert = (alertType, customMsg = '') => {
                if (!mqttRef.current?.connected || !peerRef.current) return;
                mqttRef.current.publish(
                    `radio/${roomCode}/alerts`,
                    JSON.stringify({
                        reporterId: peerRef.current.id,
                        reporterName,
                        alertId: alertType.id,
                        alertLabel: alertType.label,
                        message: alertType.id === 'custom' ? (customMsg || 'Mensaje personalizado') : alertType.label,
                        severity: alertType.severity,
                        timestamp: Date.now(),
                        isLive: status === 'live'
                    }),
                    { qos: 1 }
                );
                if (alertType.id === 'custom') setCustomAlertMessage('');
            };

            // ── Chat ──────────────────────────────────────────────────────────────────
            const sendChat = e => {
                e.preventDefault();
                if (!chatInput.trim() || !mqttRef.current?.connected) return;
                const payload = {
                    id: Date.now(), sender: reporterName, text: chatInput.trim(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                mqttRef.current.publish(`radio/${roomCode}/chat`, JSON.stringify(payload));
                setChatMessages(prev => [...prev, payload]);
                setChatInput('');
            };

            // ── Cleanup ───────────────────────────────────────────────────────────────
            useEffect(() => {
                return () => {
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                    if (analyserRef.current) { try { analyserRef.current.disconnect(); } catch (e) { } }
                    if (audioCtxVuRef.current) { try { audioCtxVuRef.current.close(); } catch (e) { } }
                    if (callRef.current) { try { callRef.current.close(); } catch (e) { } callRef.current = null; }
                    if (peerRef.current) { peerRef.current.destroy(); peerRef.current = null; }
                    if (mqttRef.current) { mqttRef.current.end(); mqttRef.current = null; }
                    if (micStreamRef.current) micStreamRef.current.getTracks().forEach(t => t.stop());
                    if (ifbAudioRef.current) { ifbAudioRef.current.pause(); ifbAudioRef.current.srcObject = null; }
                    if (wakeLockRef.current) { wakeLockRef.current.release().then(() => wakeLockRef.current = null); }
                };
            }, []);

            // ── LOBBY ─────────────────────────────────────────────────────────────────
            if (!inRoom) return (
                <div className="lobby-screen">
                    <div className="lobby-box">
                        <h1>STREAM<span>RADIO</span></h1>
                        <p>REPORTERO / MÓVIL</p>
                        <input className="lobby-input" placeholder="CÓDIGO DE SALA"
                            value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} disabled={connecting} />
                        <input className="lobby-input" placeholder="NOMBRE DEL REPORTERO"
                            value={reporterName} onChange={e => setReporterName(e.target.value)}
                            style={{ textTransform: 'none' }} disabled={connecting} />
                        <button className="lobby-btn" onClick={joinRoom} disabled={connecting}>
                            {connecting ? 'CONECTANDO...' : 'CONECTAR'}
                        </button>
                        {connectionError && <p style={{ marginTop: 14, color: 'var(--amber)', fontSize: '0.82rem', fontFamily: 'var(--font-mono)' }}>{connectionError}</p>}
                    </div>
                </div>
            );

            const VU_SEGMENTS = 8;
            const vuActiveCount = Math.min(VU_SEGMENTS, Math.ceil((micLevel / 128) * VU_SEGMENTS));

            // ── DASHBOARD ─────────────────────────────────────────────────────────────
            return (
                <>
                    <audio ref={ifbAudioRef} autoPlay playsInline style={{ display: 'none' }} />

                    {audioBlocked && (
                        <button className="audio-unlock-banner" onClick={tryPlayIFB}>
                            🔊 Tocá aquí para activar el retorno (IFB)
                        </button>
                    )}

                    {/* ── DESKTOP ── */}
                    <div className="dashboard desktop-dashboard">
                        <div className="top-bar">
                            <div className="logo">STREAM<span>RADIO</span><small>REPORTERO</small></div>
                            <div className="top-status">
                                {connectionError && (
                                    <span className="connection-error" onClick={() => setConnectionError(null)}>⚠️ {connectionError}</span>
                                )}
                                <span className="room-code">SALA: <b>{roomCode}</b></span>
                                {peerStats && <span className="online-status" style={{color: 'var(--text-3)', marginLeft: 10, background: 'transparent', padding: 0}}>📶 {peerStats.rtt.toFixed(0)}ms {peerStats.packetLoss > 0 ? '⚠️' : ''}</span>}
                                <span className="online-status">● CONECTADO</span>
                            </div>
                        </div>
                        <div className="main-content">
                            {/* Panel izquierdo */}
                            <div className="info-panel">
                                <h2>▸ ESTADO</h2>
                                <div className="info-box">
                                    <div className="info-label">Modo</div>
                                    <div className="info-value">{status === 'live' ? 'EN VIVO' : 'STANDBY'}</div>
                                </div>
                                <div className={`status-indicator ${status}`}>
                                    <div className={`status-dot ${status === 'live' ? 'red' : 'green'}`} />
                                    <span className="status-text">{status === 'live' ? '🔴 TRANSMITIENDO' : '⚫ STANDBY'}</span>
                                </div>
                                <button
                                    className={`status-toggle ${status}`}
                                    style={{ marginTop: 14 }}
                                    onClick={() => setStatus(s => s === 'standby' ? 'live' : 'standby')}>
                                    {status === 'standby' ? '▶ PASAR A EN VIVO' : '⏹ VOLVER A STANDBY'}
                                </button>
                                <div className="ifb-control">
                                    <div className="ifb-title">🎧 RETORNO (IFB)</div>
                                    <div className="ifb-status">
                                        {ifbConnected ? '● Retorno activo — escuchás al estudio' : '○ Esperando retorno del estudio...'}
                                    </div>
                                </div>
                                <div className="info-box" style={{ marginTop: 12 }}>
                                    <div className="info-label">Estudio</div>
                                    <div style={{ fontSize: '0.95rem', fontWeight: 700, color: studioOnline ? 'var(--green)' : 'var(--red-live)', fontFamily: 'var(--font-mono)' }}>
                                        {studioOnline ? '● ONLINE' : '● OFFLINE'}
                                    </div>
                                </div>
                                <div className="info-box" style={{ marginTop: 12 }}>
                                    <div className="info-label" style={{marginBottom: 8}}>Opciones Avanzadas</div>
                                    <button 
                                        onClick={toggleFidelity}
                                        style={{ width: '100%', padding: '8px', background: highFidelity ? 'var(--blue)' : 'var(--bg-card)', color: 'white', border: '1px solid var(--border)', borderRadius: 4, marginTop: 5, cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>
                                        {highFidelity ? '🎧 ALTA FIDELIDAD' : '🎙️ ESTÁNDAR'}
                                    </button>
                                    <button 
                                        onClick={toggleRecording}
                                        style={{ width: '100%', padding: '8px', background: recording ? '#8B0000' : 'var(--bg-card)', color: 'white', border: '1px solid var(--border)', borderRadius: 4, marginTop: 5, cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>
                                        {recording ? '⏹ DETENER GRABACIÓN' : '⏺ GRABAR LOCAL'}
                                    </button>
                                </div>
                            </div>

                            {/* Panel central */}
                            <div className="center-panel">
                                <div className="tabs">
                                    <button className="tab active">📢 ENVIAR ALERTA</button>
                                </div>
                                <div className="panel-content">
                                    {studioAlert && (
                                        <div className={`studio-alert-banner ${studioAlert.type}`}>
                                            {studioAlert.type === 'attention' ? '⚠️ ATENTO' : '🔴 AL AIRE'} — {studioAlert.from}
                                        </div>
                                    )}
                                    <p style={{ marginBottom: 14, color: 'var(--text-2)', fontSize: '0.82rem', fontFamily: 'var(--font-mono)' }}>Tocá para enviar alerta al estudio:</p>
                                    <div className="alert-grid">
                                        {ALERT_TYPES.filter(a => a.id !== 'custom').map(a => (
                                            <button key={a.id} className={`alert-btn ${a.severity}`} onClick={() => sendAlert(a)}>
                                                {a.icon} {a.label}
                                            </button>
                                        ))}
                                    </div>
                                    <div style={{ marginTop: 18 }}>
                                        <input className="lobby-input"
                                            placeholder="Alerta personalizada..."
                                            value={customAlertMessage}
                                            onChange={e => setCustomAlertMessage(e.target.value)}
                                            style={{ marginBottom: 10, textTransform: 'none' }} />
                                        <button className="alert-btn"
                                            onClick={() => sendAlert(ALERT_TYPES.find(a => a.id === 'custom'), customAlertMessage)}>
                                            ✏️ Enviar personalizada
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Panel derecho */}
                            <div className="alerts-panel">
                                <div className="alerts-header"><h2>📩 RESPUESTAS DEL ESTUDIO</h2></div>
                                <div className="responses-list">
                                    {responses.length === 0 && (
                                        <div style={{ textAlign: 'center', color: 'var(--text-3)', marginTop: 30, fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>Sin respuestas aún</div>
                                    )}
                                    {responses.map((r, i) => (
                                        <div key={i} className="response-card">
                                            <div className="from">{r.from}</div>
                                            <div className="msg">{r.message}</div>
                                            <div className="time">{r.time}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="chat-section">
                                    <div className="chat-header-small">💬 CHAT</div>
                                    <div className="chat-messages-small">
                                        {chatMessages.map((m, i) => (
                                            <div key={i} className="chat-msg-small">
                                                <div className="sender">{m.sender}</div>
                                                <div>{m.text}</div>
                                            </div>
                                        ))}
                                        <div ref={chatBottomRef} />
                                    </div>
                                    <form className="chat-input-small" onSubmit={sendChat}>
                                        <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Mensaje..." />
                                        <button type="submit">➤</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ── MOBILE ── */}
                    <div className="mobile-broadcast">
                        <div className="mobile-header-bar">
                            <span className={`mobile-header-status ${status === 'live' ? 'live' : ''}`}>
                                {status === 'live' ? '🔴 EN VIVO' : '⚫ STANDBY'}
                            </span>
                            {peerStats && <span style={{fontSize: '0.7rem', color: 'var(--text-3)'}}>📶 {peerStats.rtt.toFixed(0)}ms</span>}
                            <div className={`mobile-retorno-pill ${ifbConnected ? '' : 'off'}`}>
                                <span>🎧</span>
                                <span>{ifbConnected ? 'RETORNO OK' : 'SIN RETORNO'}</span>
                            </div>
                        </div>

                        {studioAlert && (
                            <div className={`studio-alert-banner ${studioAlert.type}`} style={{ marginBottom: 16 }}>
                                {studioAlert.type === 'attention' ? '⚠️ ATENTO' : '🔴 AL AIRE'} — {studioAlert.from}
                            </div>
                        )}

                        <div className="mobile-vu-container">
                            <div className="mobile-vu-meter">
                                {Array.from({ length: VU_SEGMENTS }).map((_, i) => (
                                    <div key={i} className={`mobile-vu-segment ${i < vuActiveCount ? (i >= VU_SEGMENTS - 2 ? 'peaking' : 'active') : ''}`} />
                                ))}
                            </div>
                            <div className="mobile-vu-badge">{micMuted ? '🔇 MIC EN SILENCIO' : '🎙️ 48KHZ · MONO'}</div>
                        </div>

                        <button
                            className={`mobile-btn-al-aire ${status === 'live' ? 'live' : ''}`}
                            onClick={() => setStatus(s => s === 'standby' ? 'live' : 'standby')}>
                            <span className="icon">{status === 'live' ? '⏹' : '▶'}</span>
                            <span className="label">{status === 'live' ? 'EN VIVO' : 'AL AIRE'}</span>
                            <span className="sublabel">{status === 'live' ? 'Transmitiendo al estudio' : 'Listo para salir al aire'}</span>
                        </button>

                        <button className="mobile-btn-notificar"
                            onClick={() => { setMobileSheet('alerts'); setUnreadStudioAlert(false); }}>
                            {unreadStudioAlert && <span className="mobile-alert-badge">!</span>}
                            🚨 NOTIFICAR AL CONTROL
                        </button>

                        <div style={{ display: 'flex', gap: 10, margin: '15px 20px' }}>
                            <button 
                                onClick={toggleFidelity}
                                style={{ flex: 1, padding: '12px', background: highFidelity ? 'var(--blue)' : 'var(--bg-box)', color: 'white', border: '1px solid var(--border)', borderRadius: 8, cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '0.75rem', fontWeight: 600 }}>
                                {highFidelity ? '🎧 HI-FI' : '🎙️ ESTÁNDAR'}
                            </button>
                            <button 
                                onClick={toggleRecording}
                                style={{ flex: 1, padding: '12px', background: recording ? '#8B0000' : 'var(--bg-box)', color: 'white', border: '1px solid var(--border)', borderRadius: 8, cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: '0.75rem', fontWeight: 600 }}>
                                {recording ? '⏹ DETENER' : '⏺ GRABAR'}
                            </button>
                        </div>

                        <div className="mobile-bottom-nav">
                            <button className={`mobile-nav-btn ${mobileSheet === 'chat' ? 'active' : ''}`}
                                onClick={() => setMobileSheet(mobileSheet === 'chat' ? null : 'chat')}>💬</button>
                            <button className={`mobile-nav-btn ${micMuted ? '' : 'active'}`}
                                onClick={() => setMicMuted(m => !m)}>
                                {micMuted ? '🔇' : '🎙️'}
                            </button>
                            <button className={`mobile-nav-btn ${ifbConnected ? 'active' : ''}`}
                                onClick={ifbConnected ? undefined : tryPlayIFB}
                                title="Retorno IFB">🎧</button>
                            <button className="mobile-nav-btn"
                                onClick={() => { if (confirm('¿Desconectar?')) window.location.reload(); }}>🚪</button>
                        </div>
                    </div>

                    {/* ── SHEET MOBILE ── */}
                    <div className={`mobile-sheet-overlay ${mobileSheet ? 'open' : ''}`} onClick={() => setMobileSheet(null)} />
                    <div className={`mobile-sheet ${mobileSheet ? 'open' : ''}`}>
                        <div className="mobile-sheet-handle" onClick={() => setMobileSheet(null)} />
                        <div className="mobile-sheet-content">
                            {mobileSheet === 'chat' && (
                                <>
                                    <div className="mobile-sheet-header">💬 CHAT</div>
                                    <div className="chat-messages-small" style={{ maxHeight: 200, marginBottom: 14 }}>
                                        {chatMessages.length === 0 && (
                                            <div style={{ color: 'var(--text-3)', padding: 20, fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>Sin mensajes</div>
                                        )}
                                        {chatMessages.map((m, i) => (
                                            <div key={i} className="chat-msg-small">
                                                <div className="sender">{m.sender}</div>
                                                <div>{m.text}</div>
                                            </div>
                                        ))}
                                        <div ref={chatBottomRef} />
                                    </div>
                                    <form className="chat-input-small" onSubmit={sendChat}>
                                        <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Mensaje..." />
                                        <button type="submit">➤</button>
                                    </form>
                                </>
                            )}
                            {mobileSheet === 'alerts' && (
                                <>
                                    <div className="mobile-sheet-header">🚨 NOTIFICAR AL CONTROL</div>
                                    {studioAlert && (
                                        <div className={`studio-alert-banner ${studioAlert.type}`} style={{ marginBottom: 14 }}>
                                            {studioAlert.type === 'attention' ? '⚠️ ATENTO' : '🔴 AL AIRE'} — {studioAlert.from}
                                        </div>
                                    )}
                                    <div className="alert-grid" style={{ marginBottom: 14 }}>
                                        {ALERT_TYPES.filter(a => a.id !== 'custom').map(a => (
                                            <button key={a.id} className={`alert-btn ${a.severity}`}
                                                onClick={() => { sendAlert(a); setMobileSheet(null); }}>
                                                {a.icon} {a.label}
                                            </button>
                                        ))}
                                    </div>
                                    <input className="lobby-input"
                                        placeholder="Alerta personalizada..."
                                        value={customAlertMessage}
                                        onChange={e => setCustomAlertMessage(e.target.value)}
                                        style={{ marginBottom: 10, textTransform: 'none' }} />
                                    <button className="alert-btn"
                                        onClick={() => { sendAlert(ALERT_TYPES.find(a => a.id === 'custom'), customAlertMessage); setMobileSheet(null); }}>
                                        ✏️ Enviar personalizada
                                    </button>
                                    <div className="mobile-sheet-header" style={{ marginTop: 22 }}>📩 RESPUESTAS</div>
                                    {responses.length === 0 && (
                                        <div style={{ color: 'var(--text-3)', padding: '10px 0', fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>Sin respuestas</div>
                                    )}
                                    {responses.slice(0, 5).map((r, i) => (
                                        <div key={i} className="response-card" style={{ marginBottom: 10 }}>
                                            <div className="from">{r.from}</div>
                                            <div className="msg">{r.message}</div>
                                            <div className="time">{r.time}</div>
                                        </div>
                                    ))}
                                </>
                            )}
                        </div>
                    </div>
                </>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<ReporterDashboard />);
    </script>
</body>

</html>
