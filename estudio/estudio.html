<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamRadio - Estudio</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0d;
            --bg-panel: #0d1117;
            --bg-card: #111820;
            --bg-hover: #161e2a;
            --border: #1e2a38;
            --border-hi: #2a3a50;
            --amber: #f5a623;
            --amber-dim: #9a6a18;
            --amber-glow: rgba(245, 166, 35, 0.15);
            --red-live: #e8392a;
            --red-glow: rgba(232, 57, 42, 0.2);
            --green: #1db954;
            --green-glow: rgba(29, 185, 84, 0.15);
            --ice: #c8dff0;
            --ice-dim: #5a7a95;
            --text-1: #eef2f7;
            --text-2: #7a95af;
            --text-3: #3d5166;
            --font-ui: 'Barlow Condensed', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-base);
            color: var(--text-1);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            font-size: 15px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.012) 2px, rgba(255, 255, 255, 0.012) 4px);
        }

        /* ── LOBBY ── */
        .lobby-screen {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 40%, #0d1a2a 0%, var(--bg-base) 70%);
        }

        .lobby-box {
            background: var(--bg-panel);
            padding: 50px;
            border-radius: 4px;
            border: 1px solid var(--border-hi);
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .lobby-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--amber), transparent);
        }

        .lobby-box h1 {
            font-size: 3rem;
            margin: 0 0 6px 0;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-1);
        }

        .lobby-box h1 span {
            color: var(--amber);
        }

        .lobby-box p {
            color: var(--text-2);
            margin-bottom: 32px;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .lobby-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-hi);
            color: var(--text-1);
            padding: 14px 16px;
            border-radius: 3px;
            font-size: 1.1rem;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
            font-family: var(--font-mono);
            letter-spacing: 0.2em;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .lobby-input:focus {
            outline: none;
            border-color: var(--amber);
            box-shadow: 0 0 0 2px var(--amber-glow);
        }

        .lobby-btn {
            width: 100%;
            background: var(--amber);
            color: #0a0600;
            border: none;
            padding: 18px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-family: var(--font-ui);
            transition: all 0.15s;
        }

        .lobby-btn:hover {
            background: #ffbe4a;
            box-shadow: 0 0 24px var(--amber-glow);
        }

        /* ── DASHBOARD ── */
        .dashboard {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            padding: 0 28px;
            height: 52px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--amber);
        }

        .logo small {
            font-size: 0.65rem;
            color: var(--text-3);
            margin-left: 10px;
            font-weight: 400;
            letter-spacing: 0.1em;
            font-family: var(--font-mono);
        }

        .top-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .connection-error {
            color: var(--amber);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px 10px;
            background: var(--amber-glow);
            border-radius: 2px;
            border: 1px solid var(--amber-dim);
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
        }

        .room-code {
            color: var(--text-3);
            font-size: 0.8rem;
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
        }

        .room-code b {
            color: var(--ice);
            margin-left: 6px;
        }

        .online-status {
            color: var(--green);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-family: var(--font-mono);
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── LEFT PANEL ── */
        .info-panel {
            width: 270px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .info-panel h2 {
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 18px;
            text-transform: uppercase;
            color: var(--text-3);
            letter-spacing: 0.2em;
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box {
            background: var(--bg-card);
            border-radius: 3px;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .info-label {
            font-size: 0.65rem;
            color: var(--text-3);
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .info-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text-1);
            line-height: 1;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            padding: 10px 14px;
            background: var(--green-glow);
            border-radius: 3px;
            border: 1px solid var(--green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: blink 1.2s steps(1) infinite;
            flex-shrink: 0;
        }

        .status-text {
            font-weight: 700;
            color: var(--green);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            font-family: var(--font-mono);
        }

        .ifb-control {
            margin-top: 14px;
            padding: 14px;
            background: var(--bg-card);
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        .ifb-title {
            font-size: 0.65rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: var(--text-2);
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .mic-btn {
            width: 100%;
            padding: 12px;
            border-radius: 3px;
            border: 1px solid var(--border);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.8rem;
            transition: all 0.2s;
            font-family: var(--font-ui);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .mic-btn.off {
            background: var(--bg-base);
            color: var(--text-2);
        }

        .mic-btn.on {
            background: var(--red-live);
            color: white;
            border-color: var(--red-live);
            box-shadow: 0 0 16px var(--red-glow);
            animation: blink-border 1s steps(1) infinite;
        }

        .mic-hint {
            font-size: 0.7rem;
            color: var(--text-3);
            margin-top: 8px;
            text-align: center;
            font-family: var(--font-mono);
        }

        .listening-info {
            margin-top: 14px;
            padding: 14px;
            background: var(--green-glow);
            border-radius: 3px;
            border: 1px solid var(--green);
        }

        .listening-label {
            font-size: 0.65rem;
            color: var(--text-3);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .listening-name {
            font-weight: 700;
            color: var(--green);
            font-size: 1rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .vu-container {
            width: 100%;
            height: 6px;
            background: var(--bg-base);
            border-radius: 0;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .vu-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--green) 0%, var(--amber) 70%, var(--red-live) 100%);
            transition: width 0.05s;
        }

        /* ── CENTER ── */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            min-width: 0;
        }

        .tabs {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .tab {
            padding: 14px 24px;
            background: none;
            border: none;
            color: var(--text-3);
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: all 0.2s;
            font-family: var(--font-ui);
            letter-spacing: 0.12em;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--amber);
            border-bottom-color: var(--amber);
            background: var(--bg-base);
        }

        .panel-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .rx-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            padding: 18px;
            overflow-y: auto;
            height: 100%;
        }

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            color: var(--text-3);
            margin-top: 60px;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            letter-spacing: 0.1em;
        }

        .rx-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 18px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .rx-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--border-hi);
            transition: background 0.2s;
        }

        .rx-card.live {
            border-color: var(--red-live);
            background: rgba(232, 57, 42, 0.04);
        }

        .rx-card.live::before {
            background: var(--red-live);
            box-shadow: 0 0 10px var(--red-glow);
        }

        .rx-card.listening {
            border-color: var(--green);
            box-shadow: 0 0 20px var(--green-glow);
        }

        .rx-card.listening::before {
            background: var(--green);
        }

        .on-air-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--red-live);
            color: white;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.65rem;
            font-weight: 700;
            animation: blink 1s steps(1) infinite;
            letter-spacing: 0.12em;
            font-family: var(--font-mono);
        }

        .rx-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .rx-name {
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-hi);
            flex-shrink: 0;
        }

        .led.red {
            background: var(--red-live);
            box-shadow: 0 0 8px var(--red-live);
            animation: blink 1.5s steps(1) infinite;
        }

        .live-tag {
            background: var(--red-live);
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 2px;
            margin-left: 6px;
            font-weight: 700;
            letter-spacing: 0.1em;
            font-family: var(--font-mono);
        }

        .rx-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .rx-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px;
            border-radius: 2px;
            font-weight: 700;
            border: 1px solid var(--border);
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            transition: all 0.15s;
            font-family: var(--font-ui);
            letter-spacing: 0.1em;
            background: var(--bg-base);
            color: var(--text-2);
        }

        .rx-btn.play {
            background: var(--green);
            color: #000;
            border-color: var(--green);
        }

        .rx-btn.play:hover {
            box-shadow: 0 0 16px var(--green-glow);
        }

        .rx-btn.stop {
            background: var(--red-live);
            color: white;
            border-color: var(--red-live);
        }

        .rx-btn:disabled {
            background: var(--bg-card);
            color: var(--text-3);
            cursor: not-allowed;
        }

        .rx-dismiss {
            width: 100%;
            margin-top: 8px;
            padding: 6px;
            border-radius: 2px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-3);
            font-size: 0.7rem;
            cursor: pointer;
            font-family: var(--font-mono);
            letter-spacing: 0.05em;
        }

        .rx-dismiss:hover {
            color: var(--text-2);
            border-color: var(--border-hi);
        }

        .alert-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .alert-btn-studio {
            flex: 1;
            padding: 11px;
            border-radius: 2px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.75rem;
            transition: all 0.2s;
            font-family: var(--font-ui);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.1em;
        }

        .alert-btn-studio.attention {
            background: var(--amber);
            color: #000;
        }

        .alert-btn-studio.on-air {
            background: var(--red-live);
            color: white;
            animation: blink-border 1s steps(1) infinite;
            box-shadow: 0 0 16px var(--red-glow);
        }

        .alert-btn-studio:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            animation: none;
            box-shadow: none;
        }

        .ifb-status-bar {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(29, 185, 84, 0.08);
            border: 1px solid var(--green);
            border-radius: 2px;
            font-size: 0.7rem;
            color: var(--green);
            text-align: center;
            font-family: var(--font-mono);
            letter-spacing: 0.08em;
        }

        /* ── RIGHT PANEL ── */
        .alerts-panel {
            width: 320px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .alerts-header {
            padding: 16px 20px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .alerts-header h2 {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-2);
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .unread-badge {
            background: var(--red-live);
            color: white;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: var(--font-mono);
        }

        .alerts-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
        }

        .alert-card {
            background: var(--bg-card);
            border-radius: 2px;
            padding: 14px;
            margin-bottom: 10px;
            border-left: 3px solid;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .alert-card:hover {
            background: var(--bg-hover);
        }

        .alert-card.high {
            border-left-color: var(--red-live);
            background: rgba(232, 57, 42, 0.06);
        }

        .alert-card.medium {
            border-left-color: var(--amber);
            background: rgba(245, 166, 35, 0.06);
        }

        .alert-card.normal {
            border-left-color: var(--ice-dim);
            background: rgba(200, 223, 240, 0.04);
        }

        .alert-card.ack {
            opacity: 0.4;
            border-left-color: var(--border) !important;
        }

        .alert-pulse {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 8px;
            height: 8px;
            background: var(--red-live);
            border-radius: 50%;
            animation: blink 1s steps(1) infinite;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .alert-reporter {
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .alert-time {
            font-size: 0.7rem;
            color: var(--text-3);
            font-family: var(--font-mono);
        }

        .alert-type {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.08em;
        }

        .alert-message {
            font-size: 0.85rem;
            color: var(--text-2);
            line-height: 1.4;
        }

        /* ── CHAT ── */
        .chat-section {
            height: 210px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .chat-header-small {
            padding: 10px 18px;
            background: var(--bg-panel);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            color: var(--text-3);
            letter-spacing: 0.18em;
            font-family: var(--font-mono);
        }

        .chat-messages-small {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-msg-small {
            background: var(--bg-card);
            padding: 9px 12px;
            border-radius: 2px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
        }

        .chat-msg-small .sender {
            font-weight: 700;
            color: var(--amber);
            font-size: 0.65rem;
            margin-bottom: 3px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: var(--font-mono);
        }

        .chat-input-small {
            display: flex;
            padding: 10px;
            background: var(--bg-panel);
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        .chat-input-small input {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 9px 12px;
            border-radius: 2px;
            font-size: 0.9rem;
            font-family: var(--font-ui);
        }

        .chat-input-small input:focus {
            outline: none;
            border-color: var(--amber);
        }

        .chat-input-small button {
            background: var(--amber);
            color: #000;
            border: none;
            padding: 9px 16px;
            border-radius: 2px;
            font-weight: 700;
            cursor: pointer;
            font-family: var(--font-ui);
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--bg-panel);
            padding: 28px;
            border-radius: 3px;
            max-width: 480px;
            width: 100%;
            border: 1px solid var(--border-hi);
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7);
        }

        .modal h2 {
            margin: 0 0 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            letter-spacing: 0.05em;
        }

        .modal-details {
            margin-bottom: 20px;
            padding: 14px;
            background: var(--bg-base);
            border-radius: 2px;
            border: 1px solid var(--border);
        }

        .modal-details p {
            margin: 7px 0;
            line-height: 1.5;
            font-size: 0.9rem;
            color: var(--text-2);
        }

        .modal-details p strong {
            color: var(--text-1);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .quick-responses {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0;
        }

        .quick-responses button {
            background: var(--bg-card);
            border: 1px solid var(--border-hi);
            color: var(--text-1);
            padding: 8px 14px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
            font-family: var(--font-ui);
        }

        .quick-responses button:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .response-input {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-1);
            padding: 14px;
            border-radius: 2px;
            margin-bottom: 14px;
            resize: vertical;
            min-height: 80px;
            font-size: 0.9rem;
            font-family: var(--font-ui);
        }

        .response-input:focus {
            outline: none;
            border-color: var(--amber);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 2px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-ui);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--amber);
            color: #000;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-2);
            border: 1px solid var(--border);
        }

        /* ── AUDIO UNLOCK ── */
        .audio-unlock-banner {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--amber);
            color: #000;
            padding: 14px 28px;
            border-radius: 2px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 0 30px var(--amber-glow);
            border: none;
            font-family: var(--font-ui);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.7
            }
        }

        @keyframes blink {

            0%,
            49% {
                opacity: 1
            }

            50%,
            100% {
                opacity: 0
            }
        }

        @keyframes blink-border {

            0%,
            49% {
                box-shadow: 0 0 16px var(--red-glow)
            }

            50%,
            100% {
                box-shadow: none
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-hi);
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const StudioDashboard = () => {
            const [inRoom, setInRoom] = useState(false);
            const [roomCode, setRoomCode] = useState('');
            const [studioName, setStudioName] = useState('');
            const [reporters, setReporters] = useState({});
            const [listeningTo, setListeningTo] = useState(null);
            const [rxLevel, setRxLevel] = useState(0);
            const [alerts, setAlerts] = useState([]);
            const [unreadAlerts, setUnreadAlerts] = useState(0);
            const [selectedAlert, setSelectedAlert] = useState(null);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [studioMicActive, setStudioMicActive] = useState(false);
            const [alertSent, setAlertSent] = useState({});
            const [connectionError, setConnectionError] = useState(null);
            const [audioBlocked, setAudioBlocked] = useState(false);

            const peerRef = useRef(null);
            const mqttRef = useRef(null);
            const audioRef = useRef(null);
            const analyserRef = useRef(null);
            const animationFrameRef = useRef(null);
            const studioMicRef = useRef(null);
            const audioCtxRef = useRef(null);
            const listeningToRef = useRef(null);
            const responseInputRef = useRef(null);
            const sourceRef = useRef(null);
            const globalStreams = useRef(new Map());
            const globalCalls = useRef(new Map());

            // Generar código de sala al montar
            useEffect(() => {
                setRoomCode(Math.random().toString(36).substring(2, 6).toUpperCase());
            }, []);

            // Mantener ref sincronizado
            useEffect(() => { listeningToRef.current = listeningTo; }, [listeningTo]);

            // ── AudioContext centralizado ─────────────────────────────────────────────
            const getAudioCtx = useCallback(async () => {
                if (!audioCtxRef.current) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    audioCtxRef.current = new AudioCtx();
                }
                if (audioCtxRef.current.state === 'suspended') {
                    await audioCtxRef.current.resume();
                }
                return audioCtxRef.current;
            }, []);

            // ── Silenciar IFB hacia el reportero ─────────────────────────────────────
            const createSilentStream = () => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!audioCtxRef.current) audioCtxRef.current = new AudioCtx();
                    const ctx = audioCtxRef.current;
                    const dest = ctx.createMediaStreamDestination();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0; // Silencio total para mantener WebRTC vivo
                    osc.connect(gain);
                    gain.connect(dest);
                    osc.start();
                    return dest.stream;
                } catch (e) { return new MediaStream(); }
            };

            // ── Conectar al hub ───────────────────────────────────────────────────────
            const joinRoom = async () => {
                if (!roomCode.trim() || !studioName.trim()) return alert('Completá todos los campos');

                // Pedir micrófono (para IFB de retorno)
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    studioMicRef.current = stream;
                    setStudioMicActive(true);
                } catch (e) {
                    console.warn('Sin micrófono: IFB desactivado.');
                    studioMicRef.current = null;
                    setStudioMicActive(false);
                }

                const studioPeerId = `studio_${roomCode}`;
                const peer = new Peer(studioPeerId, {
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });
                peerRef.current = peer;

                peer.on('error', err => {
                    console.error('PeerJS:', err);
                    if (err.type === 'unavailable-id') {
                        setConnectionError('Sala ocupada. Cambiá el código e intentá de nuevo.');
                    } else {
                        setConnectionError(`Error PeerJS: ${err.type}`);
                    }
                });

                peer.on('open', () => {
                    setConnectionError(null);
                    initMQTT();
                    setInRoom(true);
                });

                // Recibir llamadas entrantes de reporteros
                peer.on('call', call => {
                    const answerStream = studioMicRef.current || createSilentStream();
                    call.answer(answerStream);
                    globalCalls.current.set(call.peer, call);

                    call.on('stream', remoteStream => {
                        globalStreams.current.set(call.peer, remoteStream);
                        setReporters(prev => ({
                            ...prev,
                            [call.peer]: { ...prev[call.peer], hasAudio: true }
                        }));
                    });

                    call.on('error', err => console.error('Call error:', err));

                    call.on('close', () => {
                        globalStreams.current.delete(call.peer);
                        globalCalls.current.delete(call.peer);
                        if (listeningToRef.current === call.peer) stopListening();
                        setReporters(prev => {
                            const s = { ...prev };
                            if (s[call.peer]) s[call.peer] = { ...s[call.peer], hasAudio: false };
                            return s;
                        });
                    });
                });
            };

            // ── MQTT ─────────────────────────────────────────────────────────────────
            const initMQTT = () => {
                const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                    clientId: `mqtt_studio_${Math.random().toString(16).substr(2, 8)}`,
                    reconnectPeriod: 3000,
                    will: {
                        topic: `radio/${roomCode}/studio`,
                        payload: JSON.stringify({ status: 'offline' }),
                        retain: true
                    }
                });
                mqttRef.current = client;

                client.on('connect', () => {
                    setConnectionError(null);
                    client.subscribe(`radio/${roomCode}/reporters`);
                    client.subscribe(`radio/${roomCode}/alerts`, { qos: 1 });
                    client.subscribe(`radio/${roomCode}/chat`);
                    client.publish(
                        `radio/${roomCode}/studio`,
                        JSON.stringify({ name: studioName, status: 'online', timestamp: Date.now() }),
                        { retain: true }
                    );
                });

                client.on('error', err => { console.error('MQTT:', err); setConnectionError('Error MQTT.'); });
                client.on('offline', () => setConnectionError('Desconectado. Reconectando...'));

                client.on('message', (topic, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        if (topic.endsWith('/reporters')) {
                            setReporters(prev => ({ ...prev, [data.id]: { ...prev[data.id], ...data } }));
                        }
                        if (topic.endsWith('/alerts')) {
                            handleNewAlert(data);
                        }
                        if (topic.endsWith('/chat')) {
                            setChatMessages(prev => [...prev, data].slice(-100));
                        }
                    } catch (e) { }
                });
            };

            // ── Alerta sonora ─────────────────────────────────────────────────────────
            const handleNewAlert = async alert => {
                setAlerts(prev => [alert, ...prev]);
                setUnreadAlerts(c => c + 1);
                try {
                    const ctx = await getAudioCtx(); // Reutilizamos contexto global
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.value = alert.severity === 'high' ? 880 : 440;
                    gain.gain.setValueAtTime(alert.severity === 'high' ? 0.3 : 0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.5);
                } catch (e) { }
            };

            // ── Stop escucha ──────────────────────────────────────────────────────────
            const stopListening = useCallback(() => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.srcObject = null;
                }
                setListeningTo(null);
                setRxLevel(0);
                if (animationFrameRef.current) {
                    cancelAnimationFrame(animationFrameRef.current);
                    animationFrameRef.current = null;
                }
                if (sourceRef.current) {
                    try { sourceRef.current.disconnect(); } catch (e) { }
                    sourceRef.current = null;
                }
                if (analyserRef.current) {
                    try { analyserRef.current.disconnect(); } catch (e) { }
                    analyserRef.current = null;
                }
            }, []);

            // ── Escuchar reportero ────────────────────────────────────────────────────
            const listenToReporter = useCallback(async (reporterId) => {
                const stream = globalStreams.current.get(reporterId);
                if (!stream) { console.warn('Sin stream para', reporterId); return; }

                // Si ya estaba escuchando a otro, parar
                stopListening();
                setListeningTo(reporterId);

                const el = audioRef.current;
                if (!el) return;

                el.srcObject = stream;

                try {
                    const ctx = await getAudioCtx();
                    el.muted = true; // Mute para evitar latencia HTML5
                    await el.play();
                    setAudioBlocked(false);

                    // VU meter & Realtime audio routing (Cero latencia)
                    if (sourceRef.current) { try { sourceRef.current.disconnect(); } catch (e) { } }
                    if (analyserRef.current) { try { analyserRef.current.disconnect(); } catch (e) { } }

                    const source = ctx.createMediaStreamSource(stream);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;

                    source.connect(analyser);
                    source.connect(ctx.destination); // Salida de audio ultra-rápida

                    sourceRef.current = source;
                    analyserRef.current = analyser;

                    const dataArray = new Uint8Array(analyser.frequencyBinCount);
                    const updateVU = () => {
                        if (!analyserRef.current) return;
                        analyserRef.current.getByteFrequencyData(dataArray);
                        const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                        setRxLevel(avg);
                        animationFrameRef.current = requestAnimationFrame(updateVU);
                    };
                    if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
                    updateVU();

                } catch (e) {
                    console.warn('Autoplay bloqueado:', e);
                    setAudioBlocked(true);
                }
            }, [stopListening, getAudioCtx]);

            // ── Desbloqueo manual de audio ────────────────────────────────────────────
            const unlockAudio = async () => {
                try {
                    await getAudioCtx();
                    const el = audioRef.current;
                    if (el && el.srcObject) {
                        await el.play();
                        setAudioBlocked(false);
                    }
                } catch (e) { console.warn('unlock failed:', e); }
            };

            // ── Toggle micrófono del estudio (IFB) ────────────────────────────────────
            const toggleStudioMic = async () => {
                if (studioMicActive) {
                    // Apagar: detener tracks y enviar silencio
                    if (studioMicRef.current) {
                        studioMicRef.current.getTracks().forEach(t => t.stop());
                        studioMicRef.current = null;
                    }
                    const silentStream = createSilentStream();
                    const silentTrack = silentStream.getAudioTracks()[0] || null;
                    globalCalls.current.forEach(call => {
                        try {
                            call.peerConnection?.getSenders().forEach(sender => {
                                if (sender.track && sender.track.kind === 'audio') {
                                    sender.replaceTrack(silentTrack);
                                }
                            });
                        } catch (e) { console.warn('replaceTrack silent:', e); }
                    });
                    setStudioMicActive(false);
                } else {
                    // Encender: pedir micrófono
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({
                            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                        });
                        studioMicRef.current = stream;
                        const [track] = stream.getAudioTracks();
                        globalCalls.current.forEach(call => {
                            try {
                                call.peerConnection?.getSenders().forEach(sender => {
                                    if (sender.track && sender.track.kind === 'audio') {
                                        sender.replaceTrack(track);
                                    } else if (!sender.track) {
                                        sender.replaceTrack(track);
                                    }
                                });
                            } catch (e) { console.warn('replaceTrack live:', e); }
                        });
                        setStudioMicActive(true);
                    } catch (e) {
                        alert('No se pudo acceder al micrófono');
                    }
                }
            };

            // ── Enviar alerta al reportero ────────────────────────────────────────────
            const sendStudioAlert = (reporterId, type) => {
                if (!mqttRef.current?.connected) return;
                mqttRef.current.publish(
                    `radio/${roomCode}/studio_alert/${reporterId}`,
                    JSON.stringify({ reporterId, type, from: studioName, timestamp: Date.now() }),
                    { qos: 1 } // Garantizar entrega a través de QoS 1
                );
                setAlertSent(prev => ({ ...prev, [reporterId]: { type, time: Date.now() } }));
                setTimeout(() => {
                    setAlertSent(prev => { const s = { ...prev }; delete s[reporterId]; return s; });
                }, 3000);
            };

            // ── Acknowledger alerta ───────────────────────────────────────────────────
            const acknowledgeAlert = ts => {
                setAlerts(prev => prev.map(a => a.timestamp === ts ? { ...a, acknowledged: true } : a));
                setUnreadAlerts(c => Math.max(0, c - 1));
            };

            // ── Responder alerta ──────────────────────────────────────────────────────
            const respondToAlert = msg => {
                if (!selectedAlert || !mqttRef.current?.connected) return;
                mqttRef.current.publish(
                    `radio/${roomCode}/alerts/response`,
                    JSON.stringify({ to: selectedAlert.reporterId, from: studioName, message: msg, timestamp: Date.now() }),
                    { qos: 1 } // Alta prioridad
                );
                setSelectedAlert(null);
            };

            // ── Chat ──────────────────────────────────────────────────────────────────
            const sendChat = e => {
                e.preventDefault();
                if (!chatInput.trim() || !mqttRef.current?.connected) return;
                const payload = {
                    id: Date.now(), sender: studioName, text: chatInput.trim(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                mqttRef.current.publish(`radio/${roomCode}/chat`, JSON.stringify(payload));
                setChatMessages(prev => [...prev, payload]);
                setChatInput('');
            };

            // ── Quitar reportero ──────────────────────────────────────────────────────
            const dismissReporter = id => {
                if (listeningToRef.current === id) stopListening();
                globalStreams.current.delete(id);
                globalCalls.current.delete(id);
                setReporters(prev => { const s = { ...prev }; delete s[id]; return s; });
            };

            // ── Cleanup al desmontar ──────────────────────────────────────────────────
            useEffect(() => {
                return () => {
                    stopListening();
                    if (peerRef.current) { peerRef.current.destroy(); peerRef.current = null; }
                    if (mqttRef.current) { mqttRef.current.end(); mqttRef.current = null; }
                    if (studioMicRef.current) studioMicRef.current.getTracks().forEach(t => t.stop());
                    if (audioCtxRef.current) { try { audioCtxRef.current.close(); } catch (e) { } audioCtxRef.current = null; }
                    globalStreams.current.clear();
                    globalCalls.current.clear();
                };
            }, [stopListening]);

            const getAlertIcon = t => ({ ready: '🎤', problem: '⚠️', visual: '👁️', blocked: '🚧', '5min': '⏱️', custom: '✏️' }[t] || '📢');

            // ── LOBBY ─────────────────────────────────────────────────────────────────
            if (!inRoom) return (
                <div className="lobby-screen">
                    <div className="lobby-box">
                        <h1>STREAM<span>RADIO</span></h1>
                        <p>DASHBOARD DE ESTUDIO RX + IFB + ALERTAS</p>
                        <input className="lobby-input" placeholder="CÓDIGO DE SALA"
                            value={roomCode} onChange={e => setRoomCode(e.target.value.toUpperCase())} />
                        <input className="lobby-input" placeholder="NOMBRE DEL ESTUDIO"
                            value={studioName} onChange={e => setStudioName(e.target.value)} />
                        <button className="lobby-btn" onClick={joinRoom}>ENTRAR AL HUB</button>
                        {connectionError && <p style={{ marginTop: 14, color: 'var(--amber)', fontSize: '0.82rem', fontFamily: 'var(--font-mono)' }}>{connectionError}</p>}
                    </div>
                </div>
            );

            // ── DASHBOARD ────────────────────────────────────────────────────────────
            return (
                <div className="dashboard">
                    <audio ref={audioRef} autoPlay playsInline style={{ display: 'none' }} />

                    {audioBlocked && (
                        <button className="audio-unlock-banner" onClick={unlockAudio}>
                            🔊 Tocá aquí para activar el audio
                        </button>
                    )}

                    <div className="top-bar">
                        <div className="logo">STREAM<span>RADIO</span><small>RX · IFB · ALERTAS</small></div>
                        <div className="top-status">
                            {connectionError && (
                                <span className="connection-error" onClick={() => setConnectionError(null)}>⚠️ {connectionError}</span>
                            )}
                            <span className="room-code">SALA: <b>{roomCode}</b></span>
                            <span className="online-status">● ONLINE</span>
                        </div>
                    </div>

                    <div className="main-content">
                        {/* Panel izquierdo */}
                        <div className="info-panel">
                            <h2>▸ ESTADO DEL SISTEMA</h2>
                            <div className="info-box">
                                <div className="info-label">Móviles Conectados</div>
                                <div className="info-value">{Object.keys(reporters).length}</div>
                            </div>
                            <div className="info-box">
                                <div className="info-label">En Transmisión</div>
                                <div className="info-value" style={{ color: 'var(--red-live)' }}>
                                    {Object.values(reporters).filter(r => r.status === 'live').length}
                                </div>
                            </div>
                            <div className="info-box">
                                <div className="info-label">Alertas Pendientes</div>
                                <div className="info-value" style={{ color: unreadAlerts > 0 ? 'var(--amber)' : 'var(--green)' }}>
                                    {unreadAlerts}
                                </div>
                            </div>
                            <div className="status-indicator">
                                <div className="status-dot" />
                                <div className="status-text">RECEPTOR ACTIVO</div>
                            </div>

                            <div className="ifb-control">
                                <div className="ifb-title">🎙️ MICRÓFONO IFB</div>
                                <button className={`mic-btn ${studioMicActive ? 'on' : 'off'}`} onClick={toggleStudioMic}>
                                    {studioMicActive ? '🔴 MIC ACTIVO' : '⚫ MIC INACTIVO'}
                                </button>
                                <div className="mic-hint">
                                    {studioMicActive ? 'El reportero te escucha' : 'Activar para hablar al reportero'}
                                </div>
                            </div>

                            {listeningTo && (
                                <div className="listening-info">
                                    <div className="listening-label">Escuchando</div>
                                    <div className="listening-name">{reporters[listeningTo]?.name || 'Móvil'}</div>
                                    <div className="vu-container">
                                        <div className="vu-bar" style={{ width: `${Math.min((rxLevel / 128) * 100, 100)}%` }} />
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Panel central */}
                        <div className="center-panel">
                            <div className="tabs">
                                <button className="tab active">📻 MÓVILES ({Object.keys(reporters).length})</button>
                            </div>
                            <div className="panel-content">
                                <div className="rx-grid">
                                    {Object.keys(reporters).length === 0 && (
                                        <div className="empty-state">Esperando móviles en la sala...</div>
                                    )}
                                    {Object.entries(reporters).map(([id, reporter]) => {
                                        const isListening = listeningTo === id;
                                        const hasAudio = reporter.hasAudio || globalStreams.current.has(id);
                                        const sentAlert = alertSent[id];
                                        return (
                                            <div key={id} className={`rx-card ${reporter.status === 'live' ? 'live' : ''} ${isListening ? 'listening' : ''}`}>
                                                {sentAlert && (
                                                    <div className="on-air-indicator">
                                                        {sentAlert.type === 'on_air' ? '🔴 ENVIADO' : '⚠️ ENVIADO'}
                                                    </div>
                                                )}
                                                <div className="rx-header">
                                                    <div className="rx-name">
                                                        <div className={`led ${reporter.status === 'live' ? 'red' : ''}`} />
                                                        {reporter.name || 'Móvil'}
                                                        {reporter.status === 'live' && <span className="live-tag">EN VIVO</span>}
                                                    </div>
                                                </div>
                                                <div className="rx-actions">
                                                    {hasAudio ? (
                                                        isListening ? (
                                                            <>
                                                                <button className="rx-btn stop" onClick={stopListening}>⏹ CORTAR</button>
                                                                <button className="rx-btn play" onClick={() => listenToReporter(id)}>↻ RE-ESCUCHAR</button>
                                                            </>
                                                        ) : (
                                                            <button className="rx-btn play" onClick={() => listenToReporter(id)}>▶ ESCUCHAR</button>
                                                        )
                                                    ) : (
                                                        <button className="rx-btn" disabled>SIN AUDIO</button>
                                                    )}
                                                </div>
                                                {!hasAudio && (
                                                    <button className="rx-dismiss" onClick={() => dismissReporter(id)}>✕ Quitar de la lista</button>
                                                )}
                                                {isListening && (
                                                    <div className="alert-actions">
                                                        <button
                                                            className="alert-btn-studio attention"
                                                            onClick={() => sendStudioAlert(id, 'attention')}
                                                            disabled={sentAlert?.type === 'attention'}>
                                                            ⚠️ {sentAlert?.type === 'attention' ? 'ENVIADO' : 'ATENTO'}
                                                        </button>
                                                        <button
                                                            className="alert-btn-studio on-air"
                                                            onClick={() => sendStudioAlert(id, 'on_air')}
                                                            disabled={sentAlert?.type === 'on_air'}>
                                                            🔴 {sentAlert?.type === 'on_air' ? 'ENVIADO' : 'AL AIRE'}
                                                        </button>
                                                    </div>
                                                )}
                                                {studioMicActive && isListening && (
                                                    <div className="ifb-status-bar">🎧 Retorno activo: el reportero te escucha</div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* Panel derecho - Alertas */}
                        <div className="alerts-panel">
                            <div className="alerts-header">
                                <h2>🚨 ALERTAS DE CAMPO</h2>
                                {unreadAlerts > 0 && <span className="unread-badge">{unreadAlerts}</span>}
                            </div>
                            <div className="alerts-list">
                                {alerts.length === 0 && (
                                    <div style={{ textAlign: 'center', color: 'var(--text-3)', marginTop: 30, fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>Sin alertas recientes</div>
                                )}
                                {alerts.map((alert, i) => (
                                    <div key={i}
                                        className={`alert-card ${alert.severity} ${alert.acknowledged ? 'ack' : ''}`}
                                        onClick={() => { acknowledgeAlert(alert.timestamp); setSelectedAlert(alert); }}>
                                        {!alert.acknowledged && <div className="alert-pulse" />}
                                        <div className="alert-header">
                                            <span className="alert-reporter">{alert.reporterName}</span>
                                            <span className="alert-time">{new Date(alert.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                                        </div>
                                        <div className="alert-type" style={{ color: alert.severity === 'high' ? 'var(--red-live)' : alert.severity === 'medium' ? 'var(--amber)' : 'var(--ice-dim)' }}>
                                            {getAlertIcon(alert.alertId)} {alert.alertLabel}
                                        </div>
                                        <div className="alert-message">{alert.message}</div>
                                    </div>
                                ))}
                            </div>
                            <div className="chat-section">
                                <div className="chat-header-small">💬 CHAT GENERAL</div>
                                <div className="chat-messages-small">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className="chat-msg-small">
                                            <div className="sender">{m.sender}</div>
                                            <div>{m.text}</div>
                                        </div>
                                    ))}
                                </div>
                                <form className="chat-input-small" onSubmit={sendChat}>
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} placeholder="Mensaje..." />
                                    <button type="submit">➤</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    {/* Modal de alerta */}
                    {selectedAlert && (
                        <div className="modal-overlay" onClick={() => setSelectedAlert(null)}>
                            <div className="modal" onClick={e => e.stopPropagation()}>
                                <h2>{getAlertIcon(selectedAlert.alertId)} Alerta de {selectedAlert.reporterName}</h2>
                                <div className="modal-details">
                                    <p><strong>Tipo:</strong> {selectedAlert.alertLabel}</p>
                                    <p><strong>Mensaje:</strong> {selectedAlert.message}</p>
                                    <p><strong>Estado:</strong> {selectedAlert.isLive ? '🔴 Transmitiendo' : '⚫ Standby'}</p>
                                </div>
                                <p style={{ marginBottom: 10, fontWeight: 'bold', fontSize: '0.85rem', color: 'var(--text-2)' }}>Respuesta rápida:</p>
                                <div className="quick-responses">
                                    {['Recibido, aguardamos', '¿Podés acercarte?', 'Tenemos tu señal', 'Volvé al móvil', 'Buscá mejor señal', 'Estamos al aire en 30s'].map((r, i) => (
                                        <button key={i} onClick={() => respondToAlert(r)}>{r}</button>
                                    ))}
                                </div>
                                <textarea ref={responseInputRef} className="response-input"
                                    placeholder="O escribí respuesta personalizada..."
                                    onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); respondToAlert(e.target.value); } }} />
                                <div className="modal-actions">
                                    <button className="btn-secondary" onClick={() => setSelectedAlert(null)}>Cerrar</button>
                                    <button className="btn-primary" onClick={() => respondToAlert(responseInputRef.current?.value ?? '')}>Enviar Respuesta</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<StudioDashboard />);
    </script>
</body>

</html>
